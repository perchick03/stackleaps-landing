<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>StackLeaps Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F2; --paper-2:#FAFBFB; --paper-3:#E0E3E6;
  --ink:#111317; --ink-2:#555B63; --ink-3:#687079;
  --rule:#C6CBD1; --rule-2:#DCE0E4;
  --plum:#5B34D1; --plum-ink:#FFFFFF; --plum-soft:#E6E0FA; --plum-deep:#3A1F9C;
  --sun:#F2B705; --sun-ink:#1A1300; --sun-soft:#FBEFC4; --sun-deep:#A87A00;
  --tangerine:#E8731A; --tangerine-ink:#1A0E03; --tangerine-soft:#FBE3D1; --tangerine-deep:#9A4A0D;
  --green:#1F8A4C; --green-ink:#fff; --green-soft:#D7F0E1; --green-deep:#13602F;
  --blue:#2457D6; --blue-ink:#fff; --blue-soft:#DCE5FA; --blue-deep:#173A96;
  --ink-team:#121212; --ink-team-ink:#fff; --ink-team-soft:#E4E3DE; --ink-team-deep:#000;
  --ok:#137A2B; --note:#B45309; --red:#B91C1C;
  --display:"Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --ui:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter:32px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--sun);color:var(--sun-ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
*{scrollbar-color:var(--rule) transparent;scrollbar-width:thin}
main{max-width:1480px;margin:0 auto;padding:0 var(--gutter) 96px}

/* ── masthead ─────────────────────────────────────────── */
.mast{padding-top:28px;border-bottom:3px solid var(--ink)}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.wordmark{font:900 96px/0.82 var(--display);letter-spacing:-0.02em;margin:0;text-transform:uppercase}
.dateline{text-align:right;font-size:14px;color:var(--ink-2);padding-bottom:6px}
.dateline b{display:block;font:900 32px/1 var(--display);letter-spacing:-.01em;color:var(--ink);text-transform:uppercase;margin-bottom:4px}
.headline{font:500 19px/1.35 var(--ui);letter-spacing:-.005em;margin:18px 0 16px;max-width:72ch;text-wrap:pretty}
.headline b{font-weight:600}
.rail{position:sticky;top:0;z-index:5;display:flex;gap:0;background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter);overflow-x:auto}
.rail a{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 18px 10px 0;margin-right:18px;border-right:1px solid var(--rule);text-decoration:none;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.rail a:last-child{border-right:0}
.rail a:hover{color:var(--ink)}
.rail .n{font:500 12px/1 var(--ui);letter-spacing:0;background:var(--ink);color:var(--paper);padding:3px 6px;min-width:20px;text-align:center}
.rail .n.zero{background:var(--paper-3);color:var(--ink-2)}
.rail .n.hot{background:var(--red)}

/* ── sections ─────────────────────────────────────────── */
section{padding-top:44px}
.sec{display:flex;align-items:baseline;gap:14px;margin:0 0 14px;font:900 34px/1 var(--display);letter-spacing:-.005em;text-transform:uppercase}
.sec .sub{font:400 13px/1.4 var(--ui);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.sec .count{font:700 14px/1 var(--ui);background:var(--ink);color:var(--paper);padding:5px 8px;position:relative;top:-6px}
.empty{padding:28px 0;color:var(--ink-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

/* ── plates (scoreline) ───────────────────────────────── */
.plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:24px;padding-top:24px}
.plate{background:var(--paper-2);border:1px solid var(--ink);display:flex;flex-direction:column}
.plate-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 18px 10px;background:var(--team);color:var(--team-ink)}
.plate-head h2{margin:0;font:900 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.plate-head span{font:500 12px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;opacity:.85;text-align:right}
.score{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
.score-col{padding:12px 18px 14px;border-right:1px solid var(--rule)}
.score-col:last-child{border-right:0}
.score-col .lab{font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--rule-2);margin-bottom:8px}
.score-col .fig{font:900 72px/.9 var(--display);letter-spacing:-.01em;font-variant-numeric:proportional-nums;color:var(--ink)}
.score-col .delta{margin-top:8px;font-size:12px;color:var(--ink-2)}
.score-col .delta.up{color:var(--ok)} .score-col .delta.down{color:var(--note)}
.form{padding:14px 18px 10px}
.form .form-lab{display:flex;justify-content:space-between;font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.form svg{display:block;width:100%;height:88px;overflow:visible}
.form .bar{fill:var(--team)} .form .bar.last{fill:var(--team-deep)} .form .bar.off{fill:var(--paper-3)}
.form .bar.hit{opacity:.85}
.form .daylab{font:500 10px var(--ui);fill:var(--ink-3);text-anchor:middle}
.form .vlab{font:600 11px var(--ui);fill:var(--ink);text-anchor:middle}
.form .axis{stroke:var(--rule);stroke-width:1}
.plate-foot{margin-top:auto;padding:12px 18px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;font-size:13px;color:var(--ink-2)}
.plate-foot b{color:var(--ink);font-weight:600}
.meter{margin-top:6px;height:8px;background:var(--team-soft);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--team)}
.meter i.over{background:var(--red)}
.plate-foot .m{display:block}

/* ── leads queue ──────────────────────────────────────── */
.hint{margin:-6px 0 14px;font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px/1 var(--ui);border:1px solid var(--rule);border-bottom-width:2px;padding:2px 5px;margin:0 2px;background:var(--paper-2)}
.queue{border-top:1px solid var(--ink)}
.group-lab{font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.lead{display:grid;grid-template-columns:132px 340px 1fr 150px;gap:10px 22px;padding:14px 0;border-bottom:1px solid var(--rule);position:relative;cursor:default}
.lead.focus{background:var(--paper-2);outline:2px solid var(--ink);outline-offset:-2px;padding-left:12px;padding-right:12px}
.lead.flash .lead-id{animation:flash .6s ease-out}
@keyframes flash{0%{background:var(--team-soft)}100%{background:transparent}}
.tags{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tag{font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px 3px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}
.tag--hot{background:var(--red);border-color:var(--red);color:#fff}
.tag--fwd{background:var(--ink);color:var(--paper)}
.tag--booked{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.tag--link{border-style:dashed}
.tag--lost,.tag--unread{color:var(--ink-3);border-color:var(--rule)}
.lead-id{display:flex;align-items:center;gap:10px;min-width:0;margin:-4px -6px;padding:4px 6px}
.copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:6px 9px;font:600 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;background:var(--paper-2);flex:0 0 auto;transition:background .15s}
.copy:hover{background:var(--ink);color:var(--paper)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.email{font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--rule)}
.email:hover{border-bottom-color:var(--ink)}
.who{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.who .co{font-weight:400;color:var(--ink-2)}
.chip{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;background:var(--team-soft);color:var(--team-deep)}
.status{font-size:12px;color:var(--ink-3)}
.sum{margin:4px 0 0;color:var(--ink);text-wrap:pretty}
.sum:empty{display:none}
.meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.meta a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-bottom:1px solid var(--rule);color:var(--ink)}
.meta a svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8}
.last{grid-column:1 / -1;margin:2px 0 0;padding:10px 14px;background:var(--paper-2);border:1px solid var(--rule-2);font-size:13px;color:var(--ink-2);max-height:9em;overflow:hidden;position:relative;cursor:pointer}
.last .subj{font-weight:600;color:var(--ink);margin-bottom:4px}
.last pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.last::after{content:"";position:absolute;inset:auto 0 0 0;height:28px;background:linear-gradient(transparent,var(--paper-2))}
.lead.open .last{max-height:none}
.lead.open .last::after{display:none}
.lost-list{margin:0;padding:10px 0 0;list-style:none;font-size:13px;color:var(--ink-2)}
.lost-list li{display:flex;gap:16px;padding:6px 0;border-bottom:1px solid var(--rule-2)}
details.lost summary{cursor:pointer;padding:12px 0;font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

/* ── calls ────────────────────────────────────────────── */
.calls{display:grid;grid-template-columns:1fr 460px;gap:28px;align-items:start}
.call{display:grid;grid-template-columns:150px 1fr;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--rule)}
.call:first-child{border-top:1px solid var(--ink)}
.call .t{font:900 28px/1 var(--display);letter-spacing:.01em}
.call .t small{display:block;font:500 12px/1.3 var(--ui);color:var(--ink-2);margin-top:4px}
.call .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.call .who{font-size:15px}
.call .note{color:var(--ink-2);margin:2px 0 0}
.call .files{font-size:12px;color:var(--ink-3);margin-top:4px}
.call.today .d{color:var(--ok)}
.wa{border:1px solid var(--ink);background:var(--paper-2)}
.wa header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ink);font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.wa pre{margin:0;padding:16px 14px;font:400 14px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* ── tables ───────────────────────────────────────────── */
.scroll{overflow-x:auto;margin-bottom:28px}
table.agate{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--ink)}
.agate th{font:600 11px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:9px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.agate th:first-child,.agate td:first-child{text-align:left;padding-left:0}
.agate td{padding:8px 10px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap}
.agate tr.total td{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:600}
.agate td.l{text-align:left}
.agate .dim{color:var(--ink-3)}
.agate .bad{color:var(--red);font-weight:600}
.agate .warn{color:var(--note);font-weight:600}
.agate .teamcell{font-weight:600}
.agate .rank{display:inline-block;min-width:22px;font:900 16px/1 var(--display);color:var(--ink-2)}
.agate td small{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase}
.team-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.team-head h3{margin:0;font:900 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;background:var(--team);color:var(--team-ink);padding:6px 10px 5px}
.team-head span{font-size:13px;color:var(--ink-2)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.verdict i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.verdict.ok i{background:var(--ok)} .verdict.note i{background:var(--note)} .verdict.red i{background:var(--red)}
.verdict.ok{color:var(--ok)} .verdict.note{color:var(--note)} .verdict.red{color:var(--red)}
.verdict small{font:500 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.trend{border:1px solid var(--rule);border-top:0;background:var(--paper-2);padding:12px 14px 10px;margin:-28px 0 12px}
.trend .lab{font:600 11px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.trend svg{display:block;width:100%;height:100px}
.trend path{fill:none;stroke:var(--team-deep);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.trend line{vector-effect:non-scaling-stroke}
.trend .area{fill:var(--team-soft);stroke:none}
.trend .pt{fill:var(--team-deep)}
.trend .g{stroke:var(--rule-2)} .trend .lim{stroke:var(--red);stroke-dasharray:3 3}
.trend .ax{font:500 10px var(--ui);fill:var(--ink-3)}
.drift{font-size:12px;color:var(--note);margin:6px 0 0}

/* ── footer ───────────────────────────────────────────── */
footer{margin-top:64px;border-top:3px solid var(--ink);padding-top:14px;font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:18px;flex-wrap:wrap}

/* tooltip */
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 10px;font-size:12px;line-height:1.4;display:none;max-width:240px}
.tip b{display:block;font-weight:600;color:#fff}

/* team scopes */
.plum{--team:var(--plum);--team-ink:var(--plum-ink);--team-soft:var(--plum-soft);--team-deep:var(--plum-deep)}
.sun{--team:var(--sun);--team-ink:var(--sun-ink);--team-soft:var(--sun-soft);--team-deep:var(--sun-deep)}
.tangerine{--team:var(--tangerine);--team-ink:var(--tangerine-ink);--team-soft:var(--tangerine-soft);--team-deep:var(--tangerine-deep)}
.green{--team:var(--green);--team-ink:var(--green-ink);--team-soft:var(--green-soft);--team-deep:var(--green-deep)}
.blue{--team:var(--blue);--team-ink:var(--blue-ink);--team-soft:var(--blue-soft);--team-deep:var(--blue-deep)}
.ink{--team:var(--ink-team);--team-ink:var(--ink-team-ink);--team-soft:var(--ink-team-soft);--team-deep:var(--ink-team-deep)}

@media (max-width:1100px){
  .calls{grid-template-columns:1fr}
  .lead{grid-template-columns:120px 1fr;}
  .lead .meta{grid-column:2;text-align:left}
}
@media (max-width:720px){
  :root{--gutter:16px}
  .wordmark{font-size:64px}
  .dateline{text-align:left}
  .dateline b{font-size:24px}
  .headline{font-size:16px}
  .plates{grid-template-columns:1fr}
  .score-col{padding:10px 12px}
  .score-col .lab{min-height:2.4em}
  .score-col .fig{font-size:44px}
  .form .form-lab{flex-wrap:wrap;gap:4px 12px}
  .plate-foot{grid-template-columns:1fr}
  .lead{grid-template-columns:1fr;gap:8px}
  .lead .meta{grid-column:1}
  .tags{flex-direction:row;flex-wrap:wrap}
  .call{grid-template-columns:1fr}
  .sec{font-size:28px}
  .scroll{position:relative}
  .scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,transparent,var(--paper));pointer-events:none}
  .agate th:first-child,.agate td:first-child{position:sticky;left:0;background:var(--paper);padding-right:12px;max-width:170px;white-space:normal;line-height:1.3}
}
@media (prefers-reduced-motion:reduce){
  .lead.flash .lead-id{animation:none;background:var(--team-soft)}
  .copy{transition:none}
}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const pct = (n, d, dp = 1) => d ? (100 * n / d).toFixed(dp) + '%' : '–';
const p1 = v => v == null ? '–' : Number(v).toFixed(1) + '%';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pr = v => v == null ? '–' : (v < 1 ? Number(v).toFixed(2) : Number(v).toFixed(1)) + '%';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const d = iso => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
const longDate = iso => { const x = d(iso); return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const shortDate = iso => { const x = d(iso); return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}`; };
const teamName = g => g.name.replace(/ pilot$/i, '').toUpperCase();
const lastWD = shortDate(D.last_workday);
const prevWD = shortDate(D.prev_workday || D.last_workday);
const ago = n => n == null ? '' : n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n}d ago`;

// ── headline ──────────────────────────────────────────────
function headline() {
  const parts = D.groups.map(g => `<b>${esc(teamName(g))}</b> sent ${fmt(g.last.sent)}${g.last.sent ? ` (${pct(g.last.bounced, g.last.sent)} bounced, ${fmt(g.last.replies)} repl${g.last.replies === 1 ? 'y' : 'ies'})` : ''}`);
  const booked = D.groups.reduce((a, g) => a + g.last.booked, 0);
  const hot = D.leads.filter(l => l.flags.includes('hot')).length;
  const need = D.leads.filter(l => !l.flags.includes('lost')).length;
  const calls = D.calls.filter(c => c.today);
  const contacts = [...new Set(calls.map(c => c.contact))];
  let s = `On ${lastWD} ${parts.join('; ')}${booked ? `; <b>${booked} booking${booked > 1 ? 's' : ''}</b>` : ''}. `;
  s += need ? `<b>${need} lead${need > 1 ? 's' : ''} need${need > 1 ? '' : 's'} you</b>${hot ? `, ${hot} hot` : ''}` : 'Nothing is waiting on you';
  s += calls.length ? `, and ${contacts.map(c => `${c} has ${calls.filter(x => x.contact === c).length} call${calls.filter(x => x.contact === c).length > 1 ? 's' : ''}`).join(', ')} today.` : '.';
  return s;
}

// ── scoreline plate ───────────────────────────────────────
function formGuide(g) {
  const s = g.series.slice(-14);
  if (!s.length) return '<p class="empty">No daily series.</p>';
  const W = 600, H = 88, top = 16, base = 70, gap = 6, bw = (W - gap * (s.length - 1)) / s.length;
  const max = Math.max(1, ...s.map(x => x.sent));
  let out = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emails sent per day, last 14 days">`;
  s.forEach((x, i) => {
    const h = x.sent ? Math.max(2, (base - top) * x.sent / max) : 0;
    const xx = i * (bw + gap);
    const cls = x.date === D.last_workday ? 'bar last' : (x.sent ? 'bar' : 'bar off');
    const dow = d(x.date).getDay();
    out += x.sent
      ? `<rect class="${cls}" x="${xx.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" data-tip="<b>${shortDate(x.date)}</b>sent ${fmt(x.sent)}<br>replies ${fmt(x.replies)}<br>new leads ${fmt(x.contacted)}"/>`
      : `<rect class="${cls}" x="${xx.toFixed(1)}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" data-tip="<b>${shortDate(x.date)}</b>no sends"/>`;
    if (x.date === D.last_workday) out += `<text class="vlab" x="${(xx + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}">${fmt(x.sent)}</text>`;
    out += `<text class="daylab" x="${(xx + bw / 2).toFixed(1)}" y="${H - 4}">${'SMTWTFS'[dow]}</text>`;
  });
  out += `<line class="axis" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"/></svg>`;
  return out;
}
function plate(g) {
  const L = g.last, M = g.month, A = g.alltime, C = g.capacity;
  const delta = L.sent - L.prev_sent;
  const used = C.daily_limit ? L.sent / C.daily_limit : 0;
  const cols = [
    ['Sent', fmt(L.sent), !L.prev_sent ? `<span class="delta">no sends on ${prevWD}</span>` : delta ? `<span class="delta ${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${fmt(delta)} vs ${prevWD}</span>` : `<span class="delta">same as ${prevWD}</span>`],
    ['Replies', fmt(L.replies), `<span class="delta">${pct(L.replies, L.sent)} of sent</span>`],
    ['Contacted', fmt(L.contacted), `<span class="delta">${fmt(A.left)} left to contact</span>`],
    ['Booked', fmt(L.booked), `<span class="delta">${fmt(M.booked)} this month</span>`],
  ];
  return `<article class="plate ${g.color}">
    <header class="plate-head"><h2>${esc(teamName(g))}</h2><span>${lastWD} · ${g.subs.length} sub-campaign${g.subs.length > 1 ? 's' : ''} · ${esc(g.client)}</span></header>
    <div class="score">${cols.map(([l, v, dd]) => `<div class="score-col"><div class="lab">${l}</div><div class="fig">${v}</div>${dd}</div>`).join('')}</div>
    <div class="form"><div class="form-lab"><span>Form · sent per day · 14 days</span><span>bounced ${fmt(L.bounced)} on ${lastWD}</span></div>${formGuide(g)}</div>
    <div class="plate-foot">
      <div><span class="m">Month to date · <b>${fmt(M.sent)}</b> sent · <b>${fmt(M.replies)}</b> replies (${pct(M.replies, M.sent)}) · <b>${fmt(M.bounced)}</b> bounced (${pct(M.bounced, M.sent)}) · <b>${fmt(M.booked)}</b> booked</span></div>
      <div><span class="m">Capacity · <b>${fmt(L.sent)}</b> of <b>${fmt(C.daily_limit)}</b>/day (${C.active} active inboxes${C.errors ? `, <span class="bad">${C.errors} in error</span>` : ''})</span><div class="meter"><i class="${used > 1 ? 'over' : ''}" style="width:${Math.min(100, used * 100).toFixed(1)}%"></i></div></div>
      <div><span class="m">Leads · <b>${fmt(A.left)}</b> left of <b>${fmt(A.leads)}</b> in the pool${A.left && L.contacted ? ` (~${Math.ceil(A.left / L.contacted)} send days)` : A.left ? '' : ' · <span class="bad">refill</span>'}</span><div class="meter"><i class="${!A.left ? 'over' : ''}" style="width:${A.leads ? Math.min(100, 100 * (1 - A.left / A.leads)).toFixed(1) : 0}%"></i></div></div>
      <div><span class="m">Replies · <b>${fmt(A.unique_replies)}</b> unique all-time (${pct(A.unique_replies, A.contacted)} of contacted) · booking rate <b>${pr(A.booking_rate)}</b></span></div>
    </div>
  </article>`;
}

// ── leads queue ───────────────────────────────────────────
const TAGS = { hot: ['tag--hot', 'Hot'], booked: ['tag--booked', 'Booked'], reply: ['', 'Reply'], link_sent: ['tag--link', 'Link sent'], unread: ['tag--unread', 'Not synced'], lost: ['tag--lost', 'Lost'] };
const groupOf = l => l.flags.includes('lost') ? 'lost' : l.flags.includes('hot') ? 'Hot' : l.flags.includes('booked') ? 'Booked' : l.flags.includes('reply') ? 'They wrote last' : 'Link sent, waiting';
const color = slug => (D.groups.find(g => g.slug === slug) || {}).color || 'ink';
function leadRow(l, i) {
  const tags = l.flags.filter(f => TAGS[f]).map(f => `<span class="tag ${TAGS[f][0]}">${TAGS[f][1]}</span>`);
  if (l.forward_to) tags.push(`<span class="tag tag--fwd">Fwd ${esc(l.forward_to)}</span>`);
  const quiet = ago(l.days_quiet);
  const who = l.flags.includes('reply') ? `they wrote ${quiet}` : `we wrote ${quiet}${l.link_sent ? ' · link sent' : ''}`;
  const last = l.last_in ? `<div class="last" title="click to expand"><div class="subj">${esc(l.last_in.subject || '(no subject)')} <span class="dim">· ${shortDate(l.last_in.ts.slice(0, 10))}</span></div><pre>${esc(l.last_in.body || '')}</pre></div>` : (l.flags.includes('unread') ? `<div class="last"><pre>Thread not in the store yet (fetch stores only Interested, Booked and Completed leads). Read it in Instantly.</pre></div>` : '');
  return `<article class="lead ${color(l.slug)}" data-i="${i}" data-email="${esc(l.email)}" data-url="${esc(l.unibox_url || '')}" tabindex="0">
    <div class="tags">${tags.join('')}</div>
    <div class="lead-id"><button class="copy" type="button" aria-label="Copy ${esc(l.email)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy</span></button>${l.unibox_url ? `<a class="email" href="${esc(l.unibox_url)}" target="_blank" rel="noopener">${esc(l.email)}</a>` : `<span class="email">${esc(l.email)}</span>`}</div>
    <div class="lead-body"><div class="who">${esc(l.name)} <span class="co">${esc(l.company)}</span> <span class="chip">${esc(l.slug)}</span> <span class="status">${esc(l.status)}</span></div><p class="sum">${esc(l.summary)}</p></div>
    <div class="meta">${who}${l.unibox_url ? `<br><a href="${esc(l.unibox_url)}" target="_blank" rel="noopener">open in Instantly <svg><use href="#i-out"/></svg></a>` : ''}</div>
    ${last}
  </article>`;
}
function leads() {
  const live = D.leads.filter(l => !l.flags.includes('lost'));
  const lost = D.leads.filter(l => l.flags.includes('lost'));
  let out = '';
  if (!live.length) out += `<p class="empty">Nothing is waiting on you. Every thread with their email on top is answered.</p>`;
  let cur = null;
  live.forEach((l, i) => { const g = groupOf(l); if (g !== cur) { out += `<div class="group-lab">${g}</div>`; cur = g; } out += leadRow(l, i); });
  if (lost.length) out += `<details class="lost"><summary>Treated as lost · ${lost.length} · three of our emails in a row, no answer</summary><ul class="lost-list">${lost.map(l => `<li><span>${esc(l.email)}</span><span class="dim">${esc(l.company)}</span><span class="dim">${esc(l.slug)}</span><span class="dim">quiet ${l.days_quiet}d</span></li>`).join('')}</ul></details>`;
  return out;
}

// ── calls ─────────────────────────────────────────────────
function calls() {
  if (!D.calls.length) return `<p class="empty">No calls booked in the next 7 days.</p>`;
  const byContact = {};
  D.calls.forEach(c => (byContact[c.contact] ||= []).push(c));
  return Object.entries(byContact).map(([contact, cs]) => {
    const rows = cs.map(c => `<div class="call ${c.today ? 'today' : ''} ${color(c.slug)}">
      <div><div class="d">${c.today ? 'Today' : shortDate(c.date)}</div><div class="t">${c.client_time}<small>${contact}'s time · ${c.lead_time} ${esc(c.lead_tz)} for ${esc((c.name || '').split(' ')[0])}</small></div></div>
      <div><div class="who">${esc(c.name)} <span class="co">${esc(c.company)}</span> <span class="chip">${esc(c.slug)}</span> <span class="status">${esc(c.status)}</span></div>
        ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
        <div class="files">${c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\/(www\.)?/, ''))}</a> · ` : ''}${c.brief ? `one-pager ${esc(c.brief)}` : '<span class="bad">no one-pager in the store</span>'} · <span class="copy-email" data-email="${esc(c.email)}">${esc(c.email)}</span></div></div>
    </div>`).join('');
    const wa = D.whatsapp[contact];
    return `<h2 class="sec">${esc(contact)}'s calls <span class="sub">${cs.filter(c => c.today).length} today · ${cs.length} in the next 7 days</span></h2>
      <div class="calls"><div>${rows}</div>
      ${wa ? `<aside class="wa"><header><span>WhatsApp to ${esc(contact)}</span><button class="copy" type="button" data-text="${esc(wa)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy message</span></button></header><pre>${esc(wa)}</pre></aside>` : `<aside class="wa"><header><span>WhatsApp to ${esc(contact)}</span></header><pre class="dim">No call today, no morning message.</pre></aside>`}</div>`;
  }).join('');
}

// ── box score ─────────────────────────────────────────────
function boxscore() {
  return D.groups.map(g => {
    const L = g.last, M = g.month;
    const rows = g.subs.map(s => `<tr><td class="l">${esc(s.name)} <span class="dim">${esc(s.status)}</span></td><td>${fmt(s.leads)}</td><td>${fmt(s.contacted)}</td><td class="${s.left === 0 && s.status === 'Active' ? 'bad' : ''}">${fmt(s.left)}${s.left === 0 && s.status === 'Active' ? ' <small>refill</small>' : ''}</td><td>${fmt(s.last_sent)}</td><td>${fmt(s.last_replies)}</td><td>${pct(s.last_replies, s.last_sent)}</td><td class="${s.last_sent && s.last_bounced / s.last_sent > .05 ? 'bad' : s.last_sent && s.last_bounced / s.last_sent > .02 ? 'warn' : ''}">${fmt(s.last_bounced)} <span class="dim">${pct(s.last_bounced, s.last_sent)}</span></td><td>${fmt(s.month_sent)}</td><td>${fmt(s.month_bounced)} <span class="dim">${pct(s.month_bounced, s.month_sent)}</span></td></tr>`).join('');
    const total = `<tr class="total"><td class="l">Total</td><td>${fmt(g.alltime.leads)}</td><td>${fmt(g.alltime.contacted)}</td><td>${fmt(g.alltime.left)}</td><td>${fmt(L.sent)}</td><td>${fmt(L.replies)}</td><td>${pct(L.replies, L.sent)}</td><td>${fmt(L.bounced)} <span class="dim">${pct(L.bounced, L.sent)}</span></td><td>${fmt(M.sent)}</td><td>${fmt(M.bounced)} <span class="dim">${pct(M.bounced, M.sent)}</span></td></tr>`;
    return `<div class="${g.color}"><div class="team-head"><h3>${esc(teamName(g))}</h3><span>${esc(g.client)} · capacity ${fmt(g.capacity.daily_limit)}/day across ${g.capacity.active} active inboxes</span></div>
      <div class="scroll"><table class="agate"><thead><tr><th>Sub-campaign</th><th>Leads</th><th>Contacted</th><th>Left</th><th>Sent ${lastWD}</th><th>Replies</th><th>Reply %</th><th>Bounced</th><th>Sent · month</th><th>Bounced · month</th></tr></thead><tbody>${rows}${total}</tbody></table></div></div>`;
  }).join('');
}

// ── standings ─────────────────────────────────────────────
function standings() {
  const gs = [...D.groups].sort((a, b) => b.alltime.booked_plus - a.alltime.booked_plus);
  const rows = gs.map((g, i) => { const A = g.alltime; return `<tr class="${g.color}"><td class="l teamcell"><b class="rank">${i + 1}</b> <span class="chip">${esc(g.client)}</span> ${esc(teamName(g))}</td><td>${fmt(A.contacted)}</td><td>${fmt(A.unique_replies)} <span class="dim">${pct(A.unique_replies, A.contacted)}</span></td><td>${fmt(A.interested)}</td><td>${fmt(A.booked)}</td><td>${fmt(A.completed)}</td><td>${fmt(A.won)}</td><td>${fmt(A.no_show)}</td><td>${fmt(A.not_interested)}</td><td><b>${fmt(A.booked_plus)}</b> <span class="dim">${pr(A.booking_rate)}</span></td><td><b>${fmt(g.month.booked)}</b></td></tr>`; }).join('');
  return `<div class="scroll"><table class="agate"><thead><tr><th>Team</th><th>Contacted</th><th>Replies</th><th>Interested</th><th>Booked</th><th>Completed</th><th>Won</th><th>No-show</th><th>Not interested</th><th>Meetings · all-time</th><th>Meetings · month</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Meetings = Booked + Completed + Won, by current Instantly status. Month = status changed since ${longDate(D.month_start)}.</p>`;
}

// ── inboxes ───────────────────────────────────────────────
const VERD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'ok', 'look-into': 'note', worry: 'red' };
const driftLine = drift => { const by = {}; drift.forEach(s => { const i = s.indexOf(': '); const dom = i < 0 ? s : s.slice(0, i), why = i < 0 ? '' : s.slice(i + 2); (by[why] ||= []).push(dom); }); return Object.entries(by).map(([why, ds]) => `${ds.length} domain${ds.length > 1 ? 's' : ''} ${esc(why)}: ${ds.map(esc).join(', ')}`).join('<br>'); };
const WORD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'great', 'look-into': 'look', worry: 'low' };
const trendPts = g => (g.health.trend || []).filter(x => x.bounce_pct != null);
function trendLabel(g) {
  const t = trendPts(g);
  if (t.length < 2) return '';
  const last = t[t.length - 1];
  return `${shortDate(t[0].date)} → ${shortDate(last.date)} · now ${last.bounce_pct.toFixed(2)}% · red line = 5%`;
}
function trend(g) {
  const t = trendPts(g);
  if (t.length < 2) return '<p class="dim">Not enough history yet.</p>';
  const W = 1000, H = 100, base = 96, max = Math.max(5.5, ...t.map(x => x.bounce_pct));
  const X = i => i * W / (t.length - 1), Y = v => base - (base - 6) * v / max;
  const pts = t.map((x, i) => `${X(i).toFixed(1)},${Y(x.bounce_pct).toFixed(1)}`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Rolling 14-day bounce rate, one point per snapshot">
    <line class="g" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
    <line class="lim" x1="0" x2="${W}" y1="${Y(5).toFixed(1)}" y2="${Y(5).toFixed(1)}"/>
    <path class="area" d="M${pts[0]} L${pts.join(' L')} L${W},${base} L0,${base} Z"/>
    <path d="M${pts.join(' L')}"/>
  </svg>`;
}
function inboxes() {
  return D.groups.map(g => {
    const h = g.health;
    if (!h) return `<div class="${g.color}"><div class="team-head"><h3>${esc(teamName(g))}</h3><span class="bad">no inbox-health snapshot for this campaign</span></div></div>`;
    const dom = h.domains, al = h.allocation || {};
    const red = dom.filter(x => x.bounce_verdict === 'RED').length, note = dom.filter(x => x.bounce_verdict === 'NOTE').length, bl = dom.filter(x => x.blacklist).length;
    const verdict = (v, word) => `<span class="verdict ${VERD[word] || ''}"><i></i>${p1(v)}${WORD[word] ? ` <small>${WORD[word]}</small>` : ''}</span>`;
    const rows = dom.map(x => `<tr><td class="l">${esc(x.domain)}</td><td class="l dim">${esc(x.state || '–')}</td><td>${fmt(x.inboxes)}</td><td>${fmt(x.capacity || null)}</td><td>${fmt(x.sent)}</td><td>${verdict(x.bounce_pct, x.bounce_verdict)}</td><td>${verdict(x.reply_pct, x.reply_verdict)}</td><td class="l ${x.blacklist ? 'warn' : 'dim'}">${esc(x.blacklist || 'clean')}</td></tr>`).join('');
    return `<div class="${g.color}"><div class="team-head"><h3>${esc(teamName(g))}</h3><span>${dom.length} domains · ${fmt(al.total_inboxes)} inboxes · ${red ? `<span class="bad">${red} red</span> · ` : ''}${note ? `<span class="warn">${note} to watch</span> · ` : ''}${bl ? `${bl} blacklisted` : 'no blacklist hits'} · snapshot ${esc(h.snapshot_date)} ${esc((h.fetched_at || '').slice(11, 16))}${al.active_capacity ? ` · ${Math.round(100 * al.utilisation)}% of ${fmt(al.active_capacity)}/day used` : ''}</span></div>
      <div class="scroll"><table class="agate"><thead><tr><th>Domain</th><th>State</th><th>Inboxes</th><th>Cap/day</th><th>Sent 14d</th><th>Bounce</th><th>Reply</th><th>Blacklist</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="trend"><div class="lab"><span>Bounce · rolling 14 days · one point per snapshot</span><span>${trendLabel(g)}</span></div>${trend(g)}</div>
      <p class="hint">Bounce: <b>red</b> over 5% (past 150 sent), <b>note</b> 2–5%, <b>ok</b> under 2% · Reply: <b>great</b> 2.6% and up, <b>look</b> around 1%, <b>low</b> under 0.8%; no word = too few sends to judge.</p>
      ${h.drift.length ? `<p class="drift">Drift · ${driftLine(h.drift)}</p>` : ''}</div>`;
  }).join('');
}

// ── assemble ──────────────────────────────────────────────
const need = D.leads.filter(l => !l.flags.includes('lost')).length, hot = D.leads.filter(l => l.flags.includes('hot')).length, today = D.calls.filter(c => c.today).length;
const n = (v, extra = '') => `<span class="n ${v ? extra : 'zero'}">${v}</span>`;
$('#app').innerHTML = `
<header class="mast">
  <div class="mast-row">
    <h1 class="wordmark">Daily</h1>
    <div class="dateline"><b>${DAYNAMES[d(D.date).getDay()]}</b>StackLeaps · ${longDate(D.date)} · built ${esc(D.built_at)} · last work day ${lastWD}</div>
  </div>
  <p class="headline">${headline()}</p>
  <nav class="rail"><a href="#scoreline">Scoreline</a><a href="#leads">Needs you ${n(need, hot ? 'hot' : '')}</a><a href="#calls">Calls ${n(today)}</a><a href="#boxscore">Box score</a><a href="#standings">Standings</a><a href="#inboxes">Inboxes</a></nav>
</header>
<section id="scoreline"><div class="plates">${D.groups.map(plate).join('')}</div></section>
<section id="leads"><h2 class="sec">Needs you <span class="count">${need}</span><span class="sub">their email is newest (last ${D.window_days} days), or we sent the Calendly link and they went quiet</span></h2>
  <p class="hint"><kbd>j</kbd><kbd>k</kbd> move · <kbd>c</kbd> copy email · <kbd>o</kbd> open in Instantly · <kbd>enter</kbd> expand their last email</p>
  <div class="queue">${leads()}</div></section>
<section id="calls">${calls()}</section>
<section id="boxscore"><h2 class="sec">Box score <span class="sub">per sub-campaign · ${lastWD} and month to date</span></h2>${boxscore()}</section>
<section id="standings"><h2 class="sec">Standings <span class="sub">all-time, by current lead status</span></h2>${standings()}</section>
<section id="inboxes"><h2 class="sec">Inboxes <span class="sub">per sending domain · 14-day window</span></h2>${inboxes()}</section>
<footer><ul>${D.sources.map(s => `<li>${esc(s.label)} · ${esc(s.at)}</li>`).join('')}</ul><span>private page · not indexed · rebuilt every morning by /daily</span></footer>`;

// ── behaviour ─────────────────────────────────────────────
async function copyText(text, btn, row) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (btn) { const lab = btn.querySelector('.copy-label'), use = btn.querySelector('use'); const old = lab.textContent; btn.classList.add('done'); lab.textContent = 'copied'; use.setAttribute('href', '#i-check'); setTimeout(() => { btn.classList.remove('done'); lab.textContent = old; use.setAttribute('href', '#i-copy'); }, 1400); }
  if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (btn) { const row = btn.closest('.lead'); copyText(btn.dataset.text || row.dataset.email, btn, row); if (row) focusRow(row); return; }
  const ce = e.target.closest('.copy-email');
  if (ce) { copyText(ce.dataset.email); ce.textContent = 'copied'; setTimeout(() => ce.textContent = ce.dataset.email, 1400); return; }
  const last = e.target.closest('.last');
  if (last) { last.closest('.lead').classList.toggle('open'); return; }
  const row = e.target.closest('.lead');
  if (row && !e.target.closest('a')) focusRow(row);
});
const rows = () => [...document.querySelectorAll('.lead')];
let cur = -1;
function focusRow(row) { rows().forEach(r => r.classList.remove('focus')); row.classList.add('focus'); cur = rows().indexOf(row); row.scrollIntoView({ block: 'nearest' }); }
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const rs = rows(); if (!rs.length) return;
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); cur = Math.min(rs.length - 1, Math.max(0, cur + (e.key === 'j' ? 1 : -1))); focusRow(rs[cur]); }
  else if (cur < 0) return;
  else if (e.key === 'c') { copyText(rs[cur].dataset.email, rs[cur].querySelector('.copy'), rs[cur]); }
  else if (e.key === 'o') { if (rs[cur].dataset.url) window.open(rs[cur].dataset.url, '_blank', 'noopener'); }
  else if (e.key === 'Enter') { rs[cur].classList.toggle('open'); }
});
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + 'px';
});
})();
</script>

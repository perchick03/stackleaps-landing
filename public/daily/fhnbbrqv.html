n I’m back at my desk.\nLooking forward to creating your next unforgettable adventure!\n--\nKimberly DeBrabander\nFounder & Travel Designer\nF\nCountdown to Magic Travel, LLC\n515-259-7477\nkimberly@countdowntomagictravel.com\ncountdowntomagictravel.com\nUpcoming Travel: I will be out of the office September 16th - September 25th while traveling in Scotland.\nOffice Hours: Monday-Friday, 9AM-5PM EST. Please allow 2 business days for response."}, {"dir": "in", "ts": "2026-09-08T19:08:37+03:00", "from": "kimberly@countdowntomagictravel.com", "subject": "Re: Kimberly - thoughts?", "body": "Kristine,\nI actually have a second brand, The Next Passage, which offers literary and custom travel to Ireland, Scotland and England. I've been looking for DMC partners so I would love to see a sample. Please send it to kimberly@thenextpassage.com.\nThanks so much for reaching out!\nKimberly\nKimberly DeBrabander\nFounder & Travel Designer\nF\nCountdown to Magic Travel, LLC\n515-259-7477\nkimberly@countdowntomagictravel.com\ncountdowntomagictravel.com\nUpcoming Travel: I will be out of the office September 16th - September 25th while traveling in Scotland.\nOffice Hours: Monday-Friday, 9AM-5PM EST. Please allow 2 business days for response."}, {"dir": "out", "ts": "2026-09-08T19:17:36+03:00", "from": "bi_kristine@tiernantream.com", "subject": "Re: Kimberly - thoughts?", "body": "Hi Kimberly,\nLove that - a second brand built around literary and custom travel to Ireland, Scotland and England is a very natural fit for what we do.\nHere is a Scotland sample to start, since you're heading there shortly:\nScotland sample\nNine days, Edinburgh into the Highlands, Inverlochy Castle, a private Outlander adventure and a Highland safari. It goes out white-label under The Next Passage name, built fully custom to each client's brief.\nMore here if you want a wider look: tiernantravel.com/experiences\nEverythin can be customized for your voice. Let me know if the style looks like a fit\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-08T19:24:26+03:00", "from": "kimberly@countdowntomagictravel.com", "subject": "Re: Kimberly - thoughts?", "body": "Thank you, I will check it out and get back to you.\nI'm actually heading to Scotland next week for my very first visit. I'm so excited!\nKimberly\nKimberly DeBrabander\nFounder & Travel Designer\nF\nCountdown to Magic Travel, LLC\n515-259-7477\nkimberly@countdowntomagictravel.com\ncountdowntomagictravel.com\nUpcoming Travel: I will be out of the office September 16th - September 25th while traveling in Scotland.\nOffice Hours: Monday-Friday, 9AM-5PM EST. Please allow 2 business days for response."}, {"dir": "out", "ts": "2026-09-08T19:34:23+03:00", "from": "bi_kristine@tiernantream.com", "subject": "Re: Kimberly - thoughts?", "body": "Hi Kimberly,\nFirst trip to Scotland - that's a good one! Any special plans in Scotland?\nHope it's everything the itinerary promises and then some.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-08T19:43:11+03:00", "from": "kimberly@countdowntomagictravel.com", "subject": "Re: Kimberly - thoughts?", "body": "Kristine,\nWe're spending a couple of days in Edinburgh with lunch at the Witchery, drinks at 1820 Bar and a Ghosts and Gore tour. Then 2 days in Inverness, 2 days on the Isle of Skye, 1 day in Glenfinnan and then back to Edinburgh. (this time we're staying in Stockbridge). The hubby is treating this like a food tour and has a list of about 100 different pubs and restaurants. LOL.\nI can't wait for the hiking and all of the beautiful scenery. I took a group of 16 ladies to Ireland in June and it was breathtaking. With all the research I've done on Scotland, I expect to be even more \"wowed!\"\nCan't wait!!\nKimberly\nKimberly DeBrabander\nFounder & Travel Designer\nF\nCountdown to Magic Travel, LLC\n515-259-7477\nkimberly@countdowntomagictravel.com\ncountdowntomagictravel.com\nUpcoming Travel: I will be out of the office September 16th - ation.\nOur goal is for travelers to experience Scotland. We want them laughing, participating, trying new things, and creating unforgettable memories along the way.\nI'd love to know how flexible your itineraries are and whether you can customize the experiences to better reflect our group's travel style.\nI definitely see potential for a partnership and would love to explore what we could create together!\nLooking forward to your thoughts.\nBest Regards,\nIris Martin\nFounder & CEO\nSurreal Journeys Travel\nwww.surrealjourneystravels.com"}, {"dir": "out", "ts": "2026-10-26T16:47:12+02:00", "from": "b_kristine@tiernantream.com", "subject": "Re: Iris - thoughts?", "body": "Hi Iris,\nGlad Scotland caught your interest, and that feedback is genuinely helpful - the sample just shows the standard, but everything is built around what your group actually wants.\nWhisky tastings, boat cruises, local music and food, countryside time with locals, free time to roam - all of that is exactly the kind of thing we build in, and we can dial down the sightseeing in favor of it.\nInstead of going back and forth on email, it might be easier to hop on a quick call - I can walk you through how flexible the build really is and how we'd shape something around your group's style.\nWhat do you think? Here is my calendar if you want to pick a time.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-26T17:25:42+02:00", "from": "surrealjourneystravel@gmail.com", "subject": "Re: Iris - thoughts?", "body": "Hi Kristine,\nThank you for your response!\nUnfortunately, my schedule isn't ideal for phone calls. I travel extensively throughout the year and am constantly navigating different time zones, so finding time for calls can be challenging. Email communication works much better for me and also allows me to review everything at my convenience.\nI'd love for you to revise the itinerary based on the preferences I've shared, focusing more on whisky tastin omething out.\nWarm Regards, Bob\nRobert Masla & Monica Levine\nCasa de Los Artistas, Inc.\nMasla Fine Art Studios North\n962 Apple Valley Rd.\nAshfield, MA 01330\n(413) 335-4295 U.S., Mexico & Canada\nStudios South\n17 Ribera del Rio\nBoca de Tomatlan\nJalisco, MX.\n(011 52) 322 365 8648‬\nwww.MaslaFineArt.com\nwww.ArtWorkshopVacations.com"}, {"dir": "out", "ts": "2026-08-03T18:01:07+03:00", "from": "b-kristine@tiernantream.com", "subject": "Re: Bob - thoughts?", "body": "Hi Jeanne,\nThanks for the intro, Bob - great to have a name to put to the European side.\nJeanne, Bob mentioned you handle the coordination for their European tours, so you'll have the best read on whether a UK & Ireland extension makes sense for the groups. I sent Bob a sample Ireland itinerary last week - named castle stays, private guiding, fully white-label in your branding - which gives a fair feel for how we build.\nHappy to put together something more tailored around the art-workshop angle if that's useful. Do you have a trip in the pipeline, or is this more of a \"good to know for next season\" conversation at this stage?\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-08-05T19:38:37+03:00", "from": "jeanne@artfultravels.com", "subject": "Re: Bob - thoughts?", "body": "Hello Christine,\nThank you for your message and for sharing the Ireland itinerary. It looks amazing and I’m a huge fan of Ireland!\nHowever, our art retreats are centered around an artist and a group of painters who spend the seven or eight day ls of the art retreat painting at various locations of interest. We tend to have between 12 to 18 participants and select one location for the duration. From there, we can make excursions to areas of interest for plein air painting.\nIdeally, we want to have our main location to be also an area for painting with an indoor location in case of inclement weather.\nFor example, this past May, we spent a week in the Cotswolds staying in a manor house inn. From there, we visited different villages and Hidcote Gardens where we could set up and paint for half or most of the day. We did encounter several days of rain, but fortunately the Manor house had a large conservatory room where we could set up and paint.\nIn Ireland, we’d be interested in spending a couple of days in Dublin visiting cultural sites, but then end up perhaps on the West Coast where we could spend several days painting in and around that beautiful area.\nScotland is also another location that would appeal to our groups.\nWe are currently exploring all options for 2027 and hope to make a decision soon. I’d be curious to know if you can accommodate this type of travel for an artist and small group of painters.\nKind regards,\nJeanne\nJeanne Fontaine\nDirector/Manager\nArtful Travels, LLC\nwww.artfultravels.com\n413-237-4631\n jeanne@artfultravels.com"}, {"dir": "out", "ts": "2026-08-06T21:40:31+03:00", "from": "b-kristine@tiernantream.com", "subject": "Re: Bob - thoughts?", "body": "Hi Jeanne,\nThanks for laying it out so clearly.\nWhat you're describing is a different build to the touring itineraries\non our site - one base for the week with day trips out. The\nDublin-then-West-Coast idea is a good instinct.\nThe part that decides it is the property: somewhere in the right\nlandscape that takes a group your size and has a proper indoor room\nfor the days it rains. That's a specific thing to find rather than\nsomething off a shelf, same in Scotland.\nCan you tell me please roughly when in 2027, and is Ireland or Scotland the front-runner?\nWarm regards,\nKristine\ntiernantravel.com"}]}, {"email": "anne@moosetravel.ca", "name": "Anne", "company": "Moose Travel Network", "slug": "tiernan-decom", "status": "Interested", "group": "Interested · 3+ inbounds", "flags": ["reply"], "days_quiet": 93, "meta": "3 inbound / 3 out · they wrote 93d ago", "summary": "Their message is the last one and is unanswered.", "reminders": [], "unibox_url": "https://app.instantly.ai/ap • Iowa Registered Agency # 1202"}, {"dir": "out", "ts": "2026-09-08T04:37:25+03:00", "from": "kristine_bileskalne@tiernantraveloffice.com", "subject": "Re: David - thoughts?", "body": "Hi David,\nAscot - that's a great base to have known well. Clients who've been recommended by someone who actually lived there expect a different level of detail, and that's exactly where a ground partner earns its keep.\nWhen you're back and have a moment, happy to put together something England-focused - the Cotswolds, royal estates, that end of the country. Just let me know.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-08T04:41:11+03:00", "from": "david@thesavvytraveler.com", "subject": "Re: David - thoughts?", "body": "Will do, but reach out to me sometime around the 20th just in case.\nDavid Brown\nTravel Advisor | www.TheSavvyTraveler.com\nTel: (800) 231-2425\nDirect: (321) 286-5200\nE: david@thesavvytraveler.com\nWilliam D Brown, Florida Seller of Travel # TI66984. The Savvy Traveler is an independent agency hosted by Cruises & Tours, Unlimited Florida Seller of Travel # ST15578 • California Seller of Travel No. 2090937-50 Washington UBID No. 603189022 • Iowa Registered Agency # 1202"}]}, {"email": "stephanie@grouptrektravel.com", "name": "Stephanie Waddell", "company": "Group Trek Travel", "slug": "tiernan-decom", "status": "Interested", "group": "Interested · 3+ inbounds", "flags": [], "days_quiet": 54, "meta": "3 inbound / 4 out · we wrote 54d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:12-Qx069yb-NhIeuYpIuvS7IIf&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-09-08T19:44:53+03:00", "from": "kr.bileskalne@tiernantream.com", "subject": "Stephanie - thoughts?", "body": "Hey Stephanie\nLooks like you spend most of your time on escorted group trips, so I'd guess the UK & Ireland would go down just as well.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nMind if I send it over?\nTalk soon,\nKristine, Founder Tiernan Travel"}, {"dir": "in", "ts": "2026-09-08T20:05:46+03:00", "from": "stephanie@grouptrektravel.com", "subject": "Re: Stephanie - thoughts?", "body": "Hello Kristine,\nYes, I currently have a couple interested in London, Scotland, and Ireland (16 days including travel) for September 2027. Here is their \"Wish List\" of activities if they can fit them all in:\nTop places/sights to see:\n1. Stonehenge\n2. Cliffs of Moher\n3. Giants Causeway\n4. Loch Ness\n5. Big Ben/Tower Bridge/Westminster Abbey/London Eye\n6. Blarney Castle\n7. Waterford Crystal (House of Waterford)\n8. Glen Coe\n9. Highlands\n10. Riverdance – Dublin\nOther Places/sights\n1. Seven Sisters\n2. Bath\n3. Dingle Peninsula\n4. Ring of Kerry\n5. Isle of Skye\n6. Titanic\n7. Sean’s Bar\n8. Carrauntoohi Mountain\n9. Donegal Cliffs\n10. Wicklow Mountains\nKind regards,\nStephanie Waddell\nTravel Consultant\nGroup Trek Travel\nstephanie@grouptrektravel.com\nwww.grouptrektravel.com\n[615.506.6890](tel:(615)%20506-6890)"}, {"dir": "out", "ts": "2026-09-08T20:15:17+03:00", "from": "kr.bileskalne@tiernantream.com", "subject": "Re: Stephanie - thoughts?", "body": "Hi Stephanie,\nThat is a live brief - and a good one. England, Scotland, and Ireland in 16 days is exactly the kind of multi-country trip we build regularly, and most of that wish list is very doable.\nBefore I put a proper proposal together, it would help to have a few more details - but in the meantime, here is a sample so you can get a feel for the standard we work at:\nIreland Honeymoon sample\nThis one covers a 16-day Ireland grand tour with Dromoland Castle, Ring of Kerry, Cliffs of Moher, and Newgrange - a good read of the style and properties. The real itinerary for your clients would pull in Scotland and England too, with Loch Ness, Glencoe, the Highlands, Stonehenge, and Bath all very much on the table.\nIf that looks like the right fit, the best next step is a quick call to go through the details - party size, accommodation level, arrival city - and I can have a tailored proposal back to you within 48 hours.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-08T20:59:59+03:00", "from": "stephanie@grouptrektravel.com", "subject": "Re: Stephanie - thoughts?", "body": "Hi Kristine,\nThanks for sending that over—it looks great. I'd like to go over those details with you to get a proposal started. L et me first state, these are new clients and they have not provided a budget. They have been online looking at Small Group guided tours.\nParty Size: 2 adults\nAccommodation - Modest (not luxury), breakfast included\nArrival City would be London, train to Scotland, fly or ferry to Ireland depending on the itinerary. I alerted the clients trying to fit all 3 destinations into 16 days (including Int'l travel days) is a bit aggressive, so they are open to visiting England in the future and focus on Scotland and Ireland.\nDeparture Gateway: Houston, TX\nI'm new to your tour company. Do you include/pay commission, or do travel agencies add their service fee?\nBest,\nStephanie Kind regards,\nStephanie Waddell\nTravel Consultant\nGroup Trek Travel\nstephanie@grouptrektravel.com\nwww.grouptrektravel.com\n615.506.6890"}, {"dir": "out", "ts": "2026-09-08T21:25:08+03:00", "from": "kr.bileskalne@tiernantream.com", "subject": "Re: Stephanie - thoughts?", "body": "Hi Stephanie,\nThanks for setting all that out, it helps a lot - and good call trimming England, three countries in 16 days would have been thin.\nEverything we build goes out white-label under Group Trek Travel. Your clients see your brand throughout, you keep the relationship, and we handle the whole thing on the ground - drivers, guides, properties, the lot.\nOn numbers, so you have something to work with: our trips typically start from around £750 per person per night at 4-star self-drive, and from £1,150 with a private driver-guide. Every itinerary is built for the clients, so we can shape the route, the pace and the properties around what your clients actually need.\nBest next step is a quick call if that sounds good. I can walk you through how we work, answer anything on your side, and pick up the detail I need. Then I'll have a tailored proposal with you within 48 hours.\nBest,\nKristine"}, {"dir": "in", "ts": "2026-09-08T22:05:07+03:00", "from": "stephanie@grouptrektravel.com", "subject": "Re: Stephanie - thoughts?", "body": "Kristine, I have quite a few trips I'm trying to wrap up. Let's schedule a call next week if that works for you.\nThank you !\nKind regards,\nStephanie Waddell\nTravel Consultant\nGroup Trek Travel\nstephanie@grouptrektravel.com\nwww.grouptrektravel.com\n615.506.6890"}, {"dir": "out", "ts": "2026-09-08T22:16:49+03:00", "from": "kr.bileskalne@tiernantream.com", "subject": "Re: Stephanie - thoughts?", "body": "Hi Stephanie,\nNext week works perfectly.\nHere is my calendar link, pick a time that suits you: Book a 30-min call\nLooking forward to talking to you\nBest,\nKristine\ntiernantravel.com"}]}, {"email": "maureen@mogotravelservice.com", "name": "Maureen Celli", "company": "Mogo Travel Service", "slug": "tiernan-decom", "status": "Interested", "group": "Interested · 3+ inbounds", "flags": [], "days_quiet": 47, "meta": "3 inbound / 4 out · we wrote 47d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:da-bGkV899_AKCT-ng7LKCE_yA&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-09-14T22:55:03+03:00", "from": "kristine.bileskalne@tiernantraveldmc.com", "subject": "Maureen - thoughts?", "body": "Hi Maureen\nI saw you already run Ireland trips, and I wondered who you lean on for the ground side these days.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nMind if I send it over?\nRegards,\nKristine, Founder Tiernan Travel"}, {"dir": "in", "ts": "2026-09-14T23:20:14+03:00", "from": "maureen@mogotravelservice.com", "subject": "Re: Maureen - thoughts?", "body": "I'd love to see it..\nMo Go Travel Service\nCustom Vacations & Honeymoons\nMaureen Celli\n[860-670-3612](tel:860-670-3612) cell\nEmail MoGoTravel@aol.com"}, {"dir": "out", "ts": "2026-09-14T23:23:46+03:00", "from": "kristine.bileskalne@tiernantraveldmc.com", "subject": "Re: Maureen - thoughts?", "body": "Hi Maureen,\nGood to hear back.\nHere is the Ireland sample - built around the kind of trip your clients are already asking for:\nIreland sample\nSixteen days, Dublin to Dromoland Castle, with Riverdance VIP access, a hawk walk, and named five-star properties throughout. It goes out white-label in your name, built fully custom to each client.\nMore here if you want a wider look: tiernantravel.com/experiences\nAre your Ireland requests mostly first-timers, or clients who've been and want something deeper?\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-15T00:07:19+03:00", "from": "maureen@mogotravelservice.com", "subject": "Re: Maureen - thoughts?", "body": "Kristine ~\nI have many 1st timers to\nIreland and some repeats.\nI'm a big repeat myself!"}, {"dir": "out", "ts": "2026-09-15T00:11:04+03:00", "from": "kristine.bileskalne@tiernantraveldmc.com", "subject": "Re: Maureen - thoughts?", "body": "Hi Maureen,\nA repeat yourself - that's the best endorsement Ireland gets.\nFirst-timers tend to love the grand tour shape (Dublin, the Wild Atlantic Way, Dromoland), while repeats usually want to go deeper into a county or a theme - food, heritage, a roots angle. Both are exactly what we build around.\nDo you have a client in mind right now? If so, a few details are enough for a tailored proposal within 48 hours.\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-15T01:17:28+03:00", "from": "maureen@mogotravelservice.com", "subject": "Re: Maureen - thoughts?", "body": "Thank you, I will check it out."}, {"dir": re if you want a wider look: tiernantravel.com/experiences\nDo you have clients asking about Scotland or Ireland at the moment, or is this more one to keep on file?\nBest,\nKristine\ntiernantravel.com"}, {"dir": "out", "ts": "2026-09-21T19:02:37+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nWondering if the itinerary caught your eye and if it feels like your clients might be into this sort of tours.\nI can also build a custom proposal within 48h, you can send it to your clients to test the water to see if this might be a fit.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "out", "ts": "2026-09-25T20:33:32+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nLast follow up to see if the sample landed.\nCompletely understand if timing is off, if I don't hear from you I will just remove you from my list and won't bother you again.\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-25T21:17:45+03:00", "from": "mary@lifeisbettertraveling.com", "subject": "Re: Mary - thoughts?", "body": "Hi Kristine,\nSorry the delay. Yes, I actually have a client who is interested in going back to Scotland since they liked it so much. Do you have an itineraries for a single woman in her 60s who have done Edinburgh, Highlands, and Glasgow before. What do you recommend for her?\nIt would be 11 days, loves history, did stay at Balmoral in Edinburgh so likes those amenities, likes royalty, hasn't done the Tattoo, which I know is seasonal, but gives you an idea.\nLooking to spend around $12000 land.\nNo specific dates right now.\nLet me know!\nMary\nGet TypeApp for Mobile"}, {"dir": "out", "ts": "2026-09-26T19:14:11+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nGreat to hear back - and what a lovely brief. A solo woman in her 60s who already knows Edinburgh and the Highlands, loves history and royalty, and wants something new - there is a lot to work with there.\nRather than go back and forth on email, it would be easier to hop on a quick call and go over the trip properly - the routing, the right properties at that standard, and how to make it feel fresh given what she has already seen.\nWhat do you think?\nHere is my calendar if you want to pick a time.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "out", "ts": "2026-09-30T12:38:05+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nQuick nudge - still keen to hop on a call and talk through the routing for your client?\nHere is my calendar.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "out", "ts": "2026-10-07T18:52:59+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nJust making sure this didn't slip through with timing - happy to circle back later if that's easier for you.\nIn the meantime, since she loves history and royalty, our Ireland sample and England sample might give you some fresh ideas to explore alongside Scotland.\nNo worries either way, and wishing you and your client a wonderful trip whenever it comes together.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-09T20:11:25+03:00", "from": "mary@lifeisbettertraveling.com", "subject": "Re: Mary - thoughts?", "body": "Hi Kristine!\nShe is still on the fence about the trip. Let me take a look at the sample itineraries you sent over. If I have any questions I will reach out.\nI am on vacation until the 17th so my response is much slower, but I will keep you updated!\nThank you so much and you didn't drop off my radar promise!!\nThanks,\nMary\nGet TypeApp for Mobile"}, {"dir": "out", "ts": "2026-10-12T17:41:31+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Mary - thoughts?", "body": "Hi Mary,\nNo problem at all - take your time looking them over, and hin 24–48 hours during my business hours, Monday–Friday, 9 AM–5 PM ET. I am offline on weekends and when out of the office. If you are currently traveling and need assistance, I’ll respond as soon as possible.\nPrices and availability are subject to change until booked and deposited.\nTI118025, Independent Agent for FST No. ST15578 and CST No. 2090937-50.\nUPCOMING OUT OF OFFICE DATES:\nOctober 14–26, 2026\nNovember 5–16, 2026\nJanuary 27–February 3, 2027"}, {"dir": "out", "ts": "2026-10-26T18:59:00+02:00", "from": "kristine.bileskalne@tiernantraveltours.com", "subject": "Re: Karen - thoughts?", "body": "Hi Karen,\nHope Croatia was a great trip! Here is our Scotland sample - it tends to go well with advisors who want a flagship UK & Ireland style to show clients, and should give you a feel for what we do:\nScotland sample\nIf you like the style, I can get a proposal ready within 48 hours if I get a few details - you can share it with your clients and see if it lands.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}]}], "calls": [], "whatsapp": {}, "sources": [{"label": "Instantly analytics + lead walk", "at": "21:31"}, {"label": "tiernan-pilot store", "at": "21:30"}, {"label": "inbox health snapshot", "at": "09:26"}]}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const pct = (n, d, dp = 1) => d ? (100 * n / d).toFixed(dp) + '%' : '–';
const p1 = v => v == null ? '–' : Number(v).toFixed(1) + '%';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const d = iso => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
const longDate = iso => { const x = d(iso); return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const shortDate = iso => { const x = d(iso); return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}`; };
const localTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const teamName = g => g.name.replace(/ pilot$/i, '');
const lastWD = shortDate(D.last_workday);
const prevWD = shortDate(D.prev_workday || D.last_workday);
const ago = n => n == null ? '' : n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n}d ago`;
const lastIn = l => [...(l.thread || [])].reverse().find(m => m.dir === 'in');
const leadsOf = g => D.leads.filter(l => l.slug === g.slug);
const callsOf = g => D.calls.filter(c => c.slug === g.slug);

// ── operator marks: one localStorage key, survives the daily rebuild ──
const KEY = 'daily.v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
};
const S = Object.assign({ done: {}, lost: {}, feedback: {}, tab: null }, store.load());
const save = () => store.save(S);
// a done mark holds until the lead writes again
const isDone = l => { const t = S.done[l.email]; if (!t) return false; const li = lastIn(l); return !li || t >= li.ts.slice(0, 10); };
const isLost = l => !!S.lost[l.email];
const needsYou = l => !l.flags.includes('lost') && !isDone(l) && !isLost(l);
const marked = () => D.leads.filter(l => isDone(l) || isLost(l) || S.feedback[l.email]).length;
// a group with `decom` is the one-off review tab (tick = OK to send, skip = don't); the morning numbers leave it out
const decomSlugs = new Set(D.groups.filter(g => g.decom).map(g => g.slug));
const isDecom = l => decomSlugs.has(l.slug);
const dailyLeads = () => D.leads.filter(l => !isDecom(l));
const lostLabel = (l, on) => isDecom(l) ? (on ? 'unskip' : 'skip') : (on ? 'unmark lost' : 'mark lost');
function digest() {
  const lines = [`DAILY FEEDBACK ${D.date} (built ${D.built_at})`];
  D.leads.forEach(l => {
    if (isDone(l)) lines.push(`${isDecom(l) ? 'send' : 'done'}  ${l.email}`);
    if (isLost(l)) lines.push(`${isDecom(l) ? 'skip' : 'lost'}  ${l.email}`);
    if (S.feedback[l.email]) lines.push(`note  ${l.email} · ${S.feedback[l.email].replace(/\s*\n+\s*/g, ' / ')}`);
  });
  if (lines.length === 1) lines.push('(nothing marked)');
  return lines.join('\n');
}

// ── overall strip ────────────────────────────────────────
function strip() {
  const doms = new Map(); // the two StackLeaps groups share one fleet: dedupe by domain name
  const GS = D.groups.filter(g => !g.decom), LS = dailyLeads();
  GS.forEach(g => ((g.health || {}).domains || []).forEach(x => doms.set(x.domain, x)));
  const sent = [...doms.values()].reduce((a, x) => a + (x.sent || 0), 0), bounced = [...doms.values()].reduce((a, x) => a + (x.bounced || 0), 0);
  const b = sent ? 100 * bounced / sent : null;
  const pos = GS.reduce((a, g) => a + (g.alltime.positive || 0), 0), con = GS.reduce((a, g) => a + g.alltime.contacted, 0);
  const booked = GS.reduce((a, g) => a + g.month.booked, 0), taken = GS.reduce((a, g) => a + (g.month.completed || 0), 0);
  const calls = D.calls.filter(c => c.today).length, need = LS.filter(needsYou).length, hot = LS.filter(l => needsYou(l) && l.flags.includes('hot')).length;
  const tile = (l, v, s, cls = '') => `<div><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="strip">
    ${tile('Bounce · 14 days', b == null ? '–' : p1(b), `${fmt(bounced)} of ${fmt(sent)} sent · ${doms.size} domains`, b == null ? '' : b > 5 ? 'bad' : b > 2 ? 'warn' : 'ok')}
    ${tile('Positive replies', pct(pos, con), `${fmt(pos)} of ${fmt(con)} contacted · all-time`)}
    ${tile('Calls · this month', `${fmt(booked)}<small style="font-size:14px;color:var(--ink-2)"> booked</small>`, `${fmt(taken)} already taken`)}
    ${tile('Calls today', fmt(calls), calls ? [...new Set(D.calls.filter(c => c.today).map(c => c.contact))].join(', ') : 'none')}
    ${tile('Needs you', `<span data-need>${fmt(need)}</span>`, hot ? `<span data-hot>${hot}</span> hot` : 'across all campaigns', need ? '' : 'ok')}
  </div>`;
}

// ── scoreline ─────────────────────────────────────────────
function formGuide(g) {
  const s = (g.series || []).slice(-14);
  if (!s.length) return '<p class="empty">No daily series.</p>';
  const W = 600, H = 84, top = 16, base = 68, gap = 6, bw = (W - gap * (s.length - 1)) / s.length;
  const max = Math.max(1, ...s.map(x => x.sent));
  let out = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emails sent per day, last 14 days">`;
  s.forEach((x, i) => {
    const h = x.sent ? Math.max(2, (base - top) * x.sent / max) : 0;
    const xx = i * (bw + gap);
    const cls = x.date === D.last_workday ? 'bar last' : (x.sent ? 'bar' : 'bar off');
    const dow = d(x.date).getDay();
    out += x.sent
      ? `<rect class="${cls}" rx="2" x="${xx.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" data-tip="<b>${shortDate(x.date)}</b>sent ${fmt(x.sent)}<br>replies ${fmt(x.replies)}<br>new leads ${fmt(x.contacted)}"/>`
      : `<rect class="${cls}" x="${xx.toFixed(1)}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" data-tip="<b>${shortDate(x.date)}</b>no sends"/>`;
    if (x.date === D.last_workday) out += `<text class="vlab" x="${(xx + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}">${fmt(x.sent)}</text>`;
    out += `<text class="daylab" x="${(xx + bw / 2).toFixed(1)}" y="${H - 4}">${'SMTWTFS'[dow]}</text>`;
  });
  out += `<line class="axis" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"/></svg>`;
  return out;
}
function scoreline(g) {
  const L = g.last, M = g.month, A = g.alltime, C = g.capacity;
  const delta = L.sent - L.prev_sent;
  const used = C.daily_limit ? L.sent / C.daily_limit : 0;
  const deltaLine = !L.prev_sent ? `no sends on ${prevWD}` : delta ? `<span class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${fmt(delta)}</span> vs ${prevWD}` : `same as ${prevWD}`;
  const cols = [
    ['Sent · ' + lastWD, fmt(L.sent), `${deltaLine}<br><b>${fmt(M.sent)}</b> this month · <b>${fmt(A.sent)}</b> all-time`],
    ['Positive replies', pct(A.positive, A.contacted), `<b>${fmt(A.positive)}</b> of ${fmt(A.contacted)} contacted, all-time<br><b>${fmt(L.replies)}</b> repl${L.replies === 1 ? 'y' : 'ies'} on ${lastWD}`],
    ['New replies · ' + lastWD, `${fmt(L.new_replies)}<small> · ${fmt(L.new_positive)} positive</small>`, `first reply ever from these leads<br><b>${fmt(M.new_replies)}</b> this month`],
    ['Calls', `${fmt(M.booked)}<small> booked</small>`, `this month · <b>${fmt(M.completed)}</b> already taken<br><b>${fmt(A.booked)}</b> upcoming (Meeting Booked)`],
  ];
  return `<div class="scoreline">
    <div class="score-head"><h2>${esc(teamName(g))}</h2><span>${esc(g.client)} · ${g.subs.length} sub-campaign${g.subs.length > 1 ? 's' : ''} · last work day ${lastWD}</span></div>
    <div class="score">${cols.map(([l, v, dd]) => `<div class="score-col"><div class="lab">${l}</div><div class="fig">${v}</div><div class="delta">${dd}</div></div>`).join('')}</div>
    <div class="form"><div class="form-lab"><span>Sent per day · 14 days</span><span>bounced ${fmt(L.bounced)} on ${lastWD} (${pct(L.bounced, L.sent)}) · ${fmt(M.bounced)} this month (${pct(M.bounced, M.sent)})</span></div>${formGuide(g)}</div>
    <div class="score-foot">
      <div><span>Capacity · <b>${fmt(L.sent)}</b> of <b>${fmt(C.daily_limit)}</b>/day on ${lastWD} (${C.active} active inboxes${C.errors ? `, <span class="bad">${C.errors} in error</span>` : ''})</span><div class="meter"><i class="${used > 1 ? 'over' : ''}" style="width:${Math.min(100, used * 100).toFixed(1)}%"></i></div></div>
      <div><span>Leads · <b>${fmt(A.left)}</b> left of <b>${fmt(A.leads)}</b> in the pool${A.left && L.contacted ? ` (~${Math.ceil(A.left / L.contacted)} send days)` : A.left ? '' : ' · <span class="bad">refill</span>'} · <b>${fmt(L.contacted)}</b> contacted on ${lastWD}</span><div class="meter"><i class="${!A.left ? 'over' : ''}" style="width:${A.leads ? Math.min(100, 100 * (1 - A.left / A.leads)).toFixed(1) : 0}%"></i></div></div>
      <div class="funnel"><span>Funnel, all-time:</span><span><b>${fmt(A.interested)}</b> interested</span><span><b>${fmt(A.booked)}</b> booked</span><span><b>${fmt(A.completed)}</b> completed</span><span><b>${fmt(A.won)}</b> won</span><span><b>${fmt(A.no_show)}</b> no-show</span><span><b>${fmt(A.retarget)}</b> retarget</span><span><b>${fmt(A.not_interested)}</b> not interested</span><span>booking rate <b>${A.booking_rate == null ? '–' : A.booking_rate.toFixed(2) + '%'}</b></span></div>
    </div>
  </div>`;
}

// ── decom tab header: the notice to send ──────────────────
function decomHead(g) {
  const n = leadsOf(g).length;
  return `<div class="scoreline">
    <div class="score-head"><h2>Inbox decommission notice</h2><span>${n} leads · Completed, Booked, and Interested with 3+ inbounds · Retarget left out</span></div>
    <div class="remind"><header><span>Reply in the lead's thread from the inbox they know · <b>{first_name}</b> = their first name · <b>${g.unanswered}</b> of ${n} have an unanswered message from them, answer those first</span><button class="btn copy" type="button" data-text="${esc(g.notice)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy</span></button></header><pre>${esc(g.notice)}</pre></div>
  </div>`;
}

// ── leads queue ───────────────────────────────────────────
const TAGS = { hot: ['tag--hot', '🔥 hot'], booked: ['tag--booked', '📆 booked'], reminder: ['tag--rem', '⏰ reminder'], reply: ['', 'wrote last'], link_sent: ['tag--link', '🔗 link sent'], unread: ['tag--unread', 'not synced'], lost: ['tag--lost', 'lost'] };
const groupOf = l => l.group ? l.group : l.flags.includes('lost') ? 'lost' : l.flags.includes('hot') ? 'Hot' : l.flags.includes('booked') ? 'Booked' : l.flags.includes('reminder') ? 'Reminders due' : l.flags.includes('reply') ? 'They wrote last' : 'Link sent, waiting';
function leadRow(l, g) {
  const tags = l.flags.filter(f => TAGS[f]).map(f => `<span class="tag ${TAGS[f][0]}">${TAGS[f][1]}</span>`);
  if (l.forward_to) tags.push(`<button class="tag tag--fwd copy" type="button" data-text="${esc(g.contact_email || '')}" title="forward to ${esc(g.contact_email || l.forward_to)} · click to copy the address">↪ ${esc(l.forward_to)}</button>`);
  const li = lastIn(l), quiet = ago(l.days_quiet);
  const who = l.meta ? l.meta : l.flags.includes('reply') ? `they wrote ${quiet}` : `we wrote ${quiet}${l.flags.includes('link_sent') ? ' · link sent' : ''}`;
  const last = li ? `<div class="last" title="click to expand"><div class="subj">${esc(li.subject || '(no subject)')} <span class="dim">· ${shortDate(li.ts.slice(0, 10))}</span></div><pre>${esc(li.body || '')}</pre></div>`
    : (l.flags.includes('unread') ? `<div class="last"><pre>Thread not in the store yet (fetch stores only Interested, Booked and Completed leads). Read it in Instantly.</pre></div>` : '');
  const done = isDone(l), lost = isLost(l);
  const link = l.unibox_url ? `<a class="email" href="${esc(l.unibox_url)}" target="_blank" rel="noopener">${esc(l.email)}</a><a class="ibtn" href="${esc(l.unibox_url)}" target="_blank" rel="noopener" title="open in Instantly" aria-label="open in Instantly"><svg><use href="#i-instantly"/></svg></a>` : `<span class="email">${esc(l.email)}</span>`;
  return `<article class="lead ${done ? 'is-done' : ''} ${lost ? 'is-lost' : ''}" data-email="${esc(l.email)}" data-url="${esc(l.unibox_url || '')}" tabindex="0">
    <label class="done-wrap"><input type="checkbox" class="done" aria-label="done with ${esc(l.email)}" ${done ? 'checked' : ''}></label>
    <div class="tags">${tags.join('')}</div>
    <div class="lead-main">
      <div class="lead-id"><button class="btn icon copy" type="button" aria-label="Copy ${esc(l.email)}" title="copy"><svg><use href="#i-copy"/></svg></button>${link}</div>
      <div class="who">${esc(l.name)} <span class="co">${esc(l.company)}</span> <span class="status">${esc(l.status)}</span></div>
      <p class="sum">${esc(l.summary)}</p>
      ${(l.reminders || []).map(r => `<p class="rem">⏰ ${esc(r)}</p>`).join('')}
    </div>
    <div class="side">
      <div class="meta">${who}</div>
      <div class="acts">${(l.thread || []).length ? `<button class="btn thread-btn" type="button">full thread</button>` : ''}<button class="btn lost-btn ${lost ? 'on' : ''}" type="button">${lostLabel(l, lost)}</button></div>
      <textarea class="fb" rows="1" placeholder="feedback for the daily">${esc(S.feedback[l.email] || '')}</textarea>
    </div>
    ${last}
  </article>`;
}
function leads(g) {
  const all = leadsOf(g);
  const live = all.filter(l => !l.flags.includes('lost'));
  const lost = all.filter(l => l.flags.includes('lost'));
  let out = '';
  if (!live.length) out += `<p class="empty">Nothing is waiting on you here.</p>`;
  let cur = null;
  live.forEach(l => { const grp = groupOf(l); if (grp !== cur) { out += `<div class="group-lab">${grp}</div>`; cur = grp; } out += leadRow(l, g); });
  if (lost.length) out += `<details class="lost"><summary>Treated as lost · ${lost.length} · three of our emails in a row, no answer</summary><ul class="lost-list">${lost.map(l => `<li><span>${esc(l.email)}</span><span class="dim">${esc(l.company)}</span><span class="dim">quiet ${l.days_quiet}d</span></li>`).join('')}</ul></details>`;
  const need = live.filter(needsYou).length;
  const head = g.decom ? ['To review', 'tick = OK to send the notice · skip = leave this one out'] : ['Needs you', `their email is newest (last ${D.window_days} days), a reminder fell due, or we sent the Calendly link and they went quiet`];
  return `<section><h2 class="sec">${head[0]} <span class="count" data-count-group="${esc(g.slug)}">${need}</span><span class="sub">${head[1]}</span></h2>
    <p class="hint"><kbd>j</kbd><kbd>k</kbd> move · <kbd>c</kbd> copy email · <kbd>o</kbd> open in Instantly · <kbd>t</kbd> full thread · <kbd>x</kbd> done · <kbd>enter</kbd> expand their last email</p>
    <div class="queue">${out}</div></section>`;
}

// ── calls ─────────────────────────────────────────────────
const viewerTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'your zone'; } })();
function calls(g) {
  const cs = callsOf(g);
  const contact = g.contact || 'Calls';
  if (!cs.length) return `<section><h2 class="sec">${esc(g.contact ? `${g.contact}'s calls` : 'Calls')}</h2><p class="empty">No calls booked in the next 7 days.</p></section>`;
  const rows = cs.map(c => `<div class="call ${c.today ? 'today' : ''}">
    <div><div class="d">${c.today ? 'Today' : shortDate(c.date)}</div><div class="t">${c.client_time}<small>${esc(contact)}'s time · ${c.lead_time} ${esc(c.lead_tz)} for ${esc((c.name || '').split(' ')[0])}</small></div></div>
    <div><div class="who">${esc(c.name)} <span class="co">${esc(c.company)}</span> <span class="status">${esc(c.status)}</span></div>
      ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
      <div class="files">${c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\/(www\.)?/, ''))}</a> · ` : ''}${c.brief ? `one-pager ${esc(c.brief)}` : '<span class="bad">no one-pager in the store</span>'} · <span class="copy-email" data-email="${esc(c.email)}">${esc(c.email)}</span></div>
      ${c.today && c.reminder ? `<div class="remind"><header><span>Reminder to ${esc((c.name || '').split(' ')[0])} · paste in Instantly as ${esc(contact)} · <b>send after ${localTime(c.send_after)}</b> your time (${esc(viewerTZ)}, that is 08:00 for them)${Date.now() >= Date.parse(c.send_after) ? ' · ok to send now' : ''}</span><button class="btn copy" type="button" data-text="${esc(c.reminder)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy</span></button></header><pre>${esc(c.reminder)}</pre></div>` : ''}
    </div>
  </div>`).join('');
  const wa = g.contact ? D.whatsapp[g.contact] : null;
  return `<section><h2 class="sec">${esc(g.contact ? `${g.contact}'s calls` : 'Calls')} <span class="sub">${cs.filter(c => c.today).length} today · ${cs.length} in the next 7 days</span></h2>
    <div class="calls"><div>${rows}</div>
    ${g.contact ? (wa ? `<aside class="wa"><header><span>WhatsApp to ${esc(g.contact)}</span><button class="btn copy" type="button" data-text="${esc(wa)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy message</span></button></header><pre>${esc(wa)}</pre></aside>` : `<aside class="wa"><header><span>WhatsApp to ${esc(g.contact)}</span></header><pre class="dim">No call today, no morning message.</pre></aside>`) : ''}</div></section>`;
}

// ── box score ─────────────────────────────────────────────
function boxscore(g) {
  const L = g.last, M = g.month;
  const rows = g.subs.map(s => `<tr><td class="l">${esc(s.name)} <span class="dim">${esc(s.status)}</span></td><td>${fmt(s.leads)}</td><td>${fmt(s.contacted)}</td><td class="${s.left === 0 && s.status === 'Active' ? 'bad' : ''}">${fmt(s.left)}${s.left === 0 && s.status === 'Active' ? ' <small>refill</small>' : ''}</td><td>${fmt(s.last_sent)}</td><td>${fmt(s.last_replies)}</td><td>${pct(s.last_replies, s.last_sent)}</td><td class="${s.last_sent && s.last_bounced / s.last_sent > .05 ? 'bad' : s.last_sent && s.last_bounced / s.last_sent > .02 ? 'warn' : ''}">${fmt(s.last_bounced)} <span class="dim">${pct(s.last_bounced, s.last_sent)}</span></td><td>${fmt(s.month_sent)}</td><td>${fmt(s.month_bounced)} <span class="dim">${pct(s.month_bounced, s.month_sent)}</span></td></tr>`).join('');
  const total = `<tr class="total"><td class="l">Total</td><td>${fmt(g.alltime.leads)}</td><td>${fmt(g.alltime.contacted)}</td><td>${fmt(g.alltime.left)}</td><td>${fmt(L.sent)}</td><td>${fmt(L.replies)}</td><td>${pct(L.replies, L.sent)}</td><td>${fmt(L.bounced)} <span class="dim">${pct(L.bounced, L.sent)}</span></td><td>${fmt(M.sent)}</td><td>${fmt(M.bounced)} <span class="dim">${pct(M.bounced, M.sent)}</span></td></tr>`;
  return `<section><h2 class="sec">Box score <span class="sub">per sub-campaign · ${lastWD} and month to date</span></h2>
    <div class="scroll"><table class="agate"><thead><tr><th>Sub-campaign</th><th>Leads</th><th>Contacted</th><th>Left</th><th>Sent ${lastWD}</th><th>Replies</th><th>Reply %</th><th>Bounced</th><th>Sent · month</th><th>Bounced · month</th></tr></thead><tbody>${rows}${total}</tbody></table></div></section>`;
}

// ── inboxes ───────────────────────────────────────────────
const VERD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'ok', 'look-into': 'note', worry: 'red' };
const WORD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'great', 'look-into': 'look', worry: 'low' };
const driftLine = drift => { const by = {}; drift.forEach(s => { const i = s.indexOf(': '); const dom = i < 0 ? s : s.slice(0, i), why = i < 0 ? '' : s.slice(i + 2); (by[why] ||= []).push(dom); }); return Object.entries(by).map(([why, ds]) => `${ds.length} domain${ds.length > 1 ? 's' : ''} ${esc(why)}: ${ds.map(esc).join(', ')}`).join('<br>'); };
function replyGraph(x) {
  const t = (x.trend || []).filter(p => p.reply_pct != null);
  if (t.length < 2) return `<p class="dim" style="margin:0">Not enough history yet for ${esc(x.domain)} (${t.length} snapshot${t.length === 1 ? '' : 's'}).</p>`;
  const W = 1000, H = 96, base = 86, top = 10, max = Math.max(0.5, ...t.map(p => p.reply_pct));
  const X = i => i * W / (t.length - 1), Y = v => base - (base - top) * v / max;
  const pts = t.map((p, i) => `${X(i).toFixed(1)},${Y(p.reply_pct).toFixed(1)}`);
  const first = t[0], last = t[t.length - 1], then = t.length >= 8 ? t[t.length - 8] : null;
  return `<div class="rg">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Reply rate for ${esc(x.domain)}, rolling 14 days, one point per snapshot">
      <line class="g" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
      <path class="area" d="M${pts[0]} L${pts.join(' L')} L${W},${base} L0,${base} Z"/>
      <path d="M${pts.join(' L')}"/>
      <circle class="pt" cx="${X(t.length - 1).toFixed(1)}" cy="${Y(last.reply_pct).toFixed(1)}" r="3"/>
    </svg>
    <div class="read"><b>${esc(x.domain)}</b> · reply rate, rolling 14 days<br>now <b>${p1(last.reply_pct)}</b> (${fmt(last.replies)} replies on ${fmt(last.sent)} sent)${then ? `<br>7 snapshots ago <b>${p1(then.reply_pct)}</b>` : ''}<br><span class="dim">${shortDate(first.date)} → ${shortDate(last.date)} · ${t.length} snapshots</span></div>
  </div>`;
}
function inboxes(g) {
  const h = g.health;
  if (!h) return `<section><h2 class="sec">Inboxes</h2><p class="empty">No inbox-health snapshot for this campaign.</p></section>`;
  const dom = h.domains, al = h.allocation || {};
  const red = dom.filter(x => x.bounce_verdict === 'RED').length, note = dom.filter(x => x.bounce_verdict === 'NOTE').length, bl = dom.filter(x => x.blacklist).length, drops = dom.filter(x => x.reply_drop).length;
  const verdict = (v, word) => `<span class="verdict ${VERD[word] || ''}"><i></i>${p1(v)}${WORD[word] ? ` <small>${WORD[word]}</small>` : ''}</span>`;
  const rows = dom.map((x, i) => `<tr class="clickable" data-dom="${i}" title="click for the reply trend"><td class="l">${esc(x.domain)}${x.reply_drop ? '<span class="drop">drop</span>' : ''}</td><td class="l dim">${esc(x.state || '–')}</td><td>${fmt(x.inboxes)}</td><td>${fmt(x.capacity || null)}</td><td>${fmt(x.sent)}</td><td>${verdict(x.bounce_pct, x.bounce_verdict)}</td><td>${fmt(x.replies)}</td><td>${verdict(x.reply_pct, x.reply_verdict)}</td><td class="l ${x.blacklist ? 'warn' : 'dim'}">${esc(x.blacklist || 'clean')}</td></tr>`).join('');
  const S_ = dom.reduce((a, x) => a + (x.sent || 0), 0), B_ = dom.reduce((a, x) => a + (x.bounced || 0), 0), R_ = dom.reduce((a, x) => a + (x.replies || 0), 0);
  const total = `<tr class="total"><td class="l">Total · ${dom.length} domains</td><td class="l dim"></td><td>${fmt(al.total_inboxes)}</td><td>${fmt(al.active_capacity || null)}</td><td>${fmt(S_)}</td><td>${pct(B_, S_, 2)} <span class="dim">${fmt(B_)}</span></td><td>${fmt(R_)}</td><td>${pct(R_, S_, 2)}</td><td class="l dim">${bl ? `${bl} listed` : 'clean'}</td></tr>`;
  return `<section data-group-inbox="${esc(g.slug)}"><h2 class="sec">Inboxes <span class="sub">per sending domain · 14-day window · snapshot ${esc(h.snapshot_date)} ${esc((h.fetched_at || '').slice(11, 16))}</span></h2>
    <p class="team-sub">${dom.length} domains · ${fmt(al.total_inboxes)} inboxes${al.active_capacity ? ` · ${Math.round(100 * al.utilisation)}% of ${fmt(al.active_capacity)}/day used on the last send day` : ''} · ${red ? `<span class="bad">${red} red</span> · ` : ''}${note ? `<span class="warn">${note} to watch</span> · ` : ''}${drops ? `<span class="bad">${drops} reply drop${drops > 1 ? 's' : ''}</span> · ` : ''}${bl ? `<span class="warn">${bl} blacklisted</span>` : 'no blacklist hits'}</p>
    <div class="scroll"><table class="agate"><thead><tr><th>Domain</th><th>State</th><th>Inboxes</th><th>Cap/day</th><th>Sent 14d</th><th>Bounce</th><th>Replies</th><th>Reply %</th><th>Blacklist</th></tr></thead><tbody>${rows}${total}</tbody></table></div>
    <p class="hint">Click a domain for its reply trend. <b>drop</b> = reply rate fell 30%+ against 7 snapshots earlier, on 150+ sends. Bounce: <b>red</b> over 5% (past 150 sent), <b>note</b> 2–5%, <b>ok</b> under 2% · Reply: <b>great</b> 2.6% and up, <b>look</b> around 1%, <b>low</b> under 0.8%; no word = too few sends to judge.</p>
    ${h.drift.length ? `<p class="drift">Drift · ${driftLine(h.drift)}</p>` : ''}</section>`;
}

// ── assemble ──────────────────────────────────────────────
const tabCount = g => { const ls = leadsOf(g).filter(needsYou); return `<span class="n ${ls.length ? (ls.some(l => l.flags.includes('hot')) ? 'hot' : '') : 'zero'}" data-tab-count="${esc(g.slug)}">${ls.length}</span>`; };
$('#app').innerHTML = `
<header class="mast">
  <div><h1>Daily</h1><div class="dateline"><b>${DAYNAMES[d(D.date).getDay()]} ${longDate(D.date)}</b> · StackLeaps · built ${esc(D.built_at)} · last work day ${lastWD}</div></div>
  <div class="tools"><small>done · lost · notes stay in this browser</small><button class="btn primary copy" type="button" id="digest" data-digest="1"><svg><use href="#i-copy"/></svg><span class="copy-label">Copy feedback</span> <span class="n" data-fb-count>${marked()}</span></button></div>
</header>
${strip()}
<nav class="tabs" role="tablist">${D.groups.map(g => `<button role="tab" class="t-${esc(g.color)}" data-group="${esc(g.slug)}" aria-selected="false">${esc(teamName(g))} ${tabCount(g)}</button>`).join('')}</nav>
${D.groups.map(g => `<section class="panel t-${esc(g.color)}" data-group="${esc(g.slug)}" hidden>${g.decom ? decomHead(g) + leads(g) : scoreline(g) + leads(g) + calls(g) + boxscore(g) + inboxes(g)}</section>`).join('')}
<footer><ul>${D.sources.map(s => `<li>${esc(s.label)} · ${esc(s.at)}</li>`).join('')}</ul><span>private page · not indexed · rebuilt every morning by /daily</span></footer>`;

// ── tabs ──────────────────────────────────────────────────
let cur = -1;
function show(slug) {
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.group !== slug);
  document.querySelectorAll('.tabs [role=tab]').forEach(b => { const on = b.dataset.group === slug; b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ inline: 'nearest', block: 'nearest' }); });
  S.tab = slug; save(); cur = -1;
}
show(D.groups.some(g => g.slug === S.tab) ? S.tab : (D.groups[0] || {}).slug);

// ── behaviour ─────────────────────────────────────────────
function refreshCounts() {
  D.groups.forEach(g => { const el = document.querySelector(`[data-count-group="${g.slug}"]`), t = document.querySelector(`[data-tab-count="${g.slug}"]`); const ls = leadsOf(g).filter(needsYou); if (el) el.textContent = ls.length; if (t) { t.textContent = ls.length; t.className = `n ${ls.length ? (ls.some(l => l.flags.includes('hot')) ? 'hot' : '') : 'zero'}`; } });
  const need = dailyLeads().filter(needsYou).length, n = $('[data-need]'), h = $('[data-hot]'), fb = $('[data-fb-count]');
  if (n) n.textContent = need; if (h) h.textContent = dailyLeads().filter(l => needsYou(l) && l.flags.includes('hot')).length; if (fb) fb.textContent = marked();
}
async function copyText(text, btn, row) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (btn) { const lab = btn.querySelector('.copy-label'), use = btn.querySelector('use'); const old = lab ? lab.textContent : ''; btn.classList.add('done'); if (lab) lab.textContent = 'copied'; if (use) use.setAttribute('href', '#i-check'); setTimeout(() => { btn.classList.remove('done'); if (lab) lab.textContent = old; if (use) use.setAttribute('href', use.getAttribute('href') === '#i-check' && btn.classList.contains('tag--fwd') ? '#i-copy' : '#i-copy'); }, 1400); }
  if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
}
const leadOf = row => D.leads.find(l => l.email === row.dataset.email);
const dlg = $('#thread');
function openThread(l) {
  const msgs = (l.thread || []).map(m => `<article class="msg ${m.dir}"><div class="m"><span>${m.dir === 'in' ? 'them' : 'us'}</span><span>${shortDate(m.ts.slice(0, 10))} ${m.ts.slice(11, 16)}</span><span>${esc(m.from)}</span></div>${m.subject ? `<div class="subj">${esc(m.subject)}</div>` : ''}<pre>${esc(m.body)}</pre></article>`).join('');
  dlg.innerHTML = `<div class="th-head"><div><h3>${esc(l.name)} <span class="dim" style="font-weight:400">· ${esc(l.company)}</span></h3><div class="sub">${esc(l.email)} · ${esc(l.status)} · ${(l.thread || []).length} messages, newest last</div></div><button class="btn" type="button" data-close>close <kbd style="font:inherit;opacity:.7">esc</kbd></button></div><div class="th-body">${msgs}</div>`;
  dlg.showModal(); dlg.querySelector('.th-body').scrollTop = 1e9;
}
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
document.addEventListener('click', e => {
  const tab = e.target.closest('.tabs [role=tab]');
  if (tab) { show(tab.dataset.group); return; }
  const btn = e.target.closest('.copy');
  if (btn) { const row = btn.closest('.lead'); copyText(btn.dataset.digest ? digest() : (btn.dataset.text || (row && row.dataset.email)), btn, row); if (row) focusRow(row); return; }
  const ce = e.target.closest('.copy-email');
  if (ce) { copyText(ce.dataset.email); ce.textContent = 'copied'; setTimeout(() => ce.textContent = ce.dataset.email, 1400); return; }
  const tb = e.target.closest('.thread-btn');
  if (tb) { openThread(leadOf(tb.closest('.lead'))); return; }
  const lb = e.target.closest('.lost-btn');
  if (lb) { const row = lb.closest('.lead'), l = leadOf(row); if (isLost(l)) delete S.lost[l.email]; else S.lost[l.email] = D.date; save(); row.classList.toggle('is-lost', isLost(l)); lb.classList.toggle('on', isLost(l)); lb.textContent = lostLabel(l, isLost(l)); refreshCounts(); return; }
  const dr = e.target.closest('tr.clickable');
  if (dr) { const next = dr.nextElementSibling; if (next && next.classList.contains('graph')) { next.remove(); return; } const sec = dr.closest('[data-group-inbox]'), g = D.groups.find(x => x.slug === sec.dataset.groupInbox); const tr = document.createElement('tr'); tr.className = 'graph'; tr.innerHTML = `<td colspan="9">${replyGraph(g.health.domains[+dr.dataset.dom])}</td>`; dr.after(tr); return; }
  const last = e.target.closest('.last');
  if (last) { last.closest('.lead').classList.toggle('open'); return; }
  const row = e.target.closest('.lead');
  if (row && !e.target.closest('a, input, textarea, button')) focusRow(row);
});
document.addEventListener('change', e => {
  const cb = e.target.closest('.done');
  if (!cb) return;
  const row = cb.closest('.lead'), l = leadOf(row);
  if (cb.checked) S.done[l.email] = D.date; else delete S.done[l.email];
  save(); row.classList.toggle('is-done', cb.checked); refreshCounts();
});
document.addEventListener('input', e => {
  const ta = e.target.closest('.fb');
  if (!ta) return;
  const l = leadOf(ta.closest('.lead')), v = ta.value.trim();
  if (v) S.feedback[l.email] = v; else delete S.feedback[l.email];
  save(); refreshCounts();
});
const rows = () => [...document.querySelectorAll('.panel:not([hidden]) .lead')];
function focusRow(row) { rows().forEach(r => r.classList.remove('focus')); row.classList.add('focus'); cur = rows().indexOf(row); row.scrollIntoView({ block: 'nearest' }); }
document.addEventListener('keydown', e => {
  if (e.target.matches('input:not([type=checkbox]), textarea') || e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  const rs = rows(); if (!rs.length) return;
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); cur = Math.min(rs.length - 1, Math.max(0, cur + (e.key === 'j' ? 1 : -1))); focusRow(rs[cur]); }
  else if (cur < 0) return;
  else if (e.key === 'c') { copyText(rs[cur].dataset.email, rs[cur].querySelector('.copy'), rs[cur]); }
  else if (e.key === 'o') { if (rs[cur].dataset.url) window.open(rs[cur].dataset.url, '_blank', 'noopener'); }
  else if (e.key === 't') { const l = leadOf(rs[cur]); if ((l.thread || []).length) openThread(l); }
  else if (e.key === 'x') { const cb = rs[cur].querySelector('.done'); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); }
  else if (e.key === 'Enter') { rs[cur].classList.toggle('open'); }
});
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + 'px';
});
})();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>StackLeaps Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#f8f9ff; --card:#fff; --sunk:#eef2fa;
  --ink:#0e1d2b; --ink-2:#43474d; --ink-3:#73777e;
  --outline:#c3c7ce; --ghost:rgba(195,199,206,.4); --ghost-2:rgba(195,199,206,.2);
  --navy:#16314a; --navy-2:#2e4862;
  --apricot:#ff8e3b; --apricot-deep:#984800; --apricot-soft:#ffdbc8;
  --ok:#137a2b; --note:#b45309; --red:#b91c1c;
  --shadow:0 20px 40px rgba(14,29,43,.06);
  --r-sm:6px; --r-md:8px; --r-lg:16px; --r-full:999px;
  --display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter:32px;
  color-scheme:light;
}
/* team scopes: one class on the tab + its panel sets every tint below */
.t-orange{--team:#ff8e3b;--team-deep:#984800;--team-soft:#ffdbc8;--team-tint:#fff6ef}
.t-blue{--team:#2e5c9e;--team-deep:#16314a;--team-soft:#dbe9fd;--team-tint:#eff4fc}
.t-purple{--team:#6b4fbb;--team-deep:#4a3390;--team-soft:#e9e3fa;--team-tint:#f5f2fc}
.t-navy{--team:#16314a;--team-deep:#0e1d2b;--team-soft:#e4efff;--team-tint:#f1f5fc}

*{box-sizing:border-box}
html{background:var(--surface)}
body{margin:0;background:var(--surface);color:var(--ink);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--apricot-soft);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--apricot-deep);outline-offset:2px;border-radius:var(--r-sm)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
*{scrollbar-color:var(--outline) transparent;scrollbar-width:thin}
main{max-width:1440px;margin:0 auto;padding:0 var(--gutter) 96px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.fig,.agate td,.score .n,.strip .v,.call .t,.meter-lab b{font-family:var(--mono)}
.dim{color:var(--ink-3)} .bad{color:var(--red);font-weight:600} .warn{color:var(--note);font-weight:600}
.empty{padding:24px 0;color:var(--ink-2);border-top:1px solid var(--ghost)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 10px;font:600 12px/1 var(--ui);color:var(--ink-2);background:var(--card);white-space:nowrap;transition:background .12s,color .12s}
.btn:hover{background:var(--sunk);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--apricot);border-color:var(--apricot);color:var(--navy)}
.btn.primary:hover{background:#ffa05a}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .n{font-family:var(--mono);background:var(--navy);color:#fff;border-radius:var(--r-full);padding:2px 7px;font-size:11px}
.btn.primary .n{background:var(--navy)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.icon{padding:6px;border-radius:var(--r-sm)}

/* masthead + strip */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:26px 0 18px}
.mast h1{margin:0;font:800 30px/1 var(--display);color:var(--navy)}
.mast .dateline{font-size:13px;color:var(--ink-2);margin-top:6px}
.mast .dateline b{color:var(--ink);font-weight:600}
.mast .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mast .tools small{font-size:12px;color:var(--ink-3)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:16px 0 20px;border-top:1px solid var(--ghost)}
.strip > div{padding:0 0 0 14px;border-left:2px solid var(--ghost)}
.strip .l{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.strip .v{font:600 26px/1 var(--mono);color:var(--ink)}
.strip .v.bad{color:var(--red)} .strip .v.warn{color:var(--note)} .strip .v.ok{color:var(--ok)}
.strip .s{font-size:12px;color:var(--ink-2);margin-top:6px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:var(--surface);padding:8px 0 0;margin:0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter);overflow-x:auto;border-bottom:1px solid var(--ghost)}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px 12px;font:700 14px/1 var(--display);color:var(--ink-2);border-radius:var(--r-md) var(--r-md) 0 0;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{background:var(--team-tint);color:var(--team-deep)}
.tabs button[aria-selected="true"]{background:var(--team-soft);color:var(--team-deep);border-bottom-color:var(--team)}
.tabs .n{font:600 11px/1 var(--mono);background:var(--card);color:var(--ink-2);border:1px solid var(--ghost);border-radius:var(--r-full);padding:3px 7px;min-width:22px;text-align:center}
.tabs button[aria-selected="true"] .n{background:var(--team-deep);color:#fff;border-color:var(--team-deep)}
.tabs .n.zero{opacity:.6}
.tabs .n.hot{background:var(--red);color:#fff;border-color:var(--red)}

/* panels + sections */
.panel{padding-top:8px}
.panel[hidden]{display:none}
section{padding-top:36px}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;font:700 20px/1.1 var(--display);color:var(--team-deep)}
.sec .count{font:600 12px/1 var(--mono);background:var(--team-deep);color:#fff;border-radius:var(--r-full);padding:4px 8px;position:relative;top:-2px}
.sec .sub{font:400 13px/1.4 var(--ui);color:var(--ink-2)}
.hint{margin:-4px 0 12px;font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px/1 var(--mono);border:1px solid var(--ghost);border-bottom-width:2px;border-radius:4px;padding:2px 5px;margin:0 2px;background:var(--card)}
.chip{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-full);background:var(--team-soft);color:var(--team-deep);white-space:nowrap}

/* scoreline */
.scoreline{border-top:1px solid var(--ghost);padding-top:14px}
.score-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.score-head h2{margin:0;font:800 24px/1 var(--display);color:var(--team-deep)}
.score-head span{font-size:12px;color:var(--ink-2)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.score-col{padding:0 0 0 14px;border-left:2px solid var(--team-soft)}
.score-col .lab{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.score-col .fig{font:600 40px/1 var(--mono);color:var(--ink);letter-spacing:-.02em}
.score-col .fig small{font-size:16px;color:var(--ink-2);font-weight:500}
.score-col .delta{margin-top:8px;font-size:12px;color:var(--ink-2);line-height:1.5}
.score-col .delta b{font-weight:600;color:var(--ink)}
.score-col .delta .up{color:var(--ok)} .score-col .delta .down{color:var(--note)}
.form{margin-top:18px}
.form .form-lab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.form svg{display:block;width:100%;height:84px;overflow:visible}
.form .bar{fill:var(--team-soft)} .form .bar.last{fill:var(--team)} .form .bar.off{fill:var(--ghost-2)}
.form .daylab{font:500 10px var(--ui);fill:var(--ink-3);text-anchor:middle}
.form .vlab{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.form .axis{stroke:var(--ghost);stroke-width:1}
.score-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--ghost);display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;font-size:13px;color:var(--ink-2)}
.score-foot b{color:var(--ink);font-weight:600}
.score-foot .funnel{grid-column:1 / -1;display:flex;gap:6px 18px;flex-wrap:wrap}
.meter{margin-top:6px;height:6px;border-radius:var(--r-full);background:var(--team-soft);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--team);border-radius:var(--r-full)}
.meter i.over{background:var(--red)}

/* leads queue */
.queue{border-top:1px solid var(--ghost)}
.group-lab{font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:16px 0 6px;border-bottom:1px solid var(--ghost)}
.lead{display:grid;grid-template-columns:26px 118px 1fr 230px;gap:8px 18px;padding:14px 0;border-bottom:1px solid var(--ghost);position:relative;align-items:start}
.lead.focus{outline:2px solid var(--team);outline-offset:-2px;border-radius:var(--r-md);padding-left:10px;padding-right:10px;background:var(--card)}
.lead.flash .lead-id{animation:flash .6s ease-out}
@keyframes flash{0%{background:var(--team-soft)}100%{background:transparent}}
.lead.is-done{opacity:.5}
.lead.is-done .sum,.lead.is-done .last,.lead.is-done .rem{display:none}
.lead.is-lost .who,.lead.is-lost .sum{color:var(--ink-3);text-decoration:line-through}
.done-wrap{display:flex;align-items:center;justify-content:center;padding-top:4px}
.done{width:18px;height:18px;margin:0;accent-color:var(--team-deep);cursor:pointer}
.tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tag{font:600 11px/1 var(--ui);padding:5px 8px;border-radius:var(--r-full);background:var(--card);border:1px solid var(--ghost);color:var(--ink-2);white-space:nowrap}
.tag--hot{background:#fdecec;border-color:#f6c9c9;color:var(--red)}
.tag--booked{background:var(--team-soft);border-color:transparent;color:var(--team-deep)}
.tag--rem{background:#fff4d6;border-color:#f5dfa0;color:#7a5200}
.tag--link{border-style:dashed}
.tag--lost,.tag--unread{color:var(--ink-3)}
.tag--fwd{background:var(--navy);border-color:var(--navy);color:#fff;cursor:pointer}
.tag--fwd.done{background:var(--ok);border-color:var(--ok)}
.lead-id{display:flex;align-items:center;gap:8px;min-width:0;margin:-4px -6px 2px;padding:4px 6px;border-radius:var(--r-sm)}
.email{font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--ghost);color:var(--navy)}
.email:hover{border-bottom-color:var(--navy)}
.ibtn{display:inline-flex;flex:0 0 auto;color:var(--navy);opacity:.75}
.ibtn:hover{opacity:1}
.ibtn svg{width:16px;height:16px}
.who{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who .co{font-weight:400;color:var(--ink-2)}
.status{font-size:12px;color:var(--ink-3);font-weight:400}
.sum{margin:4px 0 0;color:var(--ink);text-wrap:pretty}
.sum:empty{display:none}
.rem{margin:6px 0 0;padding:6px 10px;border-radius:var(--r-sm);background:#fff8e6;font-size:13px;color:#5a3d00}
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.fb{width:100%;min-height:30px;resize:vertical;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 9px;font:400 12px/1.4 var(--ui);color:var(--ink);background:var(--card)}
.fb::placeholder{color:var(--ink-3)}
.fb:focus{border-color:var(--team);outline:none}
.last{grid-column:3 / -1;margin:2px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--ghost-2);border-radius:var(--r-md);font-size:13px;color:var(--ink-2);max-height:8.5em;overflow:hidden;position:relative;cursor:pointer}
.last .subj{font-weight:600;color:var(--ink);margin-bottom:4px}
.last pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.last::after{content:"";position:absolute;inset:auto 0 0 0;height:26px;background:linear-gradient(transparent,var(--card))}
.lead.open .last{max-height:none}
.lead.open .last::after{display:none}
.lost-list{margin:0;padding:10px 0 0;list-style:none;font-size:13px;color:var(--ink-2)}
.lost-list li{display:flex;gap:16px;padding:6px 0;border-bottom:1px solid var(--ghost-2)}
details.lost summary{cursor:pointer;padding:12px 0;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* calls */
.calls{display:grid;grid-template-columns:1fr 440px;gap:28px;align-items:start}
.call{display:grid;grid-template-columns:140px 1fr;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--ghost)}
.call:first-child{border-top:1px solid var(--ghost)}
.call .t{font:600 26px/1 var(--mono);color:var(--ink)}
.call .t small{display:block;font:500 12px/1.3 var(--ui);color:var(--ink-2);margin-top:4px}
.call .d{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.call.today .d{color:var(--ok)}
.call .who{font-size:15px}
.call .note{color:var(--ink-2);margin:2px 0 0}
.call .files{font-size:12px;color:var(--ink-3);margin-top:4px}
.copy-email{cursor:pointer;border-bottom:1px dashed var(--outline)}
.remind{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--team-tint);border:1px solid var(--team-soft)}
.remind header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.remind header b{color:var(--team-deep);font-weight:600}
.remind pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.wa{border:1px solid var(--ghost);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow)}
.wa header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ghost);font:700 13px/1 var(--display);color:var(--team-deep)}
.wa pre{margin:0;padding:16px;font:400 14px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* tables */
.scroll{overflow-x:auto;margin-bottom:8px}
table.agate{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--ghost)}
.agate th{font:600 11px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:9px 10px;border-bottom:1px solid var(--ghost);white-space:nowrap}
.agate th:first-child,.agate td:first-child{text-align:left;padding-left:0}
.agate td{padding:8px 10px;border-bottom:1px solid var(--ghost-2);text-align:right;white-space:nowrap;font-size:12.5px}
.agate tr.total td{border-top:1px solid var(--outline);font-weight:600}
.agate td.l{text-align:left;font-family:var(--ui)}
.agate td small{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.agate tr.clickable{cursor:pointer}
.agate tr.clickable:hover td{background:var(--sunk)}
.agate tr.graph td{padding:12px 0 16px;white-space:normal;text-align:left;background:var(--card)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.verdict i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.verdict.ok i{background:var(--ok)} .verdict.note i{background:var(--note)} .verdict.red i{background:var(--red)}
.verdict.ok{color:var(--ok)} .verdict.note{color:var(--note)} .verdict.red{color:var(--red)}
.verdict small{font:500 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.drop{font:600 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;background:#fdecec;color:var(--red);border-radius:var(--r-full);padding:3px 7px;margin-left:6px}
.rg{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center}
.rg svg{display:block;width:100%;height:96px}
.rg path{fill:none;stroke:var(--team);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rg .area{fill:var(--team-soft);stroke:none;opacity:.7}
.rg .g{stroke:var(--ghost);vector-effect:non-scaling-stroke}
.rg .pt{fill:var(--team-deep)}
.rg .ax{font:500 10px var(--mono);fill:var(--ink-3)}
.rg .read{font-size:12px;color:var(--ink-2);line-height:1.6}
.rg .read b{font-family:var(--mono);color:var(--ink);font-weight:600}
.drift{font-size:12px;color:var(--note);margin:6px 0 0}
.team-sub{font-size:13px;color:var(--ink-2);margin:0 0 10px}

/* thread dialog */
dialog#thread{border:1px solid var(--ghost);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink)}
dialog#thread::backdrop{background:rgba(14,29,43,.35)}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ghost);position:sticky;top:0;background:var(--card);z-index:1}
.th-head h3{margin:0;font:700 16px/1.2 var(--display)}
.th-head .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.th-body{padding:10px 18px 18px;overflow:auto}
.msg{padding:12px 14px;margin:10px 0;border-radius:var(--r-md);border:1px solid var(--ghost-2);background:var(--surface)}
.msg.in{background:var(--team-tint);border-color:var(--team-soft)}
.msg .m{display:flex;gap:10px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.msg.in .m{color:var(--team-deep)}
.msg .subj{font-weight:600;margin-bottom:4px}
.msg pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* footer + tooltip */
footer{margin-top:64px;border-top:1px solid var(--ghost);padding-top:14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:18px;flex-wrap:wrap}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--navy);color:#fff;padding:8px 10px;font-size:12px;line-height:1.4;border-radius:var(--r-sm);display:none;max-width:240px}
.tip b{display:block;font-weight:600}

@media (max-width:1100px){
  .calls{grid-template-columns:1fr}
  .lead{grid-template-columns:26px 1fr}
  .lead .tags{grid-column:2;flex-direction:row;flex-wrap:wrap}
  .lead .lead-main,.lead .side,.lead .last{grid-column:2}
  .meta{text-align:left} .acts{justify-content:flex-start}
  .strip{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  :root{--gutter:16px}
  .tabs button{padding:10px 12px 12px;font-size:13px}
  .strip{grid-template-columns:1fr 1fr;gap:12px}
  .strip .v{font-size:22px}
  .score{grid-template-columns:1fr 1fr}
  .score-col .fig{font-size:30px}
  .score-foot{grid-template-columns:1fr}
  .call{grid-template-columns:1fr}
  .rg{grid-template-columns:1fr}
  .scroll{position:relative}
  .scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,transparent,var(--surface));pointer-events:none}
  .agate th:first-child,.agate td:first-child{position:sticky;left:0;background:var(--surface);padding-right:12px;max-width:170px;white-space:normal;line-height:1.3}
  .agate tr.graph td{position:static;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .lead.flash .lead-id{animation:none;background:var(--team-soft)}
  .btn{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

ver.\nHere is our Scotland sample - it should give you a feel for what it's all about:\nScotland sample\nWe can tailor something like this to your clients and run it on the ground, under your name.\nIf the style feels like a fit we can try and customize something for you - just need a few details for a proposal that you can see how it looks and show your clients.\nKind regards,\nKristine | Founder of Tiernan Travel (DMC)\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-13T23:19:27+02:00", "from": "jtt@julesgetaways.com", "subject": "Re: Julian - thoughts?", "body": "Hi Kristine,\nThank you so much for sending this over!\nI had a chance to look through the Scotland itinerary, and I really like the variety of experiences you’ve put together. The combination of historic sites, unique cultural experiences, luxury accommodations, and the Scottish Highlands is fantastic.\nI’d definitely be interested in exploring a partnership with Tiernan Travel, especially knowing that you can customize itineraries and operate them under my brand.\nI’m always looking for opportunities to offer my clients unique and memorable travel experiences, and I could also see the potential for developing a hosted group trip to Scotland in the future.\nI’d love to learn a little more about how you work with travel advisors, particularly regarding pricing, commissions, and the customization process.\nLooking forward to exploring what we might create together!\nBest regards,\nJulian Tamayo\nJules’s Getaways\njulesgetaways.com"}, {"dir": "out", "ts": "2026-10-14T06:57:58+02:00", "from": "kbileskalne@tiernantream.com", "subject": "Re: Julian - thoughts?", "body": "Hi Julian,\nGlad the Scotland sample landed well - that mix of history and luxury is exactly what tends to impress clients.\nOn pricing, we usually work on net rates, but can provide commissionable pricing if needed - typically in the 10-15% range.\nCustomization is simple: once you send a few details on dates, travelers, and what they're after, we build it out under your brand.\nThe easiest next step might be a quick call - I can walk you through how we work with advisors and answer anything else on your mind, including the hosted group idea.\nHappy to find a time if that works for you.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-14T07:19:28+02:00", "from": "jtt@julesgetaways.com", "subject": "Re: Julian - thoughts?", "body": "Hi Kristine,\nSounds great! Let’s try Wednesday, October 28th, for a quick call.\nI’d love to learn more about how you work with travel advisors and discuss the possibility of collaborating on a hosted group trip.\nLet me know what time works best for you.\nLooking forward to connecting!\nBest regards,\nJulian Tamayo\nJules’s Getaways"}, {"dir": "out", "ts": "2026-10-14T07:23:11+02:00", "from": "kbileskalne@tiernantream.com", "subject": "Re: Julian - thoughts?", "body": "Hi Julian,\nOctober 28th works well on my end.\nHere's my calendar to grab a time that suits you that day: book a call\nLooking forward to it - we can go over the advisor model and the hosted group idea in detail then.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "out", "ts": "2026-10-15T13:03:13+02:00", "from": "kbileskalne@tiernantream.com", "subject": "Re: Julian - thoughts?", "body": "Hi Julian,\nJust confirming we're on for the 28th.\nLet me know what time suits you, or grab a slot directly here: book a call\nLooking forward to it.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}], "reminders": [], "forward_to": null, "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:77-VZZVzmDmVO3_M2VCoNbxCrf&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "summary": "Confirmed a call for October 28th to discuss the advisor model and the \"possibility of collaborating on a hosted group trip.\""}, {"email": "brad@waypointwild.ca", "name": "Brad", "company": "Waypoint Wild", "slug": "tiernan-pilot", "sta  "from": "k-bileskalne@tiernantravels.com", "subject": "Re: Brad - thoughts?", "body": "Hi Brad,\nWondering if the itinerary caught your eye and if it feels like your clients might be into this sort of tours.\nI can also build a custom proposal within 48h, you can send it to your clients to test the water to see if this might be a fit.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-02T00:54:01+02:00", "from": "brad@waypointwild.ca", "subject": "Re: Brad - thoughts?", "body": "Hi Kristine,\nThanks for following up. I did get a chance to look through the itinerary and there are definitely elements that caught my eye, especially the private experiences and the more immersive Highland touring.\nMost of the Scotland planning I’ve done so far has leaned a little more independent, with self-drive itineraries, smaller towns and countryside stays, but I can absolutely see this style working for clients who want something more guided, higher-end, or simply more hands-off.\nThe recent Scotland trip I planned was for first-time visitors, so I’d say that’s probably the type of client I’m more likely to see initially. I also really like the idea of being able to send you a trip brief and have a custom white-label proposal built within 48 hours. That could be really useful for testing interest with a client before going too far down the planning road.\nI’d be interested in learning a little more about how the advisor side works as well, particularly pricing, commission or markup structure, minimum trip value if there is one, and how the booking/payment process works.\nThanks again!\nBrad Martens\nTravel Advisor | Waypoint Wild\n📍 Manitoba, Canada\n🌍 www.waypointwild.ca\n📸 Instagram: @waypoint.wild\nYour referral is the best thank you."}, {"dir": "out", "ts": "2026-10-02T18:11:21+02:00", "from": "k-bileskalne@tiernantravels.com", "subject": "Re: Brad - thoughts?", "body": "Hi Brad,\nGlad the private experiences and the Highland touring stood out. First-timers who want it more hands-off are a good fit for that style.\nOn the advisor side - It's all white-label. We usually work on net pricing, but we can provide commissionable rates if required, usually 10-15%.\nOn pricing: Every itinerary is custom, so the price moves with what your clients need. As a ballpark, a 4-star trip in peak season starts from £750 per person per night (~$1,000) self-drive, or from £1,150 (~$1,500) with a driver.\nIf this sounds good, what do you think about a quick call as next step to get some of the details? If you want, I can tailor a proposal for you within 48 hours\nKind regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-04T02:56:46+02:00", "from": "brad@waypointwild.ca", "subject": "Re: Brad - thoughts?", "body": "Hi Kristine,\nThanks, that definitely helps put the pricing and structure into perspective.\nIt sounds like Tiernan would be a really good fit for the higher-end side of my business, especially clients looking for more private experiences, drivers, guides and a more hands-off trip.\nMost of the UK and Scotland requests I’ve handled so far have been a bit more independent and budget-conscious, but I can definitely see situations where this would be a great fit.\nI’d be happy to jump on a quick call and learn a bit more about how you work with advisors, particularly the net pricing and white-label process.\nI’ll have a look at your calendar and find a time that works.\nTalk soon,\nBrad Martens\nTravel Advisor | Waypoint Wild\n📍 Manitoba, Canada\n🌍 www.waypointwild.ca\n📸 Instagram: @waypoint.wild\nYour referral is the best thank you."}, {"dir": "out", "ts": "2026-10-05T14:51:36+02:00", "from": "k-bileskalne@tiernantravels.com", "subject": "Re: Brad - thoughts?", "body": "Hi Brad,\nGreat, glad it feels like a fit for the higher-end side. Happy to cover net pricing and the white-label process on the call.\nWaiting to hear when is a good time for you, here is the calenar link again if helps\nTalk soon\nKristine"}, {"di 06-8163"}, {"dir": "out", "ts": "2026-09-09T18:05:43+02:00", "from": "kristinebileskalne@tiernantraveloffice.com", "subject": "Re: Chris - thoughts?", "body": "Hi Chris,\nGood question - here is how it works in practice.\nYou share the brief with us (dates, group size, activities, accommodation standard) and based on it, we provide a tailored itinerary and proposal within 48 hrs. It goes out under your brand, not ours. Your client never sees Tiernan Travel.\nOn the commercial side, we usually provide net rates but we can also provide commisionable rates. We handle everything on the ground: private transfers, accommodation, and a UK contact for the duration of the trip.\nOf course, we keep the client relationship. We run the trip.\nIf you have a specific date or tour in mind, we can get a proposal so you can share with your clients.\nHow does that sound?\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-09T22:55:32+02:00", "from": "chartig@virginiagolfvacations.com", "subject": "RE: Chris - thoughts?", "body": "Thanks Kristine, what is the commission percentage you pay out?\nChris Hartig , PGA\nVirginia Golf Vacations\nCarlton Hospitality Group\n1-877-806-8163"}, {"dir": "out", "ts": "2026-09-10T13:57:55+02:00", "from": "kristinebileskalne@tiernantraveloffice.com", "subject": "RE: Chris - thoughts?", "body": "Hi Chris,\nWhen we provide commissionable rates we usually include 10-15%, though where it\nlands depends on the season, the local suppliers involved, and what the trip needs.\nSince you already have the repeat-customer base, the useful next step is probably a\nquick call to get the shape of a typical group down (size, time of year, hotel standard, how you like to package it). Then I can come back with an actual\nproposal and real numbers rather than a range.\nWould Friday or Monday morning your time work?\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-10T16:00:02+02:00", "from": "chartig@virginiagolfvacations.com", "subjec r in writing first?\nCheers,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-08-12T15:17:20+02:00", "from": "bob@latitudexp.com", "subject": "Re: Bob - thoughts?", "body": "Hi Kristine:\nThanks for the details. Your description sounds like what we look for in a DMC. Before I bring the idea to our CEO, Linda, tell me about golf in Scotland - maybe a sample itinerary. We have a gap in DMC services there. Also, a few stats would be nice: how many golf trips (ireland, Scotland) have you done in last say 2 yrs. Range in size of groups: largest, smallest, average. Range in cost as per person per day. Next step would be for Linda to review and determine interest in a discussion.\nCheers,\nBob Shepro Director of Marketing & Business Development\nShepro Travel Group, Inc\n7183 Surfbird Circle\nCarlsbad, CA 92011\n+1 760.550.1370\nwww.latitudexp.com\nBob@Latitudexp.com\nNamed a Condé Nast Traveler Top Travel Specialist in 2026"}, {"dir": "out", "ts": "2026-08-12T17:34:52+02:00", "from": "kristine.b@tiernantream.com", "subject": "Re: Bob - thoughts?", "body": "Hi Bob,\nGlad it landed well. Here is everything for Linda:\nThe Golfing Trail: Scotland's Best Greens\nSeven days, St Andrews Old Course, Carnoustie and Kingsbarns, with whisky and Fife village stops between rounds, so the non-golfer days are built in the same way as the Ireland one.\nOn cost, each itinerary is customised so it depends on the requirements. To give you a general idea, per person per night, high season May to September, two sharing: self-drive from £750 at 4-star and £1,000 at 5-star; with a driver-guide, from £1,150 at 4-star and £1,300 at 5-star. Outside May to September it comes in lower.\nBespoke FIT is what we do: couples, families, small private groups. No coach tours, no large groups.\nOn the golf numbers, both the Ireland and Scotland trails are popular routes for us and every one goes out customised, so no two are quite alike. Let me pull the exact figures.\nf Linda is happy with this, the next step is a quick call so I can get the details of what you need. I can bring the exact trip numbers and reference names to that, and cover anything else she wants to ask. Advisor testimonials are on the website in the meantime.\nAfter the call I can come back within 48 hours with an initial proposal, so you can both assess the fit.\nBest,\nKristine\n[tiernantravel.com](//tiernantravel.com)"}, {"dir": "out", "ts": "2026-08-17T16:29:01+02:00", "from": "kristine.b@tiernantream.com", "subject": "Re: Bob - thoughts?", "body": "Hi Bob,\nThe figures I promised:\nGolf trips: around 10 a year across Ireland and Scotland. Bespoke FIT is our core business - golf is a steady part of it, not a sideline we dabble in.\nGroup sizes: max 12 on golf groups, typically 5-6, which sits right in the 5-12 range you run.\nHappy to line up reference calls whenever you reach that stage.\nIf Linda would like to take a look at all this, the offer of a quick call stands - and after it I can have an initial proposal back within 48 hours.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-08-18T04:54:14+02:00", "from": "bob@latitudexp.com", "subject": "Re: Bob - thoughts?", "body": "Hi Kristine I have mentioned to Linda. I will pass this info along and see when she is available to talk. I am traveling the next few days and we probably won’t talk about it until late Thursday\nBob Sent from my iPhone"}, {"dir": "out", "ts": "2026-08-19T19:25:31+02:00", "from": "kristine.b@tiernantream.com", "subject": "Re: Bob - thoughts?", "body": "Hi Bob,\nThanks - enjoy the trip. Looking forward to hearing from you and Linda.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-21T01:56:58+02:00", "from": "bob@latitudexp.com", "subject": "Re: Bob - thoughts?", "body": "Hi Kristine: It's been awhile, hope all is well with you. I am now in a position to discuss specific golf needs for a Scotland trip and would like to arrange a call for Wed 10/21.\nI am on US Pacific time, 8 hr "Julieann is a travel advisor specializing in equestrian and luxury travel who needs to review your operational terms and discuss 2027 group planning.", "status": "Meeting Booked"}], "whatsapp": {"Kristine": "Good morning Kristine ☀️ Two calls today:\n\n📅 16:00 your time (10:00 for Annie, Central) · Annie Collins, Freedom Travel LLC\nhttps://www.freedomtravelllc.com\n\nAnnie is a travel architect looking for a DMC partner to help finalize and execute two specific Ireland itineraries for her clients.\n\n📅 17:30 your time (09:30 for Theresa, Mountain) · Theresa, Abril Travel\nhttps://www.abriltravel.com\n\nTheresa runs Abril Travel and wants to discuss her specific client base to determine if your DMC services align with her business needs.\n\nOne-pagers are in your inbox"}, "sources": [{"label": "Instantly analytics + lead walk", "at": "14:40"}, {"label": "fractional-cfo store", "at": "09:53"}, {"label": "ma-advisory store", "at": "09:53"}, {"label": "tiernan-pilot store", "at": "14:42"}, {"label": "inbox health snapshot", "at": "07:59"}]}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const pct = (n, d, dp = 1) => d ? (100 * n / d).toFixed(dp) + '%' : '–';
const p1 = v => v == null ? '–' : Number(v).toFixed(1) + '%';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const d = iso => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
const longDate = iso => { const x = d(iso); return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const shortDate = iso => { const x = d(iso); return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}`; };
const localTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const teamName = g => g.name.replace(/ pilot$/i, '');
const lastWD = shortDate(D.last_workday);
const prevWD = shortDate(D.prev_workday || D.last_workday);
const ago = n => n == null ? '' : n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n}d ago`;
const lastIn = l => [...(l.thread || [])].reverse().find(m => m.dir === 'in');
const leadsOf = g => D.leads.filter(l => l.slug === g.slug);
const callsOf = g => D.calls.filter(c => c.slug === g.slug);

// ── operator marks: one localStorage key, survives the daily rebuild ──
const KEY = 'daily.v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
};
const S = Object.assign({ done: {}, lost: {}, feedback: {}, tab: null }, store.load());
const save = () => store.save(S);
// a done mark holds until the lead writes again
const isDone = l => { const t = S.done[l.email]; if (!t) return false; const li = lastIn(l); return !li || t >= li.ts.slice(0, 10); };
const isLost = l => !!S.lost[l.email];
const needsYou = l => !l.flags.includes('lost') && !isDone(l) && !isLost(l);
const marked = () => D.leads.filter(l => isDone(l) || isLost(l) || S.feedback[l.email]).length;
function digest() {
  const lines = [`DAILY FEEDBACK ${D.date} (built ${D.built_at})`];
  D.leads.forEach(l => {
    if (isDone(l)) lines.push(`done  ${l.email}`);
    if (isLost(l)) lines.push(`lost  ${l.email}`);
    if (S.feedback[l.email]) lines.push(`note  ${l.email} · ${S.feedback[l.email].replace(/\s*\n+\s*/g, ' / ')}`);
  });
  if (lines.length === 1) lines.push('(nothing marked)');
  return lines.join('\n');
}

// ── overall strip ────────────────────────────────────────
function strip() {
  const doms = new Map(); // the two StackLeaps groups share one fleet: dedupe by domain name
  D.groups.forEach(g => ((g.health || {}).domains || []).forEach(x => doms.set(x.domain, x)));
  const sent = [...doms.values()].reduce((a, x) => a + (x.sent || 0), 0), bounced = [...doms.values()].reduce((a, x) => a + (x.bounced || 0), 0);
  const b = sent ? 100 * bounced / sent : null;
  const pos = D.groups.reduce((a, g) => a + (g.alltime.positive || 0), 0), con = D.groups.reduce((a, g) => a + g.alltime.contacted, 0);
  const booked = D.groups.reduce((a, g) => a + g.month.booked, 0), taken = D.groups.reduce((a, g) => a + (g.month.completed || 0), 0);
  const calls = D.calls.filter(c => c.today).length, need = D.leads.filter(needsYou).length, hot = D.leads.filter(l => needsYou(l) && l.flags.includes('hot')).length;
  const tile = (l, v, s, cls = '') => `<div><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="strip">
    ${tile('Bounce · 14 days', b == null ? '–' : p1(b), `${fmt(bounced)} of ${fmt(sent)} sent · ${doms.size} domains`, b == null ? '' : b > 5 ? 'bad' : b > 2 ? 'warn' : 'ok')}
    ${tile('Positive replies', pct(pos, con), `${fmt(pos)} of ${fmt(con)} contacted · all-time`)}
    ${tile('Calls · this month', `${fmt(booked)}<small style="font-size:14px;color:var(--ink-2)"> booked</small>`, `${fmt(taken)} already taken`)}
    ${tile('Calls today', fmt(calls), calls ? [...new Set(D.calls.filter(c => c.today).map(c => c.contact))].join(', ') : 'none')}
    ${tile('Needs you', `<span data-need>${fmt(need)}</span>`, hot ? `<span data-hot>${hot}</span> hot` : 'across all campaigns', need ? '' : 'ok')}
  </div>`;
}

// ── scoreline ─────────────────────────────────────────────
function formGuide(g) {
  const s = (g.series || []).slice(-14);
  if (!s.length) return '<p class="empty">No daily series.</p>';
  const W = 600, H = 84, top = 16, base = 68, gap = 6, bw = (W - gap * (s.length - 1)) / s.length;
  const max = Math.max(1, ...s.map(x => x.sent));
  let out = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emails sent per day, last 14 days">`;
  s.forEach((x, i) => {
    const h = x.sent ? Math.max(2, (base - top) * x.sent / max) : 0;
    const xx = i * (bw + gap);
    const cls = x.date === D.last_workday ? 'bar last' : (x.sent ? 'bar' : 'bar off');
    const dow = d(x.date).getDay();
    out += x.sent
      ? `<rect class="${cls}" rx="2" x="${xx.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" data-tip="<b>${shortDate(x.date)}</b>sent ${fmt(x.sent)}<br>replies ${fmt(x.replies)}<br>new leads ${fmt(x.contacted)}"/>`
      : `<rect class="${cls}" x="${xx.toFixed(1)}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" data-tip="<b>${shortDate(x.date)}</b>no sends"/>`;
    if (x.date === D.last_workday) out += `<text class="vlab" x="${(xx + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}">${fmt(x.sent)}</text>`;
    out += `<text class="daylab" x="${(xx + bw / 2).toFixed(1)}" y="${H - 4}">${'SMTWTFS'[dow]}</text>`;
  });
  out += `<line class="axis" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"/></svg>`;
  return out;
}
function scoreline(g) {
  const L = g.last, M = g.month, A = g.alltime, C = g.capacity;
  const delta = L.sent - L.prev_sent;
  const used = C.daily_limit ? L.sent / C.daily_limit : 0;
  const deltaLine = !L.prev_sent ? `no sends on ${prevWD}` : delta ? `<span class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${fmt(delta)}</span> vs ${prevWD}` : `same as ${prevWD}`;
  const cols = [
    ['Sent · ' + lastWD, fmt(L.sent), `${deltaLine}<br><b>${fmt(M.sent)}</b> this month · <b>${fmt(A.sent)}</b> all-time`],
    ['Positive replies', pct(A.positive, A.contacted), `<b>${fmt(A.positive)}</b> of ${fmt(A.contacted)} contacted, all-time<br><b>${fmt(L.replies)}</b> repl${L.replies === 1 ? 'y' : 'ies'} on ${lastWD}`],
    ['New replies · ' + lastWD, `${fmt(L.new_replies)}<small> · ${fmt(L.new_positive)} positive</small>`, `first reply ever from these leads<br><b>${fmt(M.new_replies)}</b> this month`],
    ['Calls', `${fmt(M.booked)}<small> booked</small>`, `this month · <b>${fmt(M.completed)}</b> already taken<br><b>${fmt(A.booked)}</b> upcoming (Meeting Booked)`],
  ];
  return `<div class="scoreline">
    <div class="score-head"><h2>${esc(teamName(g))}</h2><span>${esc(g.client)} · ${g.subs.length} sub-campaign${g.subs.length > 1 ? 's' : ''} · last work day ${lastWD}</span></div>
    <div class="score">${cols.map(([l, v, dd]) => `<div class="score-col"><div class="lab">${l}</div><div class="fig">${v}</div><div class="delta">${dd}</div></div>`).join('')}</div>
    <div class="form"><div class="form-lab"><span>Sent per day · 14 days</span><span>bounced ${fmt(L.bounced)} on ${lastWD} (${pct(L.bounced, L.sent)}) · ${fmt(M.bounced)} this month (${pct(M.bounced, M.sent)})</span></div>${formGuide(g)}</div>
    <div class="score-foot">
      <div><span>Capacity · <b>${fmt(L.sent)}</b> of <b>${fmt(C.daily_limit)}</b>/day on ${lastWD} (${C.active} active inboxes${C.errors ? `, <span class="bad">${C.errors} in error</span>` : ''})</span><div class="meter"><i class="${used > 1 ? 'over' : ''}" style="width:${Math.min(100, used * 100).toFixed(1)}%"></i></div></div>
      <div><span>Leads · <b>${fmt(A.left)}</b> left of <b>${fmt(A.leads)}</b> in the pool${A.left && L.contacted ? ` (~${Math.ceil(A.left / L.contacted)} send days)` : A.left ? '' : ' · <span class="bad">refill</span>'} · <b>${fmt(L.contacted)}</b> contacted on ${lastWD}</span><div class="meter"><i class="${!A.left ? 'over' : ''}" style="width:${A.leads ? Math.min(100, 100 * (1 - A.left / A.leads)).toFixed(1) : 0}%"></i></div></div>
      <div class="funnel"><span>Funnel, all-time:</span><span><b>${fmt(A.interested)}</b> interested</span><span><b>${fmt(A.booked)}</b> booked</span><span><b>${fmt(A.completed)}</b> completed</span><span><b>${fmt(A.won)}</b> won</span><span><b>${fmt(A.no_show)}</b> no-show</span><span><b>${fmt(A.retarget)}</b> retarget</span><span><b>${fmt(A.not_interested)}</b> not interested</span><span>booking rate <b>${A.booking_rate == null ? '–' : A.booking_rate.toFixed(2) + '%'}</b></span></div>
    </div>
  </div>`;
}

// ── leads queue ───────────────────────────────────────────
const TAGS = { hot: ['tag--hot', '🔥 hot'], booked: ['tag--booked', '📆 booked'], reminder: ['tag--rem', '⏰ reminder'], reply: ['', 'wrote last'], link_sent: ['tag--link', '🔗 link sent'], unread: ['tag--unread', 'not synced'], lost: ['tag--lost', 'lost'] };
const groupOf = l => l.flags.includes('lost') ? 'lost' : l.flags.includes('hot') ? 'Hot' : l.flags.includes('booked') ? 'Booked' : l.flags.includes('reminder') ? 'Reminders due' : l.flags.includes('reply') ? 'They wrote last' : 'Link sent, waiting';
function leadRow(l, g) {
  const tags = l.flags.filter(f => TAGS[f]).map(f => `<span class="tag ${TAGS[f][0]}">${TAGS[f][1]}</span>`);
  if (l.forward_to) tags.push(`<button class="tag tag--fwd copy" type="button" data-text="${esc(g.contact_email || '')}" title="forward to ${esc(g.contact_email || l.forward_to)} · click to copy the address">↪ ${esc(l.forward_to)}</button>`);
  const li = lastIn(l), quiet = ago(l.days_quiet);
  const who = l.flags.includes('reply') ? `they wrote ${quiet}` : `we wrote ${quiet}${l.flags.includes('link_sent') ? ' · link sent' : ''}`;
  const last = li ? `<div class="last" title="click to expand"><div class="subj">${esc(li.subject || '(no subject)')} <span class="dim">· ${shortDate(li.ts.slice(0, 10))}</span></div><pre>${esc(li.body || '')}</pre></div>`
    : (l.flags.includes('unread') ? `<div class="last"><pre>Thread not in the store yet (fetch stores only Interested, Booked and Completed leads). Read it in Instantly.</pre></div>` : '');
  const done = isDone(l), lost = isLost(l);
  const link = l.unibox_url ? `<a class="email" href="${esc(l.unibox_url)}" target="_blank" rel="noopener">${esc(l.email)}</a><a class="ibtn" href="${esc(l.unibox_url)}" target="_blank" rel="noopener" title="open in Instantly" aria-label="open in Instantly"><svg><use href="#i-instantly"/></svg></a>` : `<span class="email">${esc(l.email)}</span>`;
  return `<article class="lead ${done ? 'is-done' : ''} ${lost ? 'is-lost' : ''}" data-email="${esc(l.email)}" data-url="${esc(l.unibox_url || '')}" tabindex="0">
    <label class="done-wrap"><input type="checkbox" class="done" aria-label="done with ${esc(l.email)}" ${done ? 'checked' : ''}></label>
    <div class="tags">${tags.join('')}</div>
    <div class="lead-main">
      <div class="lead-id"><button class="btn icon copy" type="button" aria-label="Copy ${esc(l.email)}" title="copy"><svg><use href="#i-copy"/></svg></button>${link}</div>
      <div class="who">${esc(l.name)} <span class="co">${esc(l.company)}</span> <span class="status">${esc(l.status)}</span></div>
      <p class="sum">${esc(l.summary)}</p>
      ${(l.reminders || []).map(r => `<p class="rem">⏰ ${esc(r)}</p>`).join('')}
    </div>
    <div class="side">
      <div class="meta">${who}</div>
      <div class="acts">${(l.thread || []).length ? `<button class="btn thread-btn" type="button">full thread</button>` : ''}<button class="btn lost-btn ${lost ? 'on' : ''}" type="button">${lost ? 'unmark lost' : 'mark lost'}</button></div>
      <textarea class="fb" rows="1" placeholder="feedback for the daily">${esc(S.feedback[l.email] || '')}</textarea>
    </div>
    ${last}
  </article>`;
}
function leads(g) {
  const all = leadsOf(g);
  const live = all.filter(l => !l.flags.includes('lost'));
  const lost = all.filter(l => l.flags.includes('lost'));
  let out = '';
  if (!live.length) out += `<p class="empty">Nothing is waiting on you here.</p>`;
  let cur = null;
  live.forEach(l => { const grp = groupOf(l); if (grp !== cur) { out += `<div class="group-lab">${grp}</div>`; cur = grp; } out += leadRow(l, g); });
  if (lost.length) out += `<details class="lost"><summary>Treated as lost · ${lost.length} · three of our emails in a row, no answer</summary><ul class="lost-list">${lost.map(l => `<li><span>${esc(l.email)}</span><span class="dim">${esc(l.company)}</span><span class="dim">quiet ${l.days_quiet}d</span></li>`).join('')}</ul></details>`;
  const need = live.filter(needsYou).length;
  return `<section><h2 class="sec">Needs you <span class="count" data-count-group="${esc(g.slug)}">${need}</span><span class="sub">their email is newest (last ${D.window_days} days), a reminder fell due, or we sent the Calendly link and they went quiet</span></h2>
    <p class="hint"><kbd>j</kbd><kbd>k</kbd> move · <kbd>c</kbd> copy email · <kbd>o</kbd> open in Instantly · <kbd>t</kbd> full thread · <kbd>x</kbd> done · <kbd>enter</kbd> expand their last email</p>
    <div class="queue">${out}</div></section>`;
}

// ── calls ─────────────────────────────────────────────────
const viewerTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'your zone'; } })();
function calls(g) {
  const cs = callsOf(g);
  const contact = g.contact || 'Calls';
  if (!cs.length) return `<section><h2 class="sec">${esc(g.contact ? `${g.contact}'s calls` : 'Calls')}</h2><p class="empty">No calls booked in the next 7 days.</p></section>`;
  const rows = cs.map(c => `<div class="call ${c.today ? 'today' : ''}">
    <div><div class="d">${c.today ? 'Today' : shortDate(c.date)}</div><div class="t">${c.client_time}<small>${esc(contact)}'s time · ${c.lead_time} ${esc(c.lead_tz)} for ${esc((c.name || '').split(' ')[0])}</small></div></div>
    <div><div class="who">${esc(c.name)} <span class="co">${esc(c.company)}</span> <span class="status">${esc(c.status)}</span></div>
      ${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}
      <div class="files">${c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\/(www\.)?/, ''))}</a> · ` : ''}${c.brief ? `one-pager ${esc(c.brief)}` : '<span class="bad">no one-pager in the store</span>'} · <span class="copy-email" data-email="${esc(c.email)}">${esc(c.email)}</span></div>
      ${c.today && c.reminder ? `<div class="remind"><header><span>Reminder to ${esc((c.name || '').split(' ')[0])} · paste in Instantly as ${esc(contact)} · <b>send after ${localTime(c.send_after)}</b> your time (${esc(viewerTZ)}, that is 08:00 for them)${Date.now() >= Date.parse(c.send_after) ? ' · ok to send now' : ''}</span><button class="btn copy" type="button" data-text="${esc(c.reminder)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy</span></button></header><pre>${esc(c.reminder)}</pre></div>` : ''}
    </div>
  </div>`).join('');
  const wa = g.contact ? D.whatsapp[g.contact] : null;
  return `<section><h2 class="sec">${esc(g.contact ? `${g.contact}'s calls` : 'Calls')} <span class="sub">${cs.filter(c => c.today).length} today · ${cs.length} in the next 7 days</span></h2>
    <div class="calls"><div>${rows}</div>
    ${g.contact ? (wa ? `<aside class="wa"><header><span>WhatsApp to ${esc(g.contact)}</span><button class="btn copy" type="button" data-text="${esc(wa)}"><svg><use href="#i-copy"/></svg><span class="copy-label">copy message</span></button></header><pre>${esc(wa)}</pre></aside>` : `<aside class="wa"><header><span>WhatsApp to ${esc(g.contact)}</span></header><pre class="dim">No call today, no morning message.</pre></aside>`) : ''}</div></section>`;
}

// ── box score ─────────────────────────────────────────────
function boxscore(g) {
  const L = g.last, M = g.month;
  const rows = g.subs.map(s => `<tr><td class="l">${esc(s.name)} <span class="dim">${esc(s.status)}</span></td><td>${fmt(s.leads)}</td><td>${fmt(s.contacted)}</td><td class="${s.left === 0 && s.status === 'Active' ? 'bad' : ''}">${fmt(s.left)}${s.left === 0 && s.status === 'Active' ? ' <small>refill</small>' : ''}</td><td>${fmt(s.last_sent)}</td><td>${fmt(s.last_replies)}</td><td>${pct(s.last_replies, s.last_sent)}</td><td class="${s.last_sent && s.last_bounced / s.last_sent > .05 ? 'bad' : s.last_sent && s.last_bounced / s.last_sent > .02 ? 'warn' : ''}">${fmt(s.last_bounced)} <span class="dim">${pct(s.last_bounced, s.last_sent)}</span></td><td>${fmt(s.month_sent)}</td><td>${fmt(s.month_bounced)} <span class="dim">${pct(s.month_bounced, s.month_sent)}</span></td></tr>`).join('');
  const total = `<tr class="total"><td class="l">Total</td><td>${fmt(g.alltime.leads)}</td><td>${fmt(g.alltime.contacted)}</td><td>${fmt(g.alltime.left)}</td><td>${fmt(L.sent)}</td><td>${fmt(L.replies)}</td><td>${pct(L.replies, L.sent)}</td><td>${fmt(L.bounced)} <span class="dim">${pct(L.bounced, L.sent)}</span></td><td>${fmt(M.sent)}</td><td>${fmt(M.bounced)} <span class="dim">${pct(M.bounced, M.sent)}</span></td></tr>`;
  return `<section><h2 class="sec">Box score <span class="sub">per sub-campaign · ${lastWD} and month to date</span></h2>
    <div class="scroll"><table class="agate"><thead><tr><th>Sub-campaign</th><th>Leads</th><th>Contacted</th><th>Left</th><th>Sent ${lastWD}</th><th>Replies</th><th>Reply %</th><th>Bounced</th><th>Sent · month</th><th>Bounced · month</th></tr></thead><tbody>${rows}${total}</tbody></table></div></section>`;
}

// ── inboxes ───────────────────────────────────────────────
const VERD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'ok', 'look-into': 'note', worry: 'red' };
const WORD = { OK: 'ok', NOTE: 'note', RED: 'red', great: 'great', 'look-into': 'look', worry: 'low' };
const driftLine = drift => { const by = {}; drift.forEach(s => { const i = s.indexOf(': '); const dom = i < 0 ? s : s.slice(0, i), why = i < 0 ? '' : s.slice(i + 2); (by[why] ||= []).push(dom); }); return Object.entries(by).map(([why, ds]) => `${ds.length} domain${ds.length > 1 ? 's' : ''} ${esc(why)}: ${ds.map(esc).join(', ')}`).join('<br>'); };
function replyGraph(x) {
  const t = (x.trend || []).filter(p => p.reply_pct != null);
  if (t.length < 2) return `<p class="dim" style="margin:0">Not enough history yet for ${esc(x.domain)} (${t.length} snapshot${t.length === 1 ? '' : 's'}).</p>`;
  const W = 1000, H = 96, base = 86, top = 10, max = Math.max(0.5, ...t.map(p => p.reply_pct));
  const X = i => i * W / (t.length - 1), Y = v => base - (base - top) * v / max;
  const pts = t.map((p, i) => `${X(i).toFixed(1)},${Y(p.reply_pct).toFixed(1)}`);
  const first = t[0], last = t[t.length - 1], then = t.length >= 8 ? t[t.length - 8] : null;
  return `<div class="rg">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Reply rate for ${esc(x.domain)}, rolling 14 days, one point per snapshot">
      <line class="g" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
      <path class="area" d="M${pts[0]} L${pts.join(' L')} L${W},${base} L0,${base} Z"/>
      <path d="M${pts.join(' L')}"/>
      <circle class="pt" cx="${X(t.length - 1).toFixed(1)}" cy="${Y(last.reply_pct).toFixed(1)}" r="3"/>
    </svg>
    <div class="read"><b>${esc(x.domain)}</b> · reply rate, rolling 14 days<br>now <b>${p1(last.reply_pct)}</b> (${fmt(last.replies)} replies on ${fmt(last.sent)} sent)${then ? `<br>7 snapshots ago <b>${p1(then.reply_pct)}</b>` : ''}<br><span class="dim">${shortDate(first.date)} → ${shortDate(last.date)} · ${t.length} snapshots</span></div>
  </div>`;
}
function inboxes(g) {
  const h = g.health;
  if (!h) return `<section><h2 class="sec">Inboxes</h2><p class="empty">No inbox-health snapshot for this campaign.</p></section>`;
  const dom = h.domains, al = h.allocation || {};
  const red = dom.filter(x => x.bounce_verdict === 'RED').length, note = dom.filter(x => x.bounce_verdict === 'NOTE').length, bl = dom.filter(x => x.blacklist).length, drops = dom.filter(x => x.reply_drop).length;
  const verdict = (v, word) => `<span class="verdict ${VERD[word] || ''}"><i></i>${p1(v)}${WORD[word] ? ` <small>${WORD[word]}</small>` : ''}</span>`;
  const rows = dom.map((x, i) => `<tr class="clickable" data-dom="${i}" title="click for the reply trend"><td class="l">${esc(x.domain)}${x.reply_drop ? '<span class="drop">drop</span>' : ''}</td><td class="l dim">${esc(x.state || '–')}</td><td>${fmt(x.inboxes)}</td><td>${fmt(x.capacity || null)}</td><td>${fmt(x.sent)}</td><td>${verdict(x.bounce_pct, x.bounce_verdict)}</td><td>${fmt(x.replies)}</td><td>${verdict(x.reply_pct, x.reply_verdict)}</td><td class="l ${x.blacklist ? 'warn' : 'dim'}">${esc(x.blacklist || 'clean')}</td></tr>`).join('');
  const S_ = dom.reduce((a, x) => a + (x.sent || 0), 0), B_ = dom.reduce((a, x) => a + (x.bounced || 0), 0), R_ = dom.reduce((a, x) => a + (x.replies || 0), 0);
  const total = `<tr class="total"><td class="l">Total · ${dom.length} domains</td><td class="l dim"></td><td>${fmt(al.total_inboxes)}</td><td>${fmt(al.active_capacity || null)}</td><td>${fmt(S_)}</td><td>${pct(B_, S_, 2)} <span class="dim">${fmt(B_)}</span></td><td>${fmt(R_)}</td><td>${pct(R_, S_, 2)}</td><td class="l dim">${bl ? `${bl} listed` : 'clean'}</td></tr>`;
  return `<section data-group-inbox="${esc(g.slug)}"><h2 class="sec">Inboxes <span class="sub">per sending domain · 14-day window · snapshot ${esc(h.snapshot_date)} ${esc((h.fetched_at || '').slice(11, 16))}</span></h2>
    <p class="team-sub">${dom.length} domains · ${fmt(al.total_inboxes)} inboxes${al.active_capacity ? ` · ${Math.round(100 * al.utilisation)}% of ${fmt(al.active_capacity)}/day used on the last send day` : ''} · ${red ? `<span class="bad">${red} red</span> · ` : ''}${note ? `<span class="warn">${note} to watch</span> · ` : ''}${drops ? `<span class="bad">${drops} reply drop${drops > 1 ? 's' : ''}</span> · ` : ''}${bl ? `<span class="warn">${bl} blacklisted</span>` : 'no blacklist hits'}</p>
    <div class="scroll"><table class="agate"><thead><tr><th>Domain</th><th>State</th><th>Inboxes</th><th>Cap/day</th><th>Sent 14d</th><th>Bounce</th><th>Replies</th><th>Reply %</th><th>Blacklist</th></tr></thead><tbody>${rows}${total}</tbody></table></div>
    <p class="hint">Click a domain for its reply trend. <b>drop</b> = reply rate fell 30%+ against 7 snapshots earlier, on 150+ sends. Bounce: <b>red</b> over 5% (past 150 sent), <b>note</b> 2–5%, <b>ok</b> under 2% · Reply: <b>great</b> 2.6% and up, <b>look</b> around 1%, <b>low</b> under 0.8%; no word = too few sends to judge.</p>
    ${h.drift.length ? `<p class="drift">Drift · ${driftLine(h.drift)}</p>` : ''}</section>`;
}

// ── assemble ──────────────────────────────────────────────
const tabCount = g => { const ls = leadsOf(g).filter(needsYou); return `<span class="n ${ls.length ? (ls.some(l => l.flags.includes('hot')) ? 'hot' : '') : 'zero'}" data-tab-count="${esc(g.slug)}">${ls.length}</span>`; };
$('#app').innerHTML = `
<header class="mast">
  <div><h1>Daily</h1><div class="dateline"><b>${DAYNAMES[d(D.date).getDay()]} ${longDate(D.date)}</b> · StackLeaps · built ${esc(D.built_at)} · last work day ${lastWD}</div></div>
  <div class="tools"><small>done · lost · notes stay in this browser</small><button class="btn primary copy" type="button" id="digest" data-digest="1"><svg><use href="#i-copy"/></svg><span class="copy-label">Copy feedback</span> <span class="n" data-fb-count>${marked()}</span></button></div>
</header>
${strip()}
<nav class="tabs" role="tablist">${D.groups.map(g => `<button role="tab" class="t-${esc(g.color)}" data-group="${esc(g.slug)}" aria-selected="false">${esc(teamName(g))} ${tabCount(g)}</button>`).join('')}</nav>
${D.groups.map(g => `<section class="panel t-${esc(g.color)}" data-group="${esc(g.slug)}" hidden>${scoreline(g)}${leads(g)}${calls(g)}${boxscore(g)}${inboxes(g)}</section>`).join('')}
<footer><ul>${D.sources.map(s => `<li>${esc(s.label)} · ${esc(s.at)}</li>`).join('')}</ul><span>private page · not indexed · rebuilt every morning by /daily</span></footer>`;

// ── tabs ──────────────────────────────────────────────────
let cur = -1;
function show(slug) {
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.group !== slug);
  document.querySelectorAll('.tabs [role=tab]').forEach(b => { const on = b.dataset.group === slug; b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ inline: 'nearest', block: 'nearest' }); });
  S.tab = slug; save(); cur = -1;
}
show(D.groups.some(g => g.slug === S.tab) ? S.tab : (D.groups[0] || {}).slug);

// ── behaviour ─────────────────────────────────────────────
function refreshCounts() {
  D.groups.forEach(g => { const el = document.querySelector(`[data-count-group="${g.slug}"]`), t = document.querySelector(`[data-tab-count="${g.slug}"]`); const ls = leadsOf(g).filter(needsYou); if (el) el.textContent = ls.length; if (t) { t.textContent = ls.length; t.className = `n ${ls.length ? (ls.some(l => l.flags.includes('hot')) ? 'hot' : '') : 'zero'}`; } });
  const need = D.leads.filter(needsYou).length, n = $('[data-need]'), h = $('[data-hot]'), fb = $('[data-fb-count]');
  if (n) n.textContent = need; if (h) h.textContent = D.leads.filter(l => needsYou(l) && l.flags.includes('hot')).length; if (fb) fb.textContent = marked();
}
async function copyText(text, btn, row) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (btn) { const lab = btn.querySelector('.copy-label'), use = btn.querySelector('use'); const old = lab ? lab.textContent : ''; btn.classList.add('done'); if (lab) lab.textContent = 'copied'; if (use) use.setAttribute('href', '#i-check'); setTimeout(() => { btn.classList.remove('done'); if (lab) lab.textContent = old; if (use) use.setAttribute('href', use.getAttribute('href') === '#i-check' && btn.classList.contains('tag--fwd') ? '#i-copy' : '#i-copy'); }, 1400); }
  if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
}
const leadOf = row => D.leads.find(l => l.email === row.dataset.email);
const dlg = $('#thread');
function openThread(l) {
  const msgs = (l.thread || []).map(m => `<article class="msg ${m.dir}"><div class="m"><span>${m.dir === 'in' ? 'them' : 'us'}</span><span>${shortDate(m.ts.slice(0, 10))} ${m.ts.slice(11, 16)}</span><span>${esc(m.from)}</span></div>${m.subject ? `<div class="subj">${esc(m.subject)}</div>` : ''}<pre>${esc(m.body)}</pre></article>`).join('');
  dlg.innerHTML = `<div class="th-head"><div><h3>${esc(l.name)} <span class="dim" style="font-weight:400">· ${esc(l.company)}</span></h3><div class="sub">${esc(l.email)} · ${esc(l.status)} · ${(l.thread || []).length} messages, newest last</div></div><button class="btn" type="button" data-close>close <kbd style="font:inherit;opacity:.7">esc</kbd></button></div><div class="th-body">${msgs}</div>`;
  dlg.showModal(); dlg.querySelector('.th-body').scrollTop = 1e9;
}
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
document.addEventListener('click', e => {
  const tab = e.target.closest('.tabs [role=tab]');
  if (tab) { show(tab.dataset.group); return; }
  const btn = e.target.closest('.copy');
  if (btn) { const row = btn.closest('.lead'); copyText(btn.dataset.digest ? digest() : (btn.dataset.text || (row && row.dataset.email)), btn, row); if (row) focusRow(row); return; }
  const ce = e.target.closest('.copy-email');
  if (ce) { copyText(ce.dataset.email); ce.textContent = 'copied'; setTimeout(() => ce.textContent = ce.dataset.email, 1400); return; }
  const tb = e.target.closest('.thread-btn');
  if (tb) { openThread(leadOf(tb.closest('.lead'))); return; }
  const lb = e.target.closest('.lost-btn');
  if (lb) { const row = lb.closest('.lead'), l = leadOf(row); if (isLost(l)) delete S.lost[l.email]; else S.lost[l.email] = D.date; save(); row.classList.toggle('is-lost', isLost(l)); lb.classList.toggle('on', isLost(l)); lb.textContent = isLost(l) ? 'unmark lost' : 'mark lost'; refreshCounts(); return; }
  const dr = e.target.closest('tr.clickable');
  if (dr) { const next = dr.nextElementSibling; if (next && next.classList.contains('graph')) { next.remove(); return; } const sec = dr.closest('[data-group-inbox]'), g = D.groups.find(x => x.slug === sec.dataset.groupInbox); const tr = document.createElement('tr'); tr.className = 'graph'; tr.innerHTML = `<td colspan="9">${replyGraph(g.health.domains[+dr.dataset.dom])}</td>`; dr.after(tr); return; }
  const last = e.target.closest('.last');
  if (last) { last.closest('.lead').classList.toggle('open'); return; }
  const row = e.target.closest('.lead');
  if (row && !e.target.closest('a, input, textarea, button')) focusRow(row);
});
document.addEventListener('change', e => {
  const cb = e.target.closest('.done');
  if (!cb) return;
  const row = cb.closest('.lead'), l = leadOf(row);
  if (cb.checked) S.done[l.email] = D.date; else delete S.done[l.email];
  save(); row.classList.toggle('is-done', cb.checked); refreshCounts();
});
document.addEventListener('input', e => {
  const ta = e.target.closest('.fb');
  if (!ta) return;
  const l = leadOf(ta.closest('.lead')), v = ta.value.trim();
  if (v) S.feedback[l.email] = v; else delete S.feedback[l.email];
  save(); refreshCounts();
});
const rows = () => [...document.querySelectorAll('.panel:not([hidden]) .lead')];
function focusRow(row) { rows().forEach(r => r.classList.remove('focus')); row.classList.add('focus'); cur = rows().indexOf(row); row.scrollIntoView({ block: 'nearest' }); }
document.addEventListener('keydown', e => {
  if (e.target.matches('input:not([type=checkbox]), textarea') || e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  const rs = rows(); if (!rs.length) return;
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); cur = Math.min(rs.length - 1, Math.max(0, cur + (e.key === 'j' ? 1 : -1))); focusRow(rs[cur]); }
  else if (cur < 0) return;
  else if (e.key === 'c') { copyText(rs[cur].dataset.email, rs[cur].querySelector('.copy'), rs[cur]); }
  else if (e.key === 'o') { if (rs[cur].dataset.url) window.open(rs[cur].dataset.url, '_blank', 'noopener'); }
  else if (e.key === 't') { const l = leadOf(rs[cur]); if ((l.thread || []).length) openThread(l); }
  else if (e.key === 'x') { const cb = rs[cur].querySelector('.done'); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); }
  else if (e.key === 'Enter') { rs[cur].classList.toggle('open'); }
});
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + 'px';
});
})();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>StackLeaps Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#f8f9ff; --card:#fff; --sunk:#eef2fa;
  --ink:#0e1d2b; --ink-2:#43474d; --ink-3:#73777e;
  --outline:#c3c7ce; --ghost:rgba(195,199,206,.4); --ghost-2:rgba(195,199,206,.2);
  --navy:#16314a; --navy-2:#2e4862;
  --apricot:#ff8e3b; --apricot-deep:#984800; --apricot-soft:#ffdbc8;
  --ok:#137a2b; --note:#b45309; --red:#b91c1c;
  --shadow:0 20px 40px rgba(14,29,43,.06);
  --r-sm:6px; --r-md:8px; --r-lg:16px; --r-full:999px;
  --display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter:32px;
  color-scheme:light;
}
/* team scopes: one class on the tab + its panel sets every tint below */
.t-orange{--team:#ff8e3b;--team-deep:#984800;--team-soft:#ffdbc8;--team-tint:#fff6ef}
.t-blue{--team:#2e5c9e;--team-deep:#16314a;--team-soft:#dbe9fd;--team-tint:#eff4fc}
.t-purple{--team:#6b4fbb;--team-deep:#4a3390;--team-soft:#e9e3fa;--team-tint:#f5f2fc}
.t-navy{--team:#16314a;--team-deep:#0e1d2b;--team-soft:#e4efff;--team-tint:#f1f5fc}

*{box-sizing:border-box}
html{background:var(--surface)}
body{margin:0;background:var(--surface);color:var(--ink);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--apricot-soft);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--apricot-deep);outline-offset:2px;border-radius:var(--r-sm)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
*{scrollbar-color:var(--outline) transparent;scrollbar-width:thin}
main{max-width:1440px;margin:0 auto;padding:0 var(--gutter) 96px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.fig,.agate td,.score .n,.strip .v,.call .t,.meter-lab b{font-family:var(--mono)}
.dim{color:var(--ink-3)} .bad{color:var(--red);font-weight:600} .warn{color:var(--note);font-weight:600}
.empty{padding:24px 0;color:var(--ink-2);border-top:1px solid var(--ghost)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 10px;font:600 12px/1 var(--ui);color:var(--ink-2);background:var(--card);white-space:nowrap;transition:background .12s,color .12s}
.btn:hover{background:var(--sunk);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--apricot);border-color:var(--apricot);color:var(--navy)}
.btn.primary:hover{background:#ffa05a}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .n{font-family:var(--mono);background:var(--navy);color:#fff;border-radius:var(--r-full);padding:2px 7px;font-size:11px}
.btn.primary .n{background:var(--navy)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.icon{padding:6px;border-radius:var(--r-sm)}

/* masthead + strip */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:26px 0 18px}
.mast h1{margin:0;font:800 30px/1 var(--display);color:var(--navy)}
.mast .dateline{font-size:13px;color:var(--ink-2);margin-top:6px}
.mast .dateline b{color:var(--ink);font-weight:600}
.mast .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mast .tools small{font-size:12px;color:var(--ink-3)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:16px 0 20px;border-top:1px solid var(--ghost)}
.strip > div{padding:0 0 0 14px;border-left:2px solid var(--ghost)}
.strip .l{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.strip .v{font:600 26px/1 var(--mono);color:var(--ink)}
.strip .v.bad{color:var(--red)} .strip .v.warn{color:var(--note)} .strip .v.ok{color:var(--ok)}
.strip .s{font-size:12px;color:var(--ink-2);margin-top:6px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:var(--surface);padding:8px 0 0;margin:0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter);overflow-x:auto;border-bottom:1px solid var(--ghost)}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px 12px;font:700 14px/1 var(--display);color:var(--ink-2);border-radius:var(--r-md) var(--r-md) 0 0;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{background:var(--team-tint);color:var(--team-deep)}
.tabs button[aria-selected="true"]{background:var(--team-soft);color:var(--team-deep);border-bottom-color:var(--team)}
.tabs .n{font:600 11px/1 var(--mono);background:var(--card);color:var(--ink-2);border:1px solid var(--ghost);border-radius:var(--r-full);padding:3px 7px;min-width:22px;text-align:center}
.tabs button[aria-selected="true"] .n{background:var(--team-deep);color:#fff;border-color:var(--team-deep)}
.tabs .n.zero{opacity:.6}
.tabs .n.hot{background:var(--red);color:#fff;border-color:var(--red)}

/* panels + sections */
.panel{padding-top:8px}
.panel[hidden]{display:none}
section{padding-top:36px}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;font:700 20px/1.1 var(--display);color:var(--team-deep)}
.sec .count{font:600 12px/1 var(--mono);background:var(--team-deep);color:#fff;border-radius:var(--r-full);padding:4px 8px;position:relative;top:-2px}
.sec .sub{font:400 13px/1.4 var(--ui);color:var(--ink-2)}
.hint{margin:-4px 0 12px;font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px/1 var(--mono);border:1px solid var(--ghost);border-bottom-width:2px;border-radius:4px;padding:2px 5px;margin:0 2px;background:var(--card)}
.chip{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-full);background:var(--team-soft);color:var(--team-deep);white-space:nowrap}

/* scoreline */
.scoreline{border-top:1px solid var(--ghost);padding-top:14px}
.score-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.score-head h2{margin:0;font:800 24px/1 var(--display);color:var(--team-deep)}
.score-head span{font-size:12px;color:var(--ink-2)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.score-col{padding:0 0 0 14px;border-left:2px solid var(--team-soft)}
.score-col .lab{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.score-col .fig{font:600 40px/1 var(--mono);color:var(--ink);letter-spacing:-.02em}
.score-col .fig small{font-size:16px;color:var(--ink-2);font-weight:500}
.score-col .delta{margin-top:8px;font-size:12px;color:var(--ink-2);line-height:1.5}
.score-col .delta b{font-weight:600;color:var(--ink)}
.score-col .delta .up{color:var(--ok)} .score-col .delta .down{color:var(--note)}
.form{margin-top:18px}
.form .form-lab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.form svg{display:block;width:100%;height:84px;overflow:visible}
.form .bar{fill:var(--team-soft)} .form .bar.last{fill:var(--team)} .form .bar.off{fill:var(--ghost-2)}
.form .daylab{font:500 10px var(--ui);fill:var(--ink-3);text-anchor:middle}
.form .vlab{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.form .axis{stroke:var(--ghost);stroke-width:1}
.score-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--ghost);display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;font-size:13px;color:var(--ink-2)}
.score-foot b{color:var(--ink);font-weight:600}
.score-foot .funnel{grid-column:1 / -1;display:flex;gap:6px 18px;flex-wrap:wrap}
.meter{margin-top:6px;height:6px;border-radius:var(--r-full);background:var(--team-soft);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--team);border-radius:var(--r-full)}
.meter i.over{background:var(--red)}

/* leads queue */
.queue{border-top:1px solid var(--ghost)}
.group-lab{font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:16px 0 6px;border-bottom:1px solid var(--ghost)}
.lead{display:grid;grid-template-columns:26px 118px 1fr 230px;gap:8px 18px;padding:14px 0;border-bottom:1px solid var(--ghost);position:relative;align-items:start}
.lead.focus{outline:2px solid var(--team);outline-offset:-2px;border-radius:var(--r-md);padding-left:10px;padding-right:10px;background:var(--card)}
.lead.flash .lead-id{animation:flash .6s ease-out}
@keyframes flash{0%{background:var(--team-soft)}100%{background:transparent}}
.lead.is-done{opacity:.5}
.lead.is-done .sum,.lead.is-done .last,.lead.is-done .rem{display:none}
.lead.is-lost .who,.lead.is-lost .sum{color:var(--ink-3);text-decoration:line-through}
.done-wrap{display:flex;align-items:center;justify-content:center;padding-top:4px}
.done{width:18px;height:18px;margin:0;accent-color:var(--team-deep);cursor:pointer}
.tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tag{font:600 11px/1 var(--ui);padding:5px 8px;border-radius:var(--r-full);background:var(--card);border:1px solid var(--ghost);color:var(--ink-2);white-space:nowrap}
.tag--hot{background:#fdecec;border-color:#f6c9c9;color:var(--red)}
.tag--booked{background:var(--team-soft);border-color:transparent;color:var(--team-deep)}
.tag--rem{background:#fff4d6;border-color:#f5dfa0;color:#7a5200}
.tag--link{border-style:dashed}
.tag--lost,.tag--unread{color:var(--ink-3)}
.tag--fwd{background:var(--navy);border-color:var(--navy);color:#fff;cursor:pointer}
.tag--fwd.done{background:var(--ok);border-color:var(--ok)}
.lead-id{display:flex;align-items:center;gap:8px;min-width:0;margin:-4px -6px 2px;padding:4px 6px;border-radius:var(--r-sm)}
.email{font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--ghost);color:var(--navy)}
.email:hover{border-bottom-color:var(--navy)}
.ibtn{display:inline-flex;flex:0 0 auto;color:var(--navy);opacity:.75}
.ibtn:hover{opacity:1}
.ibtn svg{width:16px;height:16px}
.who{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who .co{font-weight:400;color:var(--ink-2)}
.status{font-size:12px;color:var(--ink-3);font-weight:400}
.sum{margin:4px 0 0;color:var(--ink);text-wrap:pretty}
.sum:empty{display:none}
.rem{margin:6px 0 0;padding:6px 10px;border-radius:var(--r-sm);background:#fff8e6;font-size:13px;color:#5a3d00}
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.fb{width:100%;min-height:30px;resize:vertical;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 9px;font:400 12px/1.4 var(--ui);color:var(--ink);background:var(--card)}
.fb::placeholder{color:var(--ink-3)}
.fb:focus{border-color:var(--team);outline:none}
.last{grid-column:3 / -1;margin:2px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--ghost-2);border-radius:var(--r-md);font-size:13px;color:var(--ink-2);max-height:8.5em;overflow:hidden;position:relative;cursor:pointer}
.last .subj{font-weight:600;color:var(--ink);margin-bottom:4px}
.last pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.last::after{content:"";position:absolute;inset:auto 0 0 0;height:26px;background:linear-gradient(transparent,var(--card))}
.lead.open .last{max-height:none}
.lead.open .last::after{display:none}
.lost-list{margin:0;padding:10px 0 0;list-style:none;font-size:13px;color:var(--ink-2)}
.lost-list li{display:flex;gap:16px;padding:6px 0;border-bottom:1px solid var(--ghost-2)}
details.lost summary{cursor:pointer;padding:12px 0;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* calls */
.calls{display:grid;grid-template-columns:1fr 440px;gap:28px;align-items:start}
.call{display:grid;grid-template-columns:140px 1fr;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--ghost)}
.call:first-child{border-top:1px solid var(--ghost)}
.call .t{font:600 26px/1 var(--mono);color:var(--ink)}
.call .t small{display:block;font:500 12px/1.3 var(--ui);color:var(--ink-2);margin-top:4px}
.call .d{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.call.today .d{color:var(--ok)}
.call .who{font-size:15px}
.call .note{color:var(--ink-2);margin:2px 0 0}
.call .files{font-size:12px;color:var(--ink-3);margin-top:4px}
.copy-email{cursor:pointer;border-bottom:1px dashed var(--outline)}
.remind{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--team-tint);border:1px solid var(--team-soft)}
.remind header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.remind header b{color:var(--team-deep);font-weight:600}
.remind pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.wa{border:1px solid var(--ghost);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow)}
.wa header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ghost);font:700 13px/1 var(--display);color:var(--team-deep)}
.wa pre{margin:0;padding:16px;font:400 14px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* tables */
.scroll{overflow-x:auto;margin-bottom:8px}
table.agate{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--ghost)}
.agate th{font:600 11px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:9px 10px;border-bottom:1px solid var(--ghost);white-space:nowrap}
.agate th:first-child,.agate td:first-child{text-align:left;padding-left:0}
.agate td{padding:8px 10px;border-bottom:1px solid var(--ghost-2);text-align:right;white-space:nowrap;font-size:12.5px}
.agate tr.total td{border-top:1px solid var(--outline);font-weight:600}
.agate td.l{text-align:left;font-family:var(--ui)}
.agate td small{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.agate tr.clickable{cursor:pointer}
.agate tr.clickable:hover td{background:var(--sunk)}
.agate tr.graph td{padding:12px 0 16px;white-space:normal;text-align:left;background:var(--card)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.verdict i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.verdict.ok i{background:var(--ok)} .verdict.note i{background:var(--note)} .verdict.red i{background:var(--red)}
.verdict.ok{color:var(--ok)} .verdict.note{color:var(--note)} .verdict.red{color:var(--red)}
.verdict small{font:500 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.drop{font:600 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;background:#fdecec;color:var(--red);border-radius:var(--r-full);padding:3px 7px;margin-left:6px}
.rg{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center}
.rg svg{display:block;width:100%;height:96px}
.rg path{fill:none;stroke:var(--team);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rg .area{fill:var(--team-soft);stroke:none;opacity:.7}
.rg .g{stroke:var(--ghost);vector-effect:non-scaling-stroke}
.rg .pt{fill:var(--team-deep)}
.rg .ax{font:500 10px var(--mono);fill:var(--ink-3)}
.rg .read{font-size:12px;color:var(--ink-2);line-height:1.6}
.rg .read b{font-family:var(--mono);color:var(--ink);font-weight:600}
.drift{font-size:12px;color:var(--note);margin:6px 0 0}
.team-sub{font-size:13px;color:var(--ink-2);margin:0 0 10px}

/* thread dialog */
dialog#thread{border:1px solid var(--ghost);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink)}
dialog#thread::backdrop{background:rgba(14,29,43,.35)}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ghost);position:sticky;top:0;background:var(--card);z-index:1}
.th-head h3{margin:0;font:700 16px/1.2 var(--display)}
.th-head .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.th-body{padding:10px 18px 18px;overflow:auto}
.msg{padding:12px 14px;margin:10px 0;border-radius:var(--r-md);border:1px solid var(--ghost-2);background:var(--surface)}
.msg.in{background:var(--team-tint);border-color:var(--team-soft)}
.msg .m{display:flex;gap:10px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.msg.in .m{color:var(--team-deep)}
.msg .subj{font-weight:600;margin-bottom:4px}
.msg pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* footer + tooltip */
footer{margin-top:64px;border-top:1px solid var(--ghost);padding-top:14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:18px;flex-wrap:wrap}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--navy);color:#fff;padding:8px 10px;font-size:12px;line-height:1.4;border-radius:var(--r-sm);display:none;max-width:240px}
.tip b{display:block;font-weight:600}

@media (max-width:1100px){
  .calls{grid-template-columns:1fr}
  .lead{grid-template-columns:26px 1fr}
  .lead .tags{grid-column:2;flex-direction:row;flex-wrap:wrap}
  .lead .lead-main,.lead .side,.lead .last{grid-column:2}
  .meta{text-align:left} .acts{justify-content:flex-start}
  .strip{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  :root{--gutter:16px}
  .tabs button{padding:10px 12px 12px;font-size:13px}
  .strip{grid-template-columns:1fr 1fr;gap:12px}
  .strip .v{font-size:22px}
  .score{grid-template-columns:1fr 1fr}
  .score-col .fig{font-size:30px}
  .score-foot{grid-template-columns:1fr}
  .call{grid-template-columns:1fr}
  .rg{grid-template-columns:1fr}
  .scroll{position:relative}
  .scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,transparent,var(--surface));pointer-events:none}
  .agate th:first-child,.agate td:first-child{position:sticky;left:0;background:var(--surface);padding-right:12px;max-width:170px;white-space:normal;line-height:1.3}
  .agate tr.graph td{position:static;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .lead.flash .lead-id{animation:none;background:var(--team-soft)}
  .btn{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

ontact about this, maybe you can point me to the right person?\nI noticed your focus on Greece and Italy, so I'd guess the UK & Ireland would go down just as well.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nWould you like to take a look?\nCheers,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": "out", "ts": "2026-10-20T19:04:35+02:00", "from": "bileskalne_k@tiernantravelhq.com", "subject": "Re: UK tour", "body": "Hello\nI realize the initial email might have gotten buried as you focus on growing Skyway Tours.\nI wanted to quickly circle back to the sample UK & Ireland itinerary.\nIf the UK & Ireland is a region your clients ever ask about, let me know if I can send that 1-page overview over?\nBest,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": "in", "ts": "2026-10-21T15:47:44+02:00", "from": "perry@skywaytours.com", "subject": "RE: UK tour", "body": "Hello Kristine,\nThank you for the email. Will you be able to quote on this below?\n3 pax (double and single).\nThis is a custom group tour. I realize we cannot do everything as listed, but if we offer something similar (they are open to modifications).\nIt would be for May 2027 (arrival 09 departure 19, 10 nights).\nFlights to Edinburgh\nFlights to Edinburgh with direct flights.\nD02 Edinburgh - Glasgow (2 nights)\nArrival in Edinburgh in the morning. Welcome by your French-speaking guide and transfer to Glasgow for a\npanoramic tour of the city. Accommodation in the late afternoon and welcome dinner . S\nD03 Glasgow – Falkirk Region – Glasgow\nVisit Stirling Castle , a major historical site of Scottish history. Continuation to the\nKelpies , impressive statues of steel horses 30 meters high. Then stop at the\nwheel of Falkirk , incredible rotary boat lift. PD\nD04 Glasgow – Loch Lomond National Park – Glencoe Valley – Fort William (2 nights)\nscenic route through the spectacular\nLoch Lomond National Park , which offers a unique landscape of lakes, forests and mountains and\ncrossing Glencoe, one of the most renowned valleys in the Highlands. Arrival in\nFort William , a seaside resort located on the shores of Loch Linnhe and at the foot of Britain’s highest mountain, Ben Nevis. PD/S\nD05 Fort William – Isle of Skye – Fort William\nDeparture to the mythical\nIsle of Skye , where you will cross the southern part, in the heart of landscapes often considered the most beautiful in Britain. We start with\nthe visit of the famous castle of Eilean Donan . Located on an island at the meeting point of three marine lochs, this castle is one of the most iconic of the Scottish Highlands.\nFerry crossing from Armadale to Mallaig for the return to Fort William. The road runs along the\nGlenfinnan viaduct , made famous thanks to the Harry Potter films. Photo stop with a short hike to enjoy the spectacular panorama. Maybe you will have the chance to see the “Hogwarts Express”. PD/S\nD06 Fort William – Fort Augustus - Loch Ness – Elgin (2 nights)\nDeparture to Elgin.\nEn route, stop at the village of Fort Augustus and free time for the discovery of the Caledonian canal. Mini cruise\non the mythical Loch Ness Lake and visit the ruins of Urquhart Castle . Continue to\nElgin and hotel installation. PD/S\nD07 Elgin – Culloden – Fort George – Elgin\nDiscover the c camp de battle de Culloden , a decisive place in Scottish history. Then visit the\ncitadel of Fort George , still in military activity. Continue to Elgin and visit the ruins of Elgin Cathedral (1270) and stop at Johnstons of Elgin, renowned for his work of cashmere. PD/S\nD08 Elgin – Kincraig – Pitlochry (2 nights)\nDeparture to Kincraig to visit a sheep farm and observe the work of shepherd dogs . Continue to\nBlair Castle , rich in furniture and weapons collections. Then drive to\nPitlochry , charming village in the Tummel valley and hotel installation. PD/S\nD09 Pitlochry – Scone Palace – Pitlochry\nVisit the Scone Palace, a symbolic place of the Scottish royal coronations. Discovery of its refined interiors. Then,\nvisit a whisky distillery where you will appreciate the techniques of elaboration and the whisky\ntasting . PD/S\nD10 Pitlochry – Saint Andrews – villages of East Neuk – Edinburgh (2 nights)\nRoad to Saint Andrews , historic university town and cradle of golf.\nVisit the ruins of its castle and medieval cathedral. Continuation along the coast of Fife,\nto discover the fishing villages of the East Neuk . Passage through the\nsuspension bridge of Forth Bridge . Arrival in Edinburgh and hotel installation. PD\nD11 Edinburgh\nGuided walking tour of the fascinating Scottish capital. Passage through the winding streets of the medieval Old Town district, a UNESCO World\nHeritage Site, where St. Gilles Cathedral, Holyrood Palace and Royal Mile Street are located. Visit the\nEdinburgh Castle , an imposing building located on one of the volcanic hills of the city. It houses the royal apartments of the Stuarts and the crown jewels"}, {"dir": "out", "ts": "2026-10-21T16:08:44+02:00", "from": "bileskalne_k@tiernantravelhq.com", "subject": "RE: UK tour", "body": "Hi Perry,\nWhat a route - Skye, Glencoe, Loch Ness, Edinburgh, all the right names for a Scotland group, and yes, we can definitely help with something along these lines for your 3 pax in May 2027.\nInstead of going back and forth on email, it might be easier to hop on a quick call - I can go over the itinerary with you, see where we'd adjust, and make sure we have every detail right before putting a proposal together.\nWhat do you think? Here is my calendar if you want to pick a time.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-21T16:46:05+02:00", "from": "perry@skywaytours.com", "subject": "RE: UK tour", "body": "Hi Kristine,\nAs you can see from our product list, the UK and Ireland are not part of our destinations. Aside from London, and the typi <script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const pct = (n, d, dp = 1) => d ? (100 * n / d).toFixed(dp) + '%' : '–';
const p1 = v => v == null ? '–' : Number(v).toFixed(1) + '%';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const d = iso => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
const longDate = iso => { const x = d(iso); return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const shortDate = iso => { const x = d(iso); return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()].slice(0, 3)}`; };
const localTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const teamName = g => g.name.replace(/ pilot$/i, '');
const lastWD = shortDate(D.last_workday);
const prevWD = shortDate(D.prev_workday || D.last_workday);
const ago = n => n == null ? '' : n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n}d ago`;
const lastIn = l => [...(l.thread || [])].reverse().find(m => m.dir === 'in');
const leadsOf = g => D.leads.filter(l => l.slug === g.slug);
const callsOf = g => D.calls.filter(c => c.slug === g.slug);

// ── operator marks: one localStorage key, survives the daily rebuild ──
const KEY = 'daily.v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
};
const S = Object.assign({ done: {}, lost: {}, feedback: {}, tab: null }, store.load());
const save = () => store.save(S);
// a done mark holds until the lead writes again
const isDone = l => { const t = S.done[l.email]; if (!t) return false; const li = lastIn(l); return !li || t >= li.ts.slice(0, 10); };
const isLost = l => !!S.lost[l.email];
const needsYou = l => !l.flags.includes('lost') && !isDone(l) && !isLost(l);
const marked = () => D.leads.filter(l => isDone(l) || isLost(l) || S.feedback[l.email]).length;
function digest() {
  const lines = [`DAILY FEEDBACK ${D.date} (built ${D.built_at})`];
  D.leads.forEach(l => {
    if (isDone(l)) lines.push(`done  ${l.email}`);
    if (isLost(l)) lines.push(`lost  ${l.email}`);
    if (S.feedback[l.email]) lines.push(`note  ${l.email} · ${S.feedback[l.email].replace(/\s*\n+\s*/g, ' / ')}`);
  });
  if (lines.length === 1) lines.push('(nothing marked)');
  return lines.join('\n');
}

// ── overall strip ────────────────────────────────────────
function strip() {
  const doms = new Map(); // the two StackLeaps groups share one fleet: dedupe by domain name
  D.groups.forEach(g => ((g.health || {}).domains || []).forEach(x => doms.set(x.domain, x)));
  const sent = [...doms.values()].reduce((a, x) => a + (x.sent || 0), 0), bounced = [...doms.values()].reduce((a, x) => a + (x.bounced || 0), 0);
  const b = sent ? 100 * bounced / sent : null;
  const pos = D.groups.reduce((a, g) => a + (g.alltime.positive || 0), 0), con = D.groups.reduce((a, g) => a + g.alltime.contacted, 0);
  const booked = D.groups.reduce((a, g) => a + g.month.booked, 0), taken = D.groups.reduce((a, g) => a + (g.month.completed || 0), 0);
  const calls = D.calls.filter(c => c.today).length, need = D.leads.filter(needsYou).length, hot = D.leads.filter(l => needsYou(l) && l.flags.includes('hot')).length;
  const tile = (l, v, s, cls = '') => `<div><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="strip">
    ${tile('Bounce · 14 days', b == null ? '–' : p1(b), `${fmt(bounced)} of ${fmt(sent)} sent · ${doms.size} domains`, b == null ? '' : b > 5 ? 'bad' : b > 2 ? 'warn' : 'ok')}
    ${tile('Positive replies', pct(pos, con), `${fmt(pos)} of ${fmt(con)} contacted · all-time`)}
    ${tile('Calls · this month', `${fmt(booked)}<small style="font-size:14px;color:var(--ink-2)"> booked</small>`, `${fmt(taken)} already taken`)}
    ${tile('Calls today', fmt(calls), calls ? [...new Set(D.calls.filter(c => c.today).map(c => c.contact))].join(', ') : 'none')}
    ${tile('Needs you', `<span data-need>${fmt(need)}</span>`, hot ? `<span data-hot>${hot}</span> hot` : 'across all campaigns', need ? '' : 'ok')}
  </div>`;
}

// ── scoreline ─────────────────────────────────────────────
function formGuide(g) {
  const s = (g.series || []).slice(-14);
  if (!s.length) return '<p class="empty">No daily series.</p>';
  const W = 600, H = 84, top = 16, base = 68, gap = 6, bw = (W - gap * (s.length - 1)) / s.length;
  const max = Math.max(1, ...s.map(x => x.sent));
  let out = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Emails sent per day, last 14 days">`;
  s.forEach((x, i) => {
    const h = x.sent ? Math.max(2, (base - top) * x.sent / max) : 0;
    const xx = i * (bw + gap);
    const cls = x.date === D.last_workday ? 'bar last' : (x.sent ? 'bar' : 'bar off');
    const dow = d(x.date).getDay();
    out += x.sent
      ? `<rect class="${cls}" rx="2" x="${xx.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" data-tip="<b>${shortDate(x.date)}</b>sent ${fmt(x.sent)}<br>replies ${fmt(x.replies)}<br>new leads ${fmt(x.contacted)}"/>`
      : `<rect class="${cls}" x="${xx.toFixed(1)}" y="${base - 2}" width="${bw.toFixed(1)}" height="2" data-tip="<b>${shortDate(x.date)}</b>no sends"/>`;
    if (x.date === D.last_workday) out += `<text class="vlab" x="${(xx + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}">${fmt(x.sent)}</text>`;
    out += `<text class="daylab" x="${(xx + bw / 2).toFixed(1)}" y="${H - 4}">${'SMTWTFS'[dow]}</text>`;
  });
  out += `<line class="axis" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"/></svg>`;
  return out;
}
function scoreline(g) {
  const L = g.last, M = g.month, A = g.alltime, C = g.capacity;
  const delta = L.sent - L.prev_sent;
  const used = C.daily_limit ? L.sent / C.daily_limit : 0;
  const deltaLine = !L.prev_sent ? `no sends on ${prevWD}` : delta ? `<span class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${fmt(delta)}</span> vs ${prevWD}` : `same as ${prevWD}`;
  const cols = [
    ['Sent · ' + lastWD, fmt(L.sent), `${deltaLine}<br><b>${fmt(M.sent)}</b> this month · <b>${fmt(A.sent)}</b> all-time`],
    ['Positive replies', pct(A.positive, A.contacted), `<b>${fmt(A.positive)}</b> of ${fmt(A.contacted)} contacted, all-time<br><b>${fmt(L.replies)}</b> repl${L.replies === 1 ? 'y' : 'ies'} on ${lastWD}`],
    ['New replies · ' + lastWD, `${fmt(L.new_replies)}<small> · ${fmt(L.new_positive)} positive</small>`, `first reply ever from these leads<br><b>${fmt(M.new_replies)}</b> this month`],
    ['Calls', `${fmt(M.booked)}<small> booked</small>`, `this month · <b>${fmt(M.completed)}</b> already taken<br><b>${fmt(A.booked)}</b> upcoming (Meeting Booked)`],
  ];
  return `<div class="scoreline">
    <div class="score-head"><h2>${esc(teamName(g))}</h2><span>${esc(g.client)} · ${g.subs.length} sub-campaign${g.subs.length > 1 ? 's' : ''} · last work day ${lastWD}</span></div>
    <div class="score">${cols.map(([l, v, dd]) => `<div class="score-col"><div class="lab">${l}</div><div class="fig">${v}</div><div class="delta">${dd}</div></div>`).join('')}</div>
    <div class="form"><div class="form-lab"><span>Sent per day · 14 days</span><span>bounced ${fmt(L.bounced)} on ${lastWD} (${pct(L.bounced, L.sent)}) · ${fmt(M.bounced)} this month (${pct(M.bounced, M.sent)})</span></div>${formGuide(g)}</div>
    <div class="score-foot">
      <div><span>Capacity · <b>${fmt(L.sent)}</b> of <b>${fmt(C.daily_limit)}</b>/day on ${lastWD} (${C.active} active inboxes${C.errors ? `, <span class="bad">${C.errors} in error</span>` : ''})</span><div class="meter"><i class="${used > 1 ? 'over' : ''}" style="width:${Math.min(100, used * 100).toFixed(1)}%"></i></div></div>

  if (dr) { const next = dr.nextElementSibling; if (next && next.classList.contains('graph')) { next.remove(); return; } const sec = dr.closest('[data-group-inbox]'), g = D.groups.find(x => x.slug === sec.dataset.groupInbox); const tr = document.createElement('tr'); tr.className = 'graph'; tr.innerHTML = `<td colspan="9">${replyGraph(g.health.domains[+dr.dataset.dom])}</td>`; dr.after(tr); return; }
  const last = e.target.closest('.last');
  if (last) { last.closest('.lead').classList.toggle('open'); return; }
  const row = e.target.closest('.lead');
  if (row && !e.target.closest('a, input, textarea, button')) focusRow(row);
});
document.addEventListener('change', e => {
  const cb = e.target.closest('.done');
  if (!cb) return;
  const row = cb.closest('.lead'), l = leadOf(row);
  if (cb.checked) S.done[l.email] = D.date; else delete S.done[l.email];
  save(); row.classList.toggle('is-done', cb.checked); refreshCounts();
});
document.addEventListener('input', e => {
  const ta = e.target.closest('.fb');
  if (!ta) return;
  const l = leadOf(ta.closest('.lead')), v = ta.value.trim();
  if (v) S.feedback[l.email] = v; else delete S.feedback[l.email];
  save(); refreshCounts();
});
const rows = () => [...document.querySelectorAll('.panel:not([hidden]) .lead')];
function focusRow(row) { rows().forEach(r => r.classList.remove('focus')); row.classList.add('focus'); cur = rows().indexOf(row); row.scrollIntoView({ block: 'nearest' }); }
document.addEventListener('keydown', e => {
  if (e.target.matches('input:not([type=checkbox]), textarea') || e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  const rs = rows(); if (!rs.length) return;
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); cur = Math.min(rs.length - 1, Math.max(0, cur + (e.key === 'j' ? 1 : -1))); focusRow(rs[cur]); }
  else if (cur < 0) return;
  else if (e.key === 'c') { copyText(rs[cur].dataset.email, rs[cur].querySelector('.copy'), rs[cur]); }
  else if (e.key === 'o') { if (rs[cur].dataset.url) window.open(rs[cur].dataset.url, '_blank', 'noopener'); }
  else if (e.key === 't') { const l = leadOf(rs[cur]); if ((l.thread || []).length) openThread(l); }
  else if (e.key === 'x') { const cb = rs[cur].querySelector('.done'); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); }
  else if (e.key === 'Enter') { rs[cur].classList.toggle('open'); }
});
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + 'px';
});
})();
</script>

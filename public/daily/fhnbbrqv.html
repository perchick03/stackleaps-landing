<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>StackLeaps Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#f8f9ff; --card:#fff; --sunk:#eef2fa;
  --ink:#0e1d2b; --ink-2:#43474d; --ink-3:#73777e;
  --outline:#c3c7ce; --ghost:rgba(195,199,206,.4); --ghost-2:rgba(195,199,206,.2);
  --navy:#16314a; --navy-2:#2e4862;
  --apricot:#ff8e3b; --apricot-deep:#984800; --apricot-soft:#ffdbc8;
  --ok:#137a2b; --note:#b45309; --red:#b91c1c;
  --shadow:0 20px 40px rgba(14,29,43,.06);
  --r-sm:6px; --r-md:8px; --r-lg:16px; --r-full:999px;
  --display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter:32px;
  color-scheme:light;
}
/* team scopes: one class on the tab + its panel sets every tint below */
.t-orange{--team:#ff8e3b;--team-deep:#984800;--team-soft:#ffdbc8;--team-tint:#fff6ef}
.t-blue{--team:#2e5c9e;--team-deep:#16314a;--team-soft:#dbe9fd;--team-tint:#eff4fc}
.t-purple{--team:#6b4fbb;--team-deep:#4a3390;--team-soft:#e9e3fa;--team-tint:#f5f2fc}
.t-navy{--team:#16314a;--team-deep:#0e1d2b;--team-soft:#e4efff;--team-tint:#f1f5fc}

*{box-sizing:border-box}
html{background:var(--surface)}
body{margin:0;background:var(--surface);color:var(--ink);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--apricot-soft);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--apricot-deep);outline-offset:2px;border-radius:var(--r-sm)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
*{scrollbar-color:var(--outline) transparent;scrollbar-width:thin}
main{max-width:1440px;margin:0 auto;padding:0 var(--gutter) 96px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.fig,.agate td,.score .n,.strip .v,.call .t,.meter-lab b{font-family:var(--mono)}
.dim{color:var(--ink-3)} .bad{color:var(--red);font-weight:600} .warn{color:var(--note);font-weight:600}
.empty{padding:24px 0;color:var(--ink-2);border-top:1px solid var(--ghost)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 10px;font:600 12px/1 var(--ui);color:var(--ink-2);background:var(--card);white-space:nowrap;transition:background .12s,color .12s}
.btn:hover{background:var(--sunk);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--apricot);border-color:var(--apricot);color:var(--navy)}
.btn.primary:hover{background:#ffa05a}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .n{font-family:var(--mono);background:var(--navy);color:#fff;border-radius:var(--r-full);padding:2px 7px;font-size:11px}
.btn.primary .n{background:var(--navy)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.icon{padding:6px;border-radius:var(--r-sm)}

/* masthead + strip */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:26px 0 18px}
.mast h1{margin:0;font:800 30px/1 var(--display);color:var(--navy)}
.mast .dateline{font-size:13px;color:var(--ink-2);margin-top:6px}
.mast .dateline b{color:var(--ink);font-weight:600}
.mast .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mast .tools small{font-size:12px;color:var(--ink-3)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:16px 0 20px;border-top:1px solid var(--ghost)}
.strip > div{padding:0 0 0 14px;border-left:2px solid var(--ghost)}
.strip .l{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.strip .v{font:600 26px/1 var(--mono);color:var(--ink)}
.strip .v.bad{color:var(--red)} .strip .v.warn{color:var(--note)} .strip .v.ok{color:var(--ok)}
.strip .s{font-size:12px;color:var(--ink-2);margin-top:6px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:var(--surface);padding:8px 0 0;margin:0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter);overflow-x:auto;border-bottom:1px solid var(--ghost)}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px 12px;font:700 14px/1 var(--display);color:var(--ink-2);border-radius:var(--r-md) var(--r-md) 0 0;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{background:var(--team-tint);color:var(--team-deep)}
.tabs button[aria-selected="true"]{background:var(--team-soft);color:var(--team-deep);border-bottom-color:var(--team)}
.tabs .n{font:600 11px/1 var(--mono);background:var(--card);color:var(--ink-2);border:1px solid var(--ghost);border-radius:var(--r-full);padding:3px 7px;min-width:22px;text-align:center}
.tabs button[aria-selected="true"] .n{background:var(--team-deep);color:#fff;border-color:var(--team-deep)}
.tabs .n.zero{opacity:.6}
.tabs .n.hot{background:var(--red);color:#fff;border-color:var(--red)}

/* panels + sections */
.panel{padding-top:8px}
.panel[hidden]{display:none}
section{padding-top:36px}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;font:700 20px/1.1 var(--display);color:var(--team-deep)}
.sec .count{font:600 12px/1 var(--mono);background:var(--team-deep);color:#fff;border-radius:var(--r-full);padding:4px 8px;position:relative;top:-2px}
.sec .sub{font:400 13px/1.4 var(--ui);color:var(--ink-2)}
.hint{margin:-4px 0 12px;font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px/1 var(--mono);border:1px solid var(--ghost);border-bottom-width:2px;border-radius:4px;padding:2px 5px;margin:0 2px;background:var(--card)}
.chip{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-full);background:var(--team-soft);color:var(--team-deep);white-space:nowrap}

/* scoreline */
.scoreline{border-top:1px solid var(--ghost);padding-top:14px}
.score-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.score-head h2{margin:0;font:800 24px/1 var(--display);color:var(--team-deep)}
.score-head span{font-size:12px;color:var(--ink-2)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.score-col{padding:0 0 0 14px;border-left:2px solid var(--team-soft)}
.score-col .lab{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.score-col .fig{font:600 40px/1 var(--mono);color:var(--ink);letter-spacing:-.02em}
.score-col .fig small{font-size:16px;color:var(--ink-2);font-weight:500}
.score-col .delta{margin-top:8px;font-size:12px;color:var(--ink-2);line-height:1.5}
.score-col .delta b{font-weight:600;color:var(--ink)}
.score-col .delta .up{color:var(--ok)} .score-col .delta .down{color:var(--note)}
.form{margin-top:18px}
.form .form-lab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.form svg{display:block;width:100%;height:84px;overflow:visible}
.form .bar{fill:var(--team-soft)} .form .bar.last{fill:var(--team)} .form .bar.off{fill:var(--ghost-2)}
.form .daylab{font:500 10px var(--ui);fill:var(--ink-3);text-anchor:middle}
.form .vlab{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.form .axis{stroke:var(--ghost);stroke-width:1}
.score-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--ghost);display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;font-size:13px;color:var(--ink-2)}
.score-foot b{color:var(--ink);font-weight:600}
.score-foot .funnel{grid-column:1 / -1;display:flex;gap:6px 18px;flex-wrap:wrap}
.meter{margin-top:6px;height:6px;border-radius:var(--r-full);background:var(--team-soft);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--team);border-radius:var(--r-full)}
.meter i.over{background:var(--red)}

/* leads queue */
.queue{border-top:1px solid var(--ghost)}
.group-lab{font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:16px 0 6px;border-bottom:1px solid var(--ghost)}
.lead{display:grid;grid-template-columns:26px 118px 1fr 230px;gap:8px 18px;padding:14px 0;border-bottom:1px solid var(--ghost);position:relative;align-items:start}
.lead.focus{outline:2px solid var(--team);outline-offset:-2px;border-radius:var(--r-md);padding-left:10px;padding-right:10px;background:var(--card)}
.lead.flash .lead-id{animation:flash .6s ease-out}
@keyframes flash{0%{background:var(--team-soft)}100%{background:transparent}}
.lead.is-done{opacity:.5}
.lead.is-done .sum,.lead.is-done .last,.lead.is-done .rem{display:none}
.lead.is-lost .who,.lead.is-lost .sum{color:var(--ink-3);text-decoration:line-through}
.done-wrap{display:flex;align-items:center;justify-content:center;padding-top:4px}
.done{width:18px;height:18px;margin:0;accent-color:var(--team-deep);cursor:pointer}
.tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tag{font:600 11px/1 var(--ui);padding:5px 8px;border-radius:var(--r-full);background:var(--card);border:1px solid var(--ghost);color:var(--ink-2);white-space:nowrap}
.tag--hot{background:#fdecec;border-color:#f6c9c9;color:var(--red)}
.tag--booked{background:var(--team-soft);border-color:transparent;color:var(--team-deep)}
.tag--rem{background:#fff4d6;border-color:#f5dfa0;color:#7a5200}
.tag--link{border-style:dashed}
.tag--lost,.tag--unread{color:var(--ink-3)}
.tag--fwd{background:var(--navy);border-color:var(--navy);color:#fff;cursor:pointer}
.tag--fwd.done{background:var(--ok);border-color:var(--ok)}
.lead-id{display:flex;align-items:center;gap:8px;min-width:0;margin:-4px -6px 2px;padding:4px 6px;border-radius:var(--r-sm)}
.email{font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--ghost);color:var(--navy)}
.email:hover{border-bottom-color:var(--navy)}
.ibtn{display:inline-flex;flex:0 0 auto;color:var(--navy);opacity:.75}
.ibtn:hover{opacity:1}
.ibtn svg{width:16px;height:16px}
.who{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who .co{font-weight:400;color:var(--ink-2)}
.status{font-size:12px;color:var(--ink-3);font-weight:400}
.sum{margin:4px 0 0;color:var(--ink);text-wrap:pretty}
.sum:empty{display:none}
.rem{margin:6px 0 0;padding:6px 10px;border-radius:var(--r-sm);background:#fff8e6;font-size:13px;color:#5a3d00}
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.meta{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.fb{width:100%;min-height:30px;resize:vertical;border:1px solid var(--ghost);border-radius:var(--r-md);padding:6px 9px;font:400 12px/1.4 var(--ui);color:var(--ink);background:var(--card)}
.fb::placeholder{color:var(--ink-3)}
.fb:focus{border-color:var(--team);outline:none}
.last{grid-column:3 / -1;margin:2px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--ghost-2);border-radius:var(--r-md);font-size:13px;color:var(--ink-2);max-height:8.5em;overflow:hidden;position:relative;cursor:pointer}
.last .subj{font-weight:600;color:var(--ink);margin-bottom:4px}
.last pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.last::after{content:"";position:absolute;inset:auto 0 0 0;height:26px;background:linear-gradient(transparent,var(--card))}
.lead.open .last{max-height:none}
.lead.open .last::after{display:none}
.lost-list{margin:0;padding:10px 0 0;list-style:none;font-size:13px;color:var(--ink-2)}
.lost-list li{display:flex;gap:16px;padding:6px 0;border-bottom:1px solid var(--ghost-2)}
details.lost summary{cursor:pointer;padding:12px 0;font:700 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* calls */
.calls{display:grid;grid-template-columns:1fr 440px;gap:28px;align-items:start}
.call{display:grid;grid-template-columns:140px 1fr;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--ghost)}
.call:first-child{border-top:1px solid var(--ghost)}
.call .t{font:600 26px/1 var(--mono);color:var(--ink)}
.call .t small{display:block;font:500 12px/1.3 var(--ui);color:var(--ink-2);margin-top:4px}
.call .d{font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.call.today .d{color:var(--ok)}
.call .who{font-size:15px}
.call .note{color:var(--ink-2);margin:2px 0 0}
.call .files{font-size:12px;color:var(--ink-3);margin-top:4px}
.copy-email{cursor:pointer;border-bottom:1px dashed var(--outline)}
.remind{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--team-tint);border:1px solid var(--team-soft)}
.remind header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.remind header b{color:var(--team-deep);font-weight:600}
.remind pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.wa{border:1px solid var(--ghost);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow)}
.wa header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ghost);font:700 13px/1 var(--display);color:var(--team-deep)}
.wa pre{margin:0;padding:16px;font:400 14px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* tables */
.scroll{overflow-x:auto;margin-bottom:8px}
table.agate{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--ghost)}
.agate th{font:600 11px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:9px 10px;border-bottom:1px solid var(--ghost);white-space:nowrap}
.agate th:first-child,.agate td:first-child{text-align:left;padding-left:0}
.agate td{padding:8px 10px;border-bottom:1px solid var(--ghost-2);text-align:right;white-space:nowrap;font-size:12.5px}
.agate tr.total td{border-top:1px solid var(--outline);font-weight:600}
.agate td.l{text-align:left;font-family:var(--ui)}
.agate td small{font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.agate tr.clickable{cursor:pointer}
.agate tr.clickable:hover td{background:var(--sunk)}
.agate tr.graph td{padding:12px 0 16px;white-space:normal;text-align:left;background:var(--card)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.verdict i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.verdict.ok i{background:var(--ok)} .verdict.note i{background:var(--note)} .verdict.red i{background:var(--red)}
.verdict.ok{color:var(--ok)} .verdict.note{color:var(--note)} .verdict.red{color:var(--red)}
.verdict small{font:500 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.drop{font:600 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;background:#fdecec;color:var(--red);border-radius:var(--r-full);padding:3px 7px;margin-left:6px}
.rg{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center}
.rg svg{display:block;width:100%;height:96px}
.rg path{fill:none;stroke:var(--team);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rg .area{fill:var(--team-soft);stroke:none;opacity:.7}
.rg .g{stroke:var(--ghost);vector-effect:non-scaling-stroke}
.rg .pt{fill:var(--team-deep)}
.rg .ax{font:500 10px var(--mono);fill:var(--ink-3)}
.rg .read{font-size:12px;color:var(--ink-2);line-height:1.6}
.rg .read b{font-family:var(--mono);color:var(--ink);font-weight:600}
.drift{font-size:12px;color:var(--note);margin:6px 0 0}
.team-sub{font-size:13px;color:var(--ink-2);margin:0 0 10px}

/* thread dialog */
dialog#thread{border:1px solid var(--ghost);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink)}
dialog#thread::backdrop{background:rgba(14,29,43,.35)}
.th-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ghost);position:sticky;top:0;background:var(--card);z-index:1}
.th-head h3{margin:0;font:700 16px/1.2 var(--display)}
.th-head .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.th-body{padding:10px 18px 18px;overflow:auto}
.msg{padding:12px 14px;margin:10px 0;border-radius:var(--r-md);border:1px solid var(--ghost-2);background:var(--surface)}
.msg.in{background:var(--team-tint);border-color:var(--team-soft)}
.msg .m{display:flex;gap:10px;flex-wrap:wrap;font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.msg.in .m{color:var(--team-deep)}
.msg .subj{font-weight:600;margin-bottom:4px}
.msg pre{margin:0;font:400 13px/1.5 var(--ui);white-space:pre-wrap;word-break:break-word}

/* footer + tooltip */
footer{margin-top:64px;border-top:1px solid var(--ghost);padding-top:14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer ul{list-style:none;margin:0;padding:0;display:flex;gap:18px;flex-wrap:wrap}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--navy);color:#fff;padding:8px 10px;font-size:12px;line-height:1.4;border-radius:var(--r-sm);display:none;max-width:240px}
.tip b{display:block;font-weight:600}

@media (max-width:1100px){
  .calls{grid-template-columns:1fr}
  .lead{grid-template-columns:26px 1fr}
  .lead .tags{grid-column:2;flex-direction:row;flex-wrap:wrap}
  .lead .lead-main,.lead .side,.lead .last{grid-column:2}
  .meta{text-align:left} .acts{justify-content:flex-start}
  .strip{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  :root{--gutter:16px}
  .tabs button{padding:10px 12px 12px;font-size:13px}
  .strip{grid-template-columns:1fr 1fr;gap:12px}
  .strip .v{font-size:22px}
  .score{grid-template-columns:1fr 1fr}
  .score-col .fig{font-size:30px}
  .score-foot{grid-template-columns:1fr}
  .call{grid-template-columns:1fr}
  .rg{grid-template-columns:1fr}
  .scroll{position:relative}
  .scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,transparent,var(--surface));pointer-events:none}
  .agate th:first-child,.agate td:first-child{position:sticky;left:0;background:var(--surface);padding-right:12px;max-width:170px;white-space:normal;line-height:1.3}
  .agate tr.graph td{position:static;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .lead.flash .lead-id{animation:none;background:var(--team-soft)}
  .btn{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

on Monday\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-08-03T19:04:54+03:00", "from": "rfitzsimons@ses-events.com", "subject": "Re: Riley - thoughts?", "body": "Hi Kristine,\nCan you give me starting at prices for Double Occupancy?\nRiley Fitzsimons\n411 Prairie Heights Dr, Verona, WI 53593 T: | M: [608-482-3304](tel:608-482-3304)\n  SuperiorExecutiveServices.com"}, {"dir": "out", "ts": "2026-08-03T19:28:24+03:00", "from": "kristine.bileskalne@tiernantraveltours.com", "subject": "Re: Riley - thoughts?", "body": "Hi Riley,\nOn double occupancy, let me confirm the exact room basis with the team and I will come back to you on it today.\nIn the meantime, here are the three, with pricing and what's included on each.\nThe Golfing Trail, Scotland's Best Greens\nfrom 6,195 GBP based on 12 pax\nWhat's Included\nLuxury accommodation throughout your journey (5 star)\nDaily Scottish breakfast\nSpecialist private driver/guide throughout\nPrivate airport arrival and departure transfers\nExecutive transportation throughout Scotland\nGreen fees at four of Scotland's finest golf courses\nAdmission to the Scotch Whisky Experience with dinner\nGuided tour and tasting at Lindores Abbey Distillery (exclusive)\nAll sightseeing and admissions as outlined in the itinerary\nDigital travel documents with a personalised day-by-day itinerary\n24/7 on-the-ground support from the Tiernan Travel team\nPre-arranged tee times at all golf courses\nFairways of the Emerald Isle, Ireland\nfrom 5,206 EUR based on 12 pax\nWhat's Included\nLuxury accommodation throughout your journey\nDaily Irish breakfast\nSpecialist private driver/guide throughout\nPrivate airport arrival and departure transfers\nExecutive transportation throughout Ireland\nPre-arranged tee times and green fees at Ireland's premier golf courses\nAll sightseeing and admissions as outlined in the itinerary\nDigital travel documents with a personalised day-by-day itinerary\n24/7 on-the-ground support from the Tiernan Tr t out when you send the quote over.\nLooking forward to hearing from you.\nChat soon,\nCatherine\nCatherine Fisher | Travel Advisor\nwww.kairostours.com\ncatherine@kairostours.com\nMobile : +1.805.888.7787\nOffice : +1.512.596.1642\n3210 Riva Ridge Rd.\nAustin, Texas 78746"}, {"dir": "out", "ts": "2026-10-19T22:08:40+03:00", "from": "kristine-bileskalne@tiernantream.com", "subject": "Fwd: Re: Re: Tiernan Travel x Kairos Tours | Scotland", "body": "---------- Forwarded message ---------"}]}, {"email": "journeysbyjulieann@gmail.com", "name": "Julieann", "company": "Journeys By Julieann", "slug": "tiernan-decom", "status": "Meeting Completed", "group": "Meeting Completed", "flags": ["reply"], "days_quiet": 9, "meta": "10 inbound / 9 out · they wrote 9d ago", "summary": "Their message is the last one and is unanswered.", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:77-KGmzviClgvYDwjpB8I3sz_y&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-10-07T19:01:02+03:00", "from": "bileskalne.kr@tiernantravelhq.com", "subject": "Julieann - thoughts?", "body": "Hi Julieann\nGroup tours and retreats seem to be your thing, and I'm curious whether your clients ever ask about the UK & Ireland.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nWould you like to take a look?\nCheers,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": "in", "ts": "2026-10-07T19:03:43+03:00", "from": "journeysbyjulieann@gmail.com", "subject": "Re: Julieann - thoughts?", "body": "Hi Kristine,\nI would love to take a look! Please send it over. I have some niche ideas for Ireland and the UK.\nThanks,\nJulieann\nJulieann Giannone\nOwner & Travel Advisor | Journeys by Julieann LLC\nItaly • River Cruises • Equestrian Travel • Luxury Experiences\nCreating meaningful travel experiences, one journey at a time. ✨"}, {"dir": "out", "ts": "2026-10-07T19:07:49+03:00", "from": "bileskalne.kr@tiernantravelhq.com", "subject": "Re: Julieann - thoughts?", "body": "Hi Julieann,\nGood to hear from you - glad you'd like a look.\nHere is our Scotland sample - it should give you a feel for what it's all about:\nScotland sample\nWe can tailor something like this to your clients and run it on the ground, under your name.\nIf the style feels like a fit we can try and customize something for you - just need a few details for a proposal that you can see how it looks and show your clients.\nKind regards,\nKristine | Founder of Tiernan Travel (DMC)\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-08T04:58:07+03:00", "from": "journeysbyjulieann@gmail.com", "subject": "Re: Julieann - thoughts?", "body": "Hi Kristine,\nThank you again for sending the Scotland sample. I really liked the style of it — it feels thoughtful, personal, and experience-driven, which is very much the direction I am building with my clients.\nThe timing may actually be good, because my own family is interested in Ireland , and I am also exploring future small-group concepts where Scotland, Ireland, or a combination could be a strong fit.\nBefore sending anything specific, I’d love to better understand how you work with advisors.\nCould you please share:\nWhether your pricing is net or commissionable\nWhether proposals and travel documents can be fully white-labeled under Journeys by Julieann\nTypical deposit, payment, and cancellation terms\nHow you handle in-destination support or emergencies\nTypical turnaround time for a custom quote\nRecommended minimum group size for private/custom itineraries\nApproximate price range for moderate-upscale Ireland or Scotland itineraries\nWhether you can build for families as well as small groups/retreat-style travel\nI also have a growing interest in equestrian and countryside travel, so I would be curious whether you ever incorporate horseback riding, estate rides, countryside stables, horse country, or equestrian-themed experiences into UK/Ireland/Scotland itineraries. It would not need to be part of every trip, but it is a niche I am developing and could be a natural fit for future small groups.\nI especially liked the Scotland sample and could see something like that working beautifully for my audience in the future. For the immediate inquiry, I may have my family’s Ireland trip to discuss once I confirm a few details.\nThank you,\nJulieann"}, {"dir": "out", "ts": "2026-10-08T15:55:27+03:00", "from": "bileskalne.kr@tiernantravelhq.com", "subject": "Re: Julieann - thoughts?", "body": "Hi Julieann,\nGlad the Scotland sample landed well - and lovely that your own family has Ireland in mind.\nA few quick answers:\nWe work on net pricing by default, with commissionable rates available on request, usually 10-15%.\nYes, everything is fully white-labeled under Journeys by Julieann - proposals and documents carry your brand.\nYour clients have a UK contact for the length of their trip, and any supplier or guide issues are handled by us directly.\nOn equestrian travel - that's a great niche, and it's absolutely something we can build around. We don't have a dedicated published sample for it yet, but it's exactly the kind of custom brief we work from.\nThe rest - deposit and cancellation terms, turnaround, pricing specifics for your family's Ireland trip - is easier to go over on a call than back and forth by email.\nWould a quick call work for you? Here's my calendar if you want to grab a time: book a call\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-09T03:23:23+03:00", "from": "journeysbyjulieann@gmail.com", "subject": "Re: Julieann - thoughts?", "body": "Thank you — this is very helpful.\nI’m glad to hear you can work on net pricing, white-label under Journeys by Julieann, and provide in-destination support. That is exactly the kind of structure I would need for both client trips and future small-group concepts.\nI’m also happy to hear  Advisor | Journeys by Julieann LLC\nItaly • River Cruises • Equestrian Travel • Luxury Experiences\nCreating meaningful travel experiences, one journey at a time. ✨"}, {"dir": "out", "ts": "2026-10-09T17:39:01+03:00", "from": "bileskalne.kr@tiernantravelhq.com", "subject": "Re: Julieann - thoughts?", "body": "Hi Julieann,\nThat clears it up, thanks - and good to know we'll be in the same time zone for a bit.\nI created the booking invite link for you: https://calendly.com/d/dtvd-pjy-8cz/tiernan-travel-x-journeys-by-julieann\nOffering the Scotland trip for next year sounds like a smart read on the market, and it's something we can absolutely plan around on the call too.\nLooking forward to it!\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-13T03:17:27+03:00", "from": "notifications@calendly.com", "subject": "New Event: Julieann Giannone - 14:00 Fri, 23 Oct 2026 - ‌ Tiernan Travel × Journeys by Julieann", "body": "Calendly\nHi Kristine Bileskalne,\nA new event has been scheduled.\nEvent Type:\n‌ Tiernan Travel × Journeys by Julieann\nInvitee:\nJulieann Giannone\nInvitee Email:\njourneysbyjulieann@gmail.com\nEvent Date/Time:\n14:00 - Friday, 23 October 2026 (UK, Ireland, Lisbon Time)\nDescription:\nA catch-up with Kristine, founder of Tiernan Travel, during Julieann's Dublin layover.\nWhat we'll cover:\nHow Tiernan works with advisors: net pricing, white-label proposals and documents under Journeys by Julieann, and in-destination support\nDeposit, payment and cancellation terms, and typical turnaround for a custom quote\nPricing range for Ireland and Scotland itineraries\nJulieann's family trip to Ireland\nOffering the Scottish trip for next year, plus the equestrian and small-group ideas\nLocation:\nThis is a Google Meet web conference.\nJoin now\nInvitee Time Zone:\nEastern Time - US & Canada\nQuestions:\nPlease share anything that will help prepare for our meeting.\nIt is 9:00 AM EST- I should be at the airport in Dub ents on an England, Ireland and Scotland trip for next summer. I would love to see what you could put together for Wendy Garner and her husband Robin and get a feel\nfor how we might work together.\nHere is the general framework we have established so far:\nJune 28 – Arrive London\nThey have previously visited London, so the primary reason for this stay is Wimbledon.\nJune 29 – Wimbledon\nJune 30–July 12 – Ireland & Northern Ireland\nFly to Dublin and travel through Ireland and Northern Ireland. Their wish list currently includes Dublin, Kinsale, Cork, Old Head (golf for Robin), Ring of Kerry, Dingle Peninsula, Ballybunion (golf for Robin) and the Cliffs of Moher.\nI’m attaching a preliminary Ireland itinerary I created based on my conversations with Wendy and Robin, but I would really appreciate your expertise regarding the best routing, number of nights in each location and anything you would\nrecommend adding, removing or adjusting. I don’t want to force the itinerary around my initial routing if you see a better way to structure it.\nJuly 12–17 – Scotland\nThey have tickets to the British Open on the 14th & 15th and will be golfing with friends (personally arranged) on the 16th. They would like to base themselves in Edinburgh and take the train to The Open. They understand they will need to take an Open offered\nshuttle from the train station to the course. In addition to their Edinburgh hotel, they will need airport transfers and train arrangements for the 14th and 15th. They would also like a privately guided Edinburgh experience and a visit to Edinburgh Castle\non the 13th.\nFor accommodations, they prefer 4-star properties , centrally located when possible, and would like to incorporate a castle stay while in Ireland. Their biggest priority is scenery. They are active and would enjoy\nsome easy hiking and outdoor experiences, but they don’t want the trip to become overly focused on castles or traditional sightseeing. For Robin’s golf experiences, he will need clubs.\nOverall, they prefer a nice balance of guided experiences and time to explore independently.\nGenerally I require a budget from the clients. However with the Wimbledon tickets and the peak pricing tied to the British Open, we are not quite sure what to expect for pricing. I can tell you that for the Ireland/N. Ireland portion\nof the budget is 16,000 euros (net) however, this is negotiable based on the experiences and activities (ie golf) which obviously could increase costs on what they would like included.\nI’d love to see how you would approach the itinerary and what you would recommend for them. Could you also share a little about your process, including how you quote (ie. net, with the clients paying gross -with my commission, and\nI send a commission invoice post travel.)\nThank you again, Kristine. I’m looking forward to seeing your ideas and hopefully this being the beginning of working together.\nWarm regards,\n** Next on my Bucket List: Paris, Belgium & London for the WTM Conference; October 26 - November 6 and Maui December 1 - 6\nNote our updated Terms and Conditions\nBucketList Travel Advisors is an Independent Agency authorized to operate under Nexion LLC.\nCST 2071045-50 | Fla. Seller of Travel Ref. No. ST38545 | WA UBI # 603 046 768\nThe  Terms and Conditions  (“Terms”) between [BUCKETLIST TRAVEL ADVISORS] (“Agency”) and you (including\nall Travelers on the same booking who share the same household) (“you,” “your,” “yourself” or “Traveler”) becomes effective upon your: (1) electronic or written signature; or (2) payment authorization until terminated in writing by you or Agency."}, {"dir": "out", "ts": "2026-09-25T18:50:56+03:00", "from": "bileskalne-kr@tiernantream.com", "subject": "Re: Sandee - thoughts?", "body": "Hi Sandee,\nThank you - and what a trip for Wendy and Robin. Wimbledon, then Ireland and Northern Ireland, then The Open from Edinburgh is exactly the kind of multi-country journey we build as one itinerary.\nOn process: we work on net pricing normally, but we can absolutely provide commissionable rates depending on what works best for you. Commission is built into the quote, everything goes out white-label under your brand.\nThank you for the draft itinerary too - it's a thoughtful starting point, with the golf days, both castle stays and plenty of scenery.\nI'd love to walk through the routing and nights with you on a quick call rather than guess by email, will this be possible to get you on a quick call early next week?\nIf this works for you, here is my calendar\nWarm regards,\nKristine\ntiernantravel.com\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-25T18:58:04+03:00", "from": "notifications@calendly.com", "subject": "New Event: Sandee Hughes - 18:00 Mon, 28 Sep 2026 - Introduction Call", "body": "Calendly\nHi Kristine Bileskalne,\nA new event has been scheduled.\nEvent Type:\nIntroduction Call\nInvitee:\nSandee Hughes\nInvitee Email:\nsandee@bucketlisttraveladvisors.com\nEvent Date/Time:\n18:00 - Monday, 28 September 2026 (UK, Ireland, Lisbon Time)\nLocation:\nThis is a Google Meet web conference.\nJoin now\nInvitee Time Zone:\nCentral Time - US & Canada\nQuestions:\nPlease share anything that will help prepare for our meeting.\nWhatsapp phone number = 1.843.737.1133. Thank you Kristine, I look forward to chatting with you next week.\nView event in Calendly\nPro Tip!\nDecrease no-shows with reminder workflows\nWith our workflows feature, you can create custom reminders and easily apply them to multiple event types.\nGet started.\nSent from Calendly\nReport this event"}, {"dir": "in", "ts": "2026-09-25T19:12:13+03:00", "from": "sandee@bucketlisttraveladvisors.com", "subject": "Re: Sandee - thoughts?", "body": "Hi Kristine,\nThank you for the follow-up. I have scheduled for Monday. I know it is the end of your day, with the time change and appointments I have already on my calendar, that is the best time. If you prefer an earlier time, I can move the appointment to Wednesday at 4 $1,500) with a driver.\nIf this sounds good, what do you think about a quick call as next step to get some of the details? If you want, I can tailor a proposal for you within 48 hours\nKind regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-04T03:56:46+03:00", "from": "brad@waypointwild.ca", "subject": "Re: Brad - thoughts?", "body": "Hi Kristine,\nThanks, that definitely helps put the pricing and structure into perspective.\nIt sounds like Tiernan would be a really good fit for the higher-end side of my business, especially clients looking for more private experiences, drivers, guides and a more hands-off trip.\nMost of the UK and Scotland requests I’ve handled so far have been a bit more independent and budget-conscious, but I can definitely see situations where this would be a great fit.\nI’d be happy to jump on a quick call and learn a bit more about how you work with advisors, particularly the net pricing and white-label process.\nI’ll have a look at your calendar and find a time that works.\nTalk soon,\nBrad Martens\nTravel Advisor | Waypoint Wild\n📍 Manitoba, Canada\n🌍 www.waypointwild.ca\n📸 Instagram: @waypoint.wild\nYour referral is the best thank you."}, {"dir": "out", "ts": "2026-10-05T15:51:36+03:00", "from": "k-bileskalne@tiernantravels.com", "subject": "Re: Brad - thoughts?", "body": "Hi Brad,\nGreat, glad it feels like a fit for the higher-end side. Happy to cover net pricing and the white-label process on the call.\nWaiting to hear when is a good time for you, here is the calenar link again if helps\nTalk soon\nKristine"}, {"dir": "out", "ts": "2026-10-13T17:06:47+03:00", "from": "k-bileskalne@tiernantravels.com", "subject": "Re: Brad - thoughts?", "body": "Hi Brad,\nJust checking in - no rush at all if timing hasn't worked out yet.\nIs this still a good week to find a slot, or would later suit you better?\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-13T18:30:22+03:00", "from": "not stjourneys.com/tours/2027/05/07/england-s-south-coast-birding-history-culture#itinerary\nWe need a quote that includes:\n- accommodations\n- meals (you'll see at the end of each day, we note (B,L,D)—breakfast, lunch, dinner)\n- train tickets from London to Norfolk for 10 clients + 1 host (the driver and guide will meet them in Norfolk)\nOur clients are fine to eat breakfasts at the hotels if they're good (an actual inn, not at a Premier Inn). They are fine if the occasional dinner is included at their inn, but they will definitely want to eat together in town on many other nights. And in terms of accommodation, while we love a property like The Churchill, I don't think we need something quite that high end. But our clients do prefer inns over just hotels (with the exception of arrival night in London and final night at Heathrow, of course).\nPlease feel free to ask questions as you work through this. Thanks very much.\nJulie Fannon\nCo-Owner, Chief Marketing Officer\nOffice: 866-900-1146\njulie@naturalistjourneys.com\nwww.naturalistjourneys.com\n\nBe like me, be carbon free—don't print this and save a tree!"}, {"dir": "out", "ts": "2026-10-20T11:04:29+03:00", "from": "kri_bileskalne@tiernantravelhq.com", "subject": "Fwd: Room count and itinerary link for NJ's Southeast England trip (ENGL PVT SMRA 27)", "body": "---------- Forwarded message ---------"}, {"dir": "in", "ts": "2026-10-21T21:17:59+03:00", "from": "julie@naturalistjourneys.com", "subject": "Re: Room count and itinerary link for NJ's Southeast England trip (ENGL PVT SMRA 27)", "body": "Hi Kristine,\nFollowing up. Please confirm that you received this information?\nThanks, Julie\nJulie Fannon\nCo-Owner, Chief Marketing Officer\nOffice: 866-900-1146\njulie@naturalistjourneys.com\nwww.naturalistjourneys.com\n\nBe like me, be carbon free—don't print this and save a tree!"}, {"dir": "out", "ts": "2026-10-21T21:25:14+03:00", "from": "kri_bileskalne@tiernantravelhq.com", "subject": "Fwd: Re: Room count and itinerary link for NJ's Southeast England trip (ENGL PVT SMRA 27)", "body": "---------- Forwarded message ---------"}]}, {"email": "horst@dancingspirittours.com", "name": "Friedrich Prelog", "company": "Dancing Spirit Tours", "slug": "tiernan-decom", "status": "Meeting Completed", "group": "Meeting Completed", "flags": [], "days_quiet": 53, "meta": "6 inbound / 6 out · we wrote 53d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:da-t0fN0TTfXciJdwz9HdWirsi&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-08-11T21:28:46+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Friedrich - thoughts?", "body": "Hi Friedrich\nI saw you already run England trips, and it feels like we could be a strong fit for the ground side of that style of journey.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nOpen to seeing the draft?\nCheers,\nKristine, Founder Tiernan Travel"}, {"dir": "in", "ts": "2026-08-12T03:30:09+03:00", "from": "horst@dancingspirittours.com", "subject": "Re: Friedrich - thoughts?", "body": "Hello Kristine,\nThank you for connecting with us.\nWe have decided to discontinue our “Celtic Shamanism England” journey, with this year being our final journey. However, we have something new in mind, and after looking through your profile and website and learning a little more about Tiernan Travel, I think there may be an interesting opportunity for us to work together.\nI will reach out to you shortly with some initial ideas and to explore where our organizations might be a good match.\nIn the meantime, could you please send me the sample white-label itinerary you mentioned? I’m curious to see it and to learn a little more about your company and how you work.\nI look forward to staying in touch.\nYours,\nHORST Friedrich PRELOG +15198517006\nhorst@dancingspirittours.com\nwww.dancingspirittours.com\nwww.ninahirlaender.com"}, {"dir": "out", "ts": "2026-08-12T03:36:22+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Friedrich - thoughts?", "body": "Hi Friedrich,\nThanks for coming back - and good to know something new is taking shape. I'll look forward to hearing the ideas when you're ready.\nHere's the England sample in the meantime:\nEngland sample\nEight days, London into the Cotswolds - Rosewood London, Cowley Manor, Cliveden House. It gives a fair read of the standard we work at. Everything goes out white-label in your name and is built fully custom to the group, so whatever direction the new journey takes, the itinerary would be built around that brief from scratch.\nMore here if you want a wider look: tiernantravel.com/experiences\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "out", "ts": "2026-08-17T17:30:39+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Friedrich - thoughts?", "body": "Hi Friedrich,\nWondering if one of the samples caught your eye.\nI can tailor an initial proposal for you within 48 hours - you can test against your audience and see if it fits, no strings.\nJust tell me number of guests and ballpark budget and what sample to base it on and I will get started on that.\nBest,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-08-31T02:32:29+03:00", "from": "horst@dancingspirittours.com", "subject": "Dancing Spirit Tours opportunity", "body": "Dear Kristine,\nWe are planning a four-night retreat in the Dublin area from October 28 to November 1, 2028. The theme of the retreat will be early Celtic mysticism and early Christianity, and the dates were selected to coincide with Samhain, an important tradition in Celtic culture.\nWe are currently in the process of selecting a resort in or around Dublin and anticipate approximately 45 guests. Some participants will likely want to extend their stay by a few days to explore more of Ireland, and this is where we believe you could play an important role.\nBased on our previous experience, approximately half of our participants may be interested in a two- or three-day post-retreat program. Their interests would be influenced primarily by the theme of our retreat, although the program would not need to be limited exclusively to Celtic or early Christian sites.\nIf you would be interested in developing and managing this optional extension, please let me know. I believe it could create an excellent partnership between our two organizations.\nFor more information about our work, please visit our websites or listen to Nina’s podcast series.\nI look forward to hearing from you.\nWarm regards,\nHorst Friedrich\nHORST PRELOG +15198517006\nhorst@dancingspirittours.com\nwww.dancingspirittours.com\nwww.mysticalspirituality.com\nNina’s Podcast Holy Rebels"}, {"dir": "out", "ts": "2026-09-04T21:22:32+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Dancing Spirit Tours opportunity", "body": "Hi Friedrich,\nGood to hear back, and thank you for setting it out so clearly.\nYes, that is exactly the kind of work we take on. Two or three days out of Dublin for around twenty guests, built around the theme of the retreat, is well within what we run, and we would design it and manage it end to end in your name.\nThe Boyne Valley is a short run from Dublin and carries that theme well, with Newgrange, Tara and the Samhain associations around Meath, and Glendalough works as the monastic counterpoint to the south. None of it has to stay strictly Celtic or early Christian. If the group splits by interest we can run more than one option across the same days rather than putting everyone on one route.\nYou mentioned you are still choosing the resort. Happy to give you a read on the Dublin-area properties you are shortlisting if that is useful.\nIf you are up for a quick call next week, we can have a quick chat and if it feels right, you can share the details properly and I can have a proposal ready for you within 48 hours.\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-08T18:14:28+03:00", "from": "horst@dancingspirittours.com", "subject": "Re: Dancing Spirit Tours opportunity", "body": "Hello Kristine, Sounds good - let’s have a quick call and chat - if it’s ok pls schedule on my calendar and let’s have a zoom call if that works for you.\nBtw - Friedrich is my middle name and I used it in LinkedIn for Dancing Spirit Tours - you a call me Horst\nLooking forward to meet you\nHorst\nHORST PRELOG +15198517006\nhorst@dancingspirittours.com\nwww.dancingspirittours.com\nwww.ninahirlaender.com"}, {"dir": "in", "ts": "2026-09-08T18:17:12+03:00", "from": "horst@dancingspirittours.com", "subject": "Fwd: Dancing Spirit Tours opportunity", "body": "Sorry - forgot to add the LINK to schedule the meeting\nHorst\nBegin forwarded message:"}, {"dir": "out", "ts": "2026-09-08T19:27:03+03:00", "from": "bileskalne_kristine@tiernantream.com", "subject": "Re: Fwd: Dancing Spirit Tours opportunity", "body": "Hi Horst - booked for tomorrow, 9 September, 9:00am your time (2:00pm here in London). Zoom link's on the invite, looking forward to it.\nBest,\nKristine"}, {"dir": "in", "ts": "2026-09-08T19:28:52+03:00", "from": "horst@dancingspirittours.com", "subject": "Re: Dancing Spirit Tours opportunity", "body": "Sounds good! Looking forward to it!\nHorst"}, {"dir": "in", "ts": "2026-09-09T21:44:22+03:00", "from": "horst@dancingspirittours.com", "subject": "Re: Dancing Spirit Tours opportunity", "body": "Dear Kristine,\nIt was a pleasure speaking with you on Zoom today. I look forward to receiving your proposal; anytime within the next two weeks would be perfectly fine.\nOne thing I forgot to ask: Are there any other hotels you would recommend for our workshop besides those I am already considering?\nI would greatly appreciate your input.\nBest regards,\nHorst\nHORST PRELOG +15198517006\nhorst@dancingspirittours.com\nwww.dancingspirittours.com\nwww.ninahirlaender.com"}, {"dir": "out", "ts": "202 l.com/experiences\nAre your groups usually built around a scholar or cultural expert you bring along, or do you lean on local guides on the ground?\nKind regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-07-29T22:58:21+03:00", "from": "christoph@dresslerdetours.com", "subject": "Re: Christoph - thoughts?", "body": "Kristine,\nSpectacular trip. We would have to whittle this down, maybe open more free time here and there or help me see each day's balance and value. I am not all to familiar with Ireland. Basically, we might need to settle on a price-point between Euro 4-5k to us, so that we can make it work without going all too high, keeping the total price point for pax to US$ 6-7k max (The exchange rate for the UK and Europe, for example, is getting us this year.)\nRegarding your question: Yes, we like to have a trip expert on board, however, this can be someone you have in mind. We like to have stellar tour guides as the main leaders. Our Portugal, Romania, and Montenegro trips work that way as well. The DMCs have kindly shared a top guide with us and we get to promote them on our pages. Some trips, however, come with trip experts that we find, like our Normandy trip, our Sicily and Southern Italy Trip, et cetera.\nChristoph"}, {"dir": "out", "ts": "2026-07-30T19:18:11+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Re: Christoph - thoughts?", "body": "Hi Christoph,\nAll workable - nothing in that sample is fixed. Shortening it and opening up more unstructured time is normal; every itinerary is built from scratch to the brief.\nOn guides, that is how we already work. Local driver-guides are standard, and you would promote them the same way you do in Portugal and Romania.\nOn price, you are an operator, so this goes to you on net rates, white-label in your name. I can't put a per-person figure on it until I know group size and nights though - so how about a quick call tomorrow to pin those down? I'll build you a custom proposal off the back of it within 48 hours, laid out day by day so you can see where the value sits.\nI'm in Bangkok at the moment, so mornings your time work best - is 9am Friday (or 8am if easier) possible for you?\nKind regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-07-30T23:11:45+03:00", "from": "christoph@dresslerdetours.com", "subject": "Re: Christoph - thoughts?", "body": "Hello Kristine,\nI could do a 9 am tomorrow. I will send an invite and if things change, let me know. I believe you might be asleep already right now.\nChristoph"}, {"dir": "in", "ts": "2026-07-30T23:13:38+03:00", "from": "christoph@dresslerdetours.com", "subject": "Invitation: Kristine and Christoph Dressler  @ Fri Jul 31, 2026 9am - 10am (MDT) (kristinebileskalne@tiernantraveltours.com)", "body": "Kristine and Christoph Dressler Join with Google Meet – You have been invited by Christoph Dressler to attend an event named Kristine and Christoph Dressler on Friday Jul 31, 2026 ⋅ 9am – 10am (Mountain Time - Denver).\n Join with Google Meet\nMeeting link\nmeet.google.com/wgd-itum-rdi\nJoin by phone\n(US) [+1 678-801-8230](tel:+1-678-801-8230%3B416045869%23)\nPIN: 416045869\nMore phone numbers\nWhen\nFriday Jul 31, 2026 ⋅ 9am – 10am (Mountain Time - Denver)\nGuests\nChristoph Dressler - organizer\nkristinebileskalne@tiernantraveltours.com\nView all guest info\nReply for kristinebileskalne@tiernantraveltours.com\n Yes\n No\n Maybe\n More options\nInvitation from Google Calendar\nYou are receiving this email because you are subscribed to calendar notifications. To stop receiving these emails, go to Calendar settings, select this calendar, and change \"Other notifications\".\nForwarding this invitation could allow any recipient to send a response to the organizer, be added to the guest list, invite others regardless of their own invitation status, or modify your RSVP. Learn more"}, {"dir": "out", "ts": "2026-07-31T10:27:02+03:00", "from": "kristinebileskalne@tiernantraveltours.com" nKathleen Hynes 51 yrs\nLive in Seattle\nWine Lovers\n12 nights Max\nFor reference this is what they did last year.\nTheir total was $10650 Euro for all 3 of them for the hiking portion only. The additional nights were booked outside of this package so there is room for movement in pricing if everything is included.\nLet's allow for 2 nights in London at the end of the trip.\nInclude 12% commission in pricing.\nIATA: 96523895\n(Host Agency is Mason Horvath Inc)\nThanks so much Kristine,\n--\nChrissy Duncan\nTravel Designer\nAn Independent Affiliate of Mason Horvath, a Virtuoso Member\nwww.masonhorvath.com\nCell: + 1 604 773 9304\nEmail: Chrissy@CjOnTheGoTravel.com\nWebsite: CjOnTheGoTravel.com\nInstagram: @Cj.On.The.Go\nQ. Need to Book a  Hotel ?"}, {"dir": "out", "ts": "2026-10-08T21:10:39+03:00", "from": "kristine-bi@tiernantravelhq.com", "subject": "Fwd: Re: Chrissy - thoughts?", "body": "---------- Forwarded message ---------"}]}, {"email": "charlie@britainbychoice.com", "name": "Charlie Newton", "company": "Britain By Choice", "slug": "tiernan-decom", "status": "Meeting Completed", "group": "Meeting Completed", "flags": [], "days_quiet": 32, "meta": "3 inbound / 5 out · we wrote 32d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:da-plqcwi2MNBPJ4ETFoR8Dz3M&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-09-10T22:27:54+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Charlie - thoughts?", "body": "Hey Charlie\nYou've already got Britain and Ireland on the map, and it feels like we could be a strong fit for the ground side of that style of trip.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nMind if I send it over?\nCheers,\nKristine, Founder Tiernan Travel"}, {"dir": "out", "ts": "2026-09-14T20:52:27+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Re: Charlie - thoughts?", "body": "Hi Charlie\nI realize the initial email might have gotten buried as you focus on growing Britain By Choice.\nI wanted to quickly circle back to the sample UK & Ireland itinerary.\nIf the UK & Ireland is a region your clients ever ask about, let me know if I can send that 1-page overview over?\nRegards,\nKristine"}, {"dir": "in", "ts": "2026-09-15T18:10:40+03:00", "from": "charlie@britainbychoice.com", "subject": "RE: Charlie - thoughts?", "body": "Hi Kristine:\nAfter 60 years in the travel industry, my daughters persuaded me to retire. I almost did, then I received an inquiry from a Virtuoso agent with 2 clients visiting Ulster, Scotland, with tickets for the Open Golf, and London with chauffeurs and 4 star hotels. How could I turn away a $20,000 sale? I decided to do another year and look for a company to look after my American clients. Might you be interested?\nRegards\nCharlie Newton (President)\nBritain by Choice\nThe Old Anchorage\nLochranza.KA27 8HL\nIsle of Arran\nPhone: +44 (0) 1770 830 240\nUS Cell: 972 877 0082\nEmail: charlie@britainbychoice.com\nWeb: https://www.britainbychoice.com"}, {"dir": "out", "ts": "2026-09-15T18:21:42+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Re: Charlie - thoughts?", "body": "Hi Charlie,\nSixty years in the industry and you're still closing $20,000 Virtuoso trips - that's a hard thing to walk away from.\nTo answer your question: yes, absolutely. That brief is exactly our lane - Ulster, Scotland, Open Golf, London, chauffeurs, 4-star and up. We handle the ground for American clients coming through advisors: private drivers, handpicked hotels, the logistics on the day, and a UK contact for the duration. Everything goes out under your name.\nHere's a Scotland sample so you can see the standard we work at:\nScotland sample\nAnd if golf is a regular thread for your clients, this one is worth a look too:\nThe Golfing Trail: Scotland's Best Greens\nMore here if you want a wider look: tiernantravel.com/experiences\nIs the Virtuoso client still in the planning stage, or do you have dates locked?\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-15T19:41:48+03:00", "from": "charlie@britainbychoice.com", "subject": "RE: Charlie - thoughts?", "body": "Hi Kristine:\nYes, 60 years is a long time and is becoming harder to quit when I consider what there would be to fill my days!\nLooking at our websites our companies have developed in similar ways. Although I feature some 40 itineraries, I have not sold one without some element of customization.\nIll health over the last two years has forced me to cut back on marketing but the average sale has been in excess of $10,000. I have a 10 year old database of over 3000 USA Travel Agents which would be available to a colleague taking on the business.\nI have contracts with several sightseeing companies, Enterprise Car Rental – UK and Ireland - LNER and GWR and private hire vehicles across the country.\nThe itinerary for the Virtuoso Agent is complete apart from pricing of attractions entries. Arriving Dublin on July 08 and departing London, for Paris on July 26.\nIn recent years I have been fighting Hotel Revenue Managers moving from fixed IIT rates to Dynamic pricing. As a result I have signed a contract with HyperGuest who offer on line reservations at1020 UKHotels.\nPerhaps we might discus the possibilities later this week.\nRegards\nCharlie Newton (President)\nBritain by Choice\nThe Old Anchorage\nLochranza.KA27 8HL\nIsle of Arran\nPhone: +44 (0) 1770 830 240\nUS Cell: 972 877 0082\nEmail:  charlie@britainbychoice.com\nWeb:  https://www.britainbychoice.com"}, {"dir": "out", "ts": "2026-09-15T19:54:42+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Fwd: RE: Charlie - thoughts?", "body": "---------- Forwarded message ---------"}, {"dir": "in", "ts": "2026-09-30T12:49:47+03:00", "from": "charlie@britainbychoice.com", "subject": "Britain by Choice", "body": "Hi Kristine:\nI enjoyed our chat yesterday morning and look forward to speaking again once you have read the attachments:\nRequest received from the agent for next July\nThe proposal now accepted by the client\nFIT Contracts in place for 2026\nSample itinerary and general notes\nProfile of Alveston Manor\nBritain by Choice Inc is registered as a USA corporation in Texas. My Dallas based CPA, advises that ownership can be held by a non American resident. All invoices are issued in US$ with client credit card payments being deposited in our account at Bank of America, with funds being transferred once a month to our UK Sterling account for disbursement to suppliers. I have a book-keeper in Dallas who is a signatory on the US$ account, prepares and ships travel documents enclosing the commission check.\nLike yourselves, Britain by Choice does not book flights. All itineraries commence with Meet and Greet at the airport. I do have an agreement with Littles Chauffeur Drive. However using Intercity rail for longer transfers, I tend to work with local taxi firms in Edinburgh. Glasgow, Pitlochry, St. Andrews, Inverness and Skye, as well as London, York, Cornwall and Llandudno. This is much more flexible, as the drivers have deeper local knowledge without the need for overnight accommodation for drivers.\nI work primarily with 4-star hotels and sightseeing companies like Premium and Rabbies. Where possible I arrange entry to attractions of interest to clients.\nI also arrange Golf Tee Times and London Theater seats as a service non commissionable and charging a token 3% to cover credit card charges.\nI have built a library of profile of all attractions, golf courses, hotels, restaurants, tours and transportation used over the years, which are included with each itinerary. Each category is subdivided by country.\nThe Britain by Choice name is recognized by Visit Britain and Visit Scotland and across the United States on my data base of over 2,500 travel agents. This will be made available to you.\nThe company was registered with a share capital of $1000 in February 2001. Name recognition will ease transition so I suggest selling you the Britain By Choice Inc name for £1000, to include access to rate agreements and data base of agents.\nRegards\nCharlie Newton (President)\nBritain by Choice\nThe Old Anchorage\nLochranza.KA27 8HL\nIsle of Arran\nPhone: +44 (0) 1770 830 240\nUS Cell: 972 877 0082\nEmail:  charlie@britainbychoice.com\nWeb:  https://www.britainbychoice.com"}, {"dir": "out", "ts": "2026-09-30T12:55:03+03:00", "from": "kristinebileskalne@tiernantraveltours.com", "subject": "Fwd: Britain by Choice", "body": "---------- Forwarded message ---------"}]}, {"email": "kristy@wondercraftedtravel.com", "name": "Kristy", "company": "WonderCrafted Travel", "slug": "tiernan-decom", "status": "Meeting Completed", "group": "Meeting Completed", "flags": [], "days_quiet": 19, "meta": "3 inbound / 3 out · we wrote 19d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:ff-4LiuETQlbFMwi5qYBhv8xta&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-09-24T19:21:56+03:00", "from": "bilkristine@tiernantream.com", "subject": "Kristy - thoughts?", "body": "Hello Kristy\nI noticed your focus on Hawaii and the Mexican Caribbean, and I wondered whether the UK & Ireland ever comes up with those clients.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nWould you like to take a look?\nBest,\nKristine, Founder Tiernan Travel"}, {"dir": "in", "ts": "2026-09-25T01:29:55+03:00", "from": "kristy@wondercraftedtravel.com", "subject": "Re: Kristy - thoughts?", "body": "Hi Kristine,\nThank you for reaching out and offering a white-label itinerary example! I'd actually prefer to connect, if possible, as I think a conversation will tell us both much more about whether we're a good fit.\nI've planned three trips to Ireland and the UK and have two open UK inquiries right now, so your timing is perfect, as I'm struggling to find a DMC partner in those areas. For that reason, I build these trips myself. That said, for some clients I think a DMC partner would add real value, and I'd like to find the right one. I'd also like to host a group in the future—I have TONS of interest—but I don't want a group escorted tour.\nFull disclosure: I'm a big fan of DMCs when it makes sense, BUT I'm also very selective (and critical). They aren't all created equal, as you know. I don't do cookie-cutter travel, and I can easily plan the \"big musts\" myself. I'm also very strong on logistics and attention to detail, so what I value most in a DMC partner is:\nTrue inside access: the ability to take my clients off the beaten path to experiences only a local would know about\nExceptional service: on-the-ground support that makes my clients feel taken care of from start to finish\nI understand that pricing needs to support both the DMC and my commission; however, what I often find is that the pricing is very high and the value isn't there. I'm looking for pricing that matches what my clients actually get. While I've only been planning travel for 18 months, with over 20 years of personal and professional travel, I can spot value and quality! When it's there, I can sell it, and I'd happily plan with a DMC instead of building the trip FIT!\nI'd love to set up a time to chat. What does your availability look like? I also sent you a LinkedIn invite so we can stay connected.\nKristy J. Johnson WonderCrafted Travel"}, {"dir": "out", "ts": "2026-09-25T14:11:49+03:00", "from": "bilkristine@tiernantream.com", "subject": "Re: Kristy - thoughts?", "body": "Hi Kristy,\nThank you for such an honest reply - and you're right, DMCs are not all created equal.\nI would love to have a chat, I think we can be a good fit based on your requirements, happy to tell you more on a call.\nEasiest to handle timezones is for you to pick the time that suits you\nLooking forward to it!\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-09-25T19:03:58+03:00", "from": "notifications@calendly.com", "subject": "New Event: Kristy Johnson, WonderCrafted Travel - 15:00 Wed, 30 Sep 2026 - Introduction Call", "body": "Calendly\nHi Kristine Bileskalne,\nA new event has been scheduled.\nEvent Type:\nIntroduction Call\nInvitee:\nKristy Johnson, WonderCrafted Travel\nInvitee Email:\nkristy@wondercraftedtravel.com\nEvent Date/Time:\n15:00 - Wednesday, 30 September 2026 (UK, Ireland, Lisbon Time)\nLocation:\nThis is a Google Meet web conference.\nJoin now\nInvitee Time Zone:\nCentral Time - US & Canada\nView event in Calendly\nPro Tip!\nGet Calendly on Mobile\nQuickly share meeting links, get notifications for new, cancelled, or rescheduled meetings, and view your upcoming schedule on-the-go! Get Calendly for iPhone or Android.\nSee all apps\nSent from Calendly\nReport this event"}, {"dir": "in", "ts": "2026-10-13T22:14:01+03:00", "from": "kristy@wondercraftedtravel.com", "subject": "Client Inquiry - Ireland/Scotland, Sept 2027", "body": "Hi Kristine,\nNo action needed just yet, but I wanted to get your take on how realistic it is to secure tickets or hospitality packages for the Ryder Cup in September 2027. It would be part of the broader curated itinerary.\nI have a client planning a surprise 50th birthday trip to Scotland and Ireland for her husband. When she asked about the best time to go, I suggested May, June, or September, but mentioned that September 2027 could be challenging due to the Ryder Cup. Her response was, “We’d love to go to the Ryder Cup!” She and her husband are both attorneys, so I expect they’ll have some budget flexibility, but I’m not sure access is realistic at this point.\nI’m seeing her tomorrow at a professional networking event, so I hope to be prepared to set realistic expectations and possibly steer her toward a different timeframe if needed.\nThank you so much!\nKristy"}, {"dir": "out", "subject": "Re: Dressler Detours Scotland", "body": "Hello Kristine,\nThis reads fantastic. I assume this will be fully guided. Do you have go-to guides you work with?\nWhat would an itinerary like this cost? Please note that we like to compensate our guides well and fair, meaning any tip-expectations should be talked about and set into the price we would owe you, so that not only we have transparence amongst us, but also to take out the guess-work and the awkwardness of the sometimes sourness of the tipping situation for our guest.\nBefore we go any further with additional itineraries, let me talk to Taunya a little more. Our trips for 2027 are already up and running, but I can see this potentially working as a second/follow-up trip to our Scotland experience. It may, however, be too much for us now and we may have to consider this for 2028. Again, sign-ups this year are slow. We have to do some thinking.\nBest for now!\nChristoph"}]}, {"email": "info@whitacretravel.com", "name": "", "company": "Whitacre Travel", "slug": "tiernan-decom", "status": "Meeting Completed", "group": "Meeting Completed", "flags": [], "days_quiet": 15, "meta": "1 inbound / 2 out · we wrote 15d ago", "summary": "", "reminders": [], "unibox_url": "https://app.instantly.ai/app/unibox?thread_search=thread:ee-mzo8buVje4S60vMIY1fG_lF&selected_wks=3c28d28e-a366-4b7b-88dd-a3b2cc05b8db", "thread": [{"dir": "out", "ts": "2026-10-16T22:32:50+03:00", "from": "kristine.bileskalne@tiernantraveldmc.com", "subject": "UK & Ireland tour", "body": "Hey, not sure who at Whitacre Travel looks after your ground partners, maybe you can point me to the right person?\nYou've already got London and the UK on the map, and it feels like we could be a strong fit for the ground side of that style of trip.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nMind if I send it over?\nCheers,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": reland would go down just as well.\nSo I went ahead and built a sample white-label itinerary you could put your name on.\nWould you like to take a look?\nCheers,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": "out", "ts": "2026-10-20T20:04:35+03:00", "from": "bileskalne_k@tiernantravelhq.com", "subject": "Re: UK tour", "body": "Hello\nI realize the initial email might have gotten buried as you focus on growing Skyway Tours.\nI wanted to quickly circle back to the sample UK & Ireland itinerary.\nIf the UK & Ireland is a region your clients ever ask about, let me know if I can send that 1-page overview over?\nBest,\nKristine,\nFounder, Tiernan Travel - UK & Ireland ground operator for travel advisors"}, {"dir": "in", "ts": "2026-10-21T16:47:44+03:00", "from": "perry@skywaytours.com", "subject": "RE: UK tour", "body": "Hello Kristine,\nThank you for the email. Will you be able to quote on this below?\n3 pax (double and single).\nThis is a custom group tour. I realize we cannot do everything as listed, but if we offer something similar (they are open to modifications).\nIt would be for May 2027 (arrival 09 departure 19, 10 nights).\nFlights to Edinburgh\nFlights to Edinburgh with direct flights.\nD02 Edinburgh - Glasgow (2 nights)\nArrival in Edinburgh in the morning. Welcome by your French-speaking guide and transfer to Glasgow for a\npanoramic tour of the city. Accommodation in the late afternoon and welcome dinner . S\nD03 Glasgow – Falkirk Region – Glasgow\nVisit Stirling Castle , a major historical site of Scottish history. Continuation to the\nKelpies , impressive statues of steel horses 30 meters high. Then stop at the\nwheel of Falkirk , incredible rotary boat lift. PD\nD04 Glasgow – Loch Lomond National Park – Glencoe Valley – Fort William (2 nights)\nscenic route through the spectacular\nLoch Lomond National Park , which offers a unique landscape of lakes, forests and mountains and\ncrossing Glencoe, one of the most renowned valleys in the Highlands. Arrival in\nFort William , a seaside resort located on the shores of Loch Linnhe and at the foot of Britain’s highest mountain, Ben Nevis. PD/S\nD05 Fort William – Isle of Skye – Fort William\nDeparture to the mythical\nIsle of Skye , where you will cross the southern part, in the heart of landscapes often considered the most beautiful in Britain. We start with\nthe visit of the famous castle of Eilean Donan . Located on an island at the meeting point of three marine lochs, this castle is one of the most iconic of the Scottish Highlands.\nFerry crossing from Armadale to Mallaig for the return to Fort William. The road runs along the\nGlenfinnan viaduct , made famous thanks to the Harry Potter films. Photo stop with a short hike to enjoy the spectacular panorama. Maybe you will have the chance to see the “Hogwarts Express”. PD/S\nD06 Fort William – Fort Augustus - Loch Ness – Elgin (2 nights)\nDeparture to Elgin.\nEn route, stop at the village of Fort Augustus and free time for the discovery of the Caledonian canal. Mini cruise\non the mythical Loch Ness Lake and visit the ruins of Urquhart Castle . Continue to\nElgin and hotel installation. PD/S\nD07 Elgin – Culloden – Fort George – Elgin\nDiscover the c camp de battle de Culloden , a decisive place in Scottish history. Then visit the\ncitadel of Fort George , still in military activity. Continue to Elgin and visit the ruins of Elgin Cathedral (1270) and stop at Johnstons of Elgin, renowned for his work of cashmere. PD/S\nD08 Elgin – Kincraig – Pitlochry (2 nights)\nDeparture to Kincraig to visit a sheep farm and observe the work of shepherd dogs . Continue to\nBlair Castle , rich in furniture and weapons collections. Then drive to\nPitlochry , charming village in the Tummel valley and hotel installation. PD/S\nD09 Pitlochry – Scone Palace – Pitlochry\nVisit the Scone Palace, a symbolic place of the Scottish royal coronations. Discovery of its refined interiors. Then,\nvisit a whisky distillery where you will appreciate the techniques of elaboration and the whisky\ntasting . PD/S\nD10 Pitlochry – Saint Andrews – villages of East Neuk – Edinburgh (2 nights)\nRoad to Saint Andrews , historic university town and cradle of golf.\nVisit the ruins of its castle and medieval cathedral. Continuation along the coast of Fife,\nto discover the fishing villages of the East Neuk . Passage through the\nsuspension bridge of Forth Bridge . Arrival in Edinburgh and hotel installation. PD\nD11 Edinburgh\nGuided walking tour of the fascinating Scottish capital. Passage through the winding streets of the medieval Old Town district, a UNESCO World\nHeritage Site, where St. Gilles Cathedral, Holyrood Palace and Royal Mile Street are located. Visit the\nEdinburgh Castle , an imposing building located on one of the volcanic hills of the city. It houses the royal apartments of the Stuarts and the crown jewels"}, {"dir": "out", "ts": "2026-10-21T17:08:44+03:00", "from": "bileskalne_k@tiernantravelhq.com", "subject": "RE: UK tour", "body": "Hi Perry,\nWhat a route - Skye, Glencoe, Loch Ness, Edinburgh, all the right names for a Scotland group, and yes, we can definitely help with something along these lines for your 3 pax in May 2027.\nInstead of going back and forth on email, it might be easier to hop on a quick call - I can go over the itinerary with you, see where we'd adjust, and make sure we have every detail right before putting a proposal together.\nWhat do you think? Here is my calendar if you want to pick a time.\nRegards,\nKristine, Founder Tiernan Travel\ntiernantravel.com"}, {"dir": "in", "ts": "2026-10-21T17:46:05+03:00", "from": "perry@skywaytours.com", "subject": "RE: UK tour", "body": "Hi Kristine,\nAs you can see from our product list, the UK and Ireland are not part of our destinations. Aside from London, and the typical hotel and transfers business, we don’t offer much of your lovely country.\nThis request came from one of our B2B agencies and  "2026-07-17T19:35:02+03:00", "from": "bileskalne-kr@tiernantream.com", "subject": "Re: Bret - thoughts?", "body": "Hi Bret,\nThanks for the kind note - and how nice that your parents are in Ireland right now. Good timing to be leaning into it.\nSince honeymoons and celebrations are your world, here's one of our sample Ireland honeymoon trips. It's a real client itinerary, so you get the full shape, the named castle stays, and the pricing tier we work in: John & Jane Doe - Ireland Honeymoon\nWe build every trip fully custom, so this is just to give you a feel. Ireland and Scotland also combine into one journey nicely, which is where a lot of advisor requests land.\nMore of the library here: tiernantravel.com/experiences/\nAre your Ireland & Scotland requests leaning honeymoon and anniversary, or more multi-gen family?\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-07-20T17:43:55+03:00", "from": "bret.cook@lovetotravel.com", "subject": "Re: Bret - thoughts?", "body": "Hi Kristine!\nHope you had a great weekend! Thanks so much for sending this itinerary over – it looks wonderful! Couple of quick questions….\nWhat is the typical turnaround time from request to proposal?\nIs the best way to submit a request by email?\nIs commission included in the quotes? If so, what %?\nSay we have a family/couple interested in Ireland, Scotland, and England… would we get 1 itinerary or 3 separate ones from different divisions within\nTiernan Travel?\nFor now, we have gotten a mix of anniversary or leisure trips, and multigenerational trips for Ireland/Scotland. We haven’t advertised Ireland or Scotland much aside from the start of this year, so we are\nhoping to get more and more requests, especially with my parents highlighting a couple of weeks from their recent stay.\nLooking forward to hearing from you!\nBret\n\nBret Cook\nLuxury Travel Manager\n[ 913-681-3688 ](tel:+19136813688)\n lovetotravel.com\n Overland Park, KS\n\nFrom:\nKristine Bileskalne <bileskalne-kr@tiernantream.com>\nDate: Friday, July 17, 2026 at 11:35   AM\nTo: Bret Cook <bret.cook@lovetotravel.com>\nSubject: Re: Bret - thoughts?\nHi Bret,\nThanks for the kind note - and how nice that your parents are in Ireland right now. Good timing to be leaning into it.\nSince honeymoons and celebrations are your world, here's one of our sample Ireland honeymoon trips. It's a real client itinerary, so you get the full shape, the named castle stays, and the pricing tier we\nwork in: John & Jane Doe - Ireland Honeymoon\nWe build every trip fully custom, so this is just to give you a feel. Ireland and Scotland also combine into one journey nicely, which is where a lot of advisor requests land.\nMore of the library here: tiernantravel.com/experiences/\nAre your Ireland & Scotland requests leaning honeymoon and anniversary, or more multi-gen family?\nWarm regards,\nKristine\ntiernantravel.com\nOn Friday, Jul 17, 2026 at 7:19 pm\nbret.cook@lovetotravel.com wrote:\nHi Kristine!\nThanks for reaching out – I can’t remember where, but I have heard great things about Tiernan Travel! My parents (owners of Love to Travel) are over in Ireland right now and I had the chance to visit Ireland\n& Scotland earlier this year, so we are certainly starting to offer it more often and in need of additional partners.\nI’d love to take a look at a sample itinerary when you have a chance.\nBest regards,\nBret\n\n__BASE64_IMAGE_PLACEHOLDER_0__\n__BASE64_IMAGE_PLACEHOLDER_1__\nBret Cook\nLuxury Travel Manager\n[ __BASE64_IMAGE_PLACEHOLDER_2__ 913-681-3688 ](tel:+19136813688)\n __BASE64_IMAGE_PLACEHOLDER_3__ lovetotravel.com\n Overland Park, KS\n __BASE64_IMAGE_PLACEHOLDER_4__"}, {"dir": "out", "ts": "2026-07-20T19:14:09+03:00", "from": "bileskalne-kr@tiernantream.com", "subject": "Re: Bret - thoughts?", "body": "Hi Bret,\nSounds like the Ireland and Scotland demand is building nicely - and good timing with your parents out there now. Quick answers:\nTurnaround: 24-48 hours on working days, once we have dates, party size, interests, accommodation standard, and arrival city.\nSubmitting a request: email is perfect - just send the brief to me here.\nCommission: We offer both, depending on our partners.\nIreland + Scotland + England: one itinerary, one point of contact. Multi-country UK & Ireland in a single seamless journey is exactly what we're built to run, so your client never sees the seams.\nWhen these requests come in, what does the sweet spot look like for your clients - more the 4- and 5-star, private driver-guide end, or something a bit more mid-range? Helps me point you to the right sample next.\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-07-20T21:55:59+03:00", "from": "bret.cook@lovetotravel.com", "subject": "Re: Bret - thoughts?", "body": "Hi Kristine,\nThanks for the quick response! That sounds easy enough - I will gladly give you a shot on the next opportunity!\nIt’s been a bit of a mix of requests. I’d say if it is one of our previous clients or referrals, is looking for more of a 4 star to high-end experience. The ones looking for more of a mid-range option seem to be random inquiries that found us online or were\nmaybe referred.\nThanks again,\nBret\n\nBret Cook\nLuxury Travel Manager\n[ 913-681-3688](tel:+19136813688)\n lovetotravel.com\n Overland\nPark, KS"}, {"dir": "out", "ts": "2026-07-21T19:43:41+03:00", "from": "bileskalne-kr@tiernantream.com", "subject": "Re: Bret - thoughts?", "body": "Hi Bret,\nGreat to hear - looking forward to working together when the next one lands.\nWe are more on the 4-star-and-up, private driver-guide end, so your returning clients and referrals sound like a natural fit. The mid-range inquiries might be a trickier match, but honestly the easiest way to figure that out is just a quick call - no pressure at all, just a chance to see where it makes sense.\nLooking forward to hearing from you.\nWarm regards,\nKristine\ntiernantravel.com"}, {"dir": "in", "ts": "2026-07-22T18:48:33+
